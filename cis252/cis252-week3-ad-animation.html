<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS 252 Week 3 — Active Directory</title>
<style>* { margin:0; padding:0; box-sizing:border-box; } body { background:#02060f; overflow:hidden; font-family:"Segoe UI",Arial,sans-serif; } canvas { display:block; width:100vw; height:100vh; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var c=document.getElementById("c"),ctx=c.getContext("2d");
var W,H,frame=0,particles=[],floaters=[],authBeams=[],beamTimer=0;
var MSBLUE="#0078D4",MSGREEN="#107C10",MSRED="#D13438",MSYELLOW="#FFB900";
var CONCEPTS=["AD DS","Domain Controller","Forest","Domain","OU","GPO","LSDOU","ADUC","Schema","Kerberos","LDAP","Trust","Replication","Password Policy","Security Group","User Account"];
var NODES=[
  {id:"domain",label:"Domain",         sub:"corp.contoso.com",  col:"#0078D4",x:.5, y:.34,w:172,h:46,born:30, children:["dc","ou1","ou2"]},
  {id:"dc",    label:"Domain Ctrl",    sub:"DC01 \u00b7 Promoted",   col:"#107C10",x:.2, y:.52,w:148,h:44,born:62, children:[]},
  {id:"ou1",   label:"OU: Staff",      sub:"Users & Groups",    col:"#005a9e",x:.5, y:.52,w:148,h:44,born:80, children:["usr","grp"]},
  {id:"ou2",   label:"OU: Computers",  sub:"Workstations",      col:"#005a9e",x:.8, y:.52,w:148,h:44,born:96, children:["gpo"]},
  {id:"usr",   label:"User Accounts",  sub:"jdoe \u00b7 asmith...",  col:"#2b88d8",x:.36,y:.72,w:138,h:42,born:118,children:[]},
  {id:"grp",   label:"Security Group", sub:"IT-Admins \u00b7 Staff",  col:"#2b88d8",x:.64,y:.72,w:138,h:42,born:132,children:[]},
  {id:"gpo",   label:"Group Policy",   sub:"Password \u00b7 Lock",   col:"#D13438",x:.8, y:.72,w:138,h:42,born:110,children:[]}
];
var nodeMap={};
NODES.forEach(function(n){nodeMap[n.id]=n;});
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize(); window.addEventListener("resize",resize);
for(var i=0;i<60;i++) particles.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.00015,vy:-Math.random()*.00018-.00003,r:Math.random()*1.2+.3,alpha:Math.random()*.22+.04,color:[MSBLUE,"#38a3f5","#60c3ff"][Math.floor(Math.random()*3)]});
for(var j=0;j<CONCEPTS.length;j++) floaters.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.00022,vy:(Math.random()-.5)*.00016,word:CONCEPTS[j],alpha:Math.random()*.14+.04,size:Math.floor(Math.random()*5)+9});
function fadeIn(f,s,d){return Math.max(0,Math.min(1,(f-s)/d));}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);}else{ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}}
function drawWinGrid(cx,cy,sz,alpha){var s=sz*.46;ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=MSRED;ctx.fillRect(cx-s-1,cy-s-1,s,s);ctx.fillStyle=MSGREEN;ctx.fillRect(cx+1,cy-s-1,s,s);ctx.fillStyle=MSBLUE;ctx.fillRect(cx-s-1,cy+1,s,s);ctx.fillStyle=MSYELLOW;ctx.fillRect(cx+1,cy+1,s,s);ctx.restore();}
function drawNode(n,alpha){if(alpha<=0)return;var nx=n.x*W-n.w/2,ny=n.y*H-n.h/2;ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor=n.col;ctx.shadowBlur=20*alpha;rr(nx,ny,n.w,n.h,10);ctx.fillStyle="rgba(2,10,28,.97)";ctx.fill();ctx.strokeStyle=n.col;ctx.lineWidth=1.8;ctx.stroke();ctx.shadowBlur=0;rr(nx,ny,n.w,5,[10,10,0,0]);ctx.fillStyle=n.col;ctx.fill();ctx.font="bold "+Math.floor(H*.028)+"px Segoe UI,Arial";ctx.fillStyle="#fff";ctx.textAlign="center";ctx.fillText(n.label,n.x*W,ny+n.h*.47);ctx.font=Math.floor(H*.02)+"px Segoe UI,Arial";ctx.fillStyle="rgba(255,255,255,.4)";ctx.fillText(n.sub,n.x*W,ny+n.h*.77);ctx.restore();}
function drawEdge(parent,child,alpha){if(alpha<=0)return;var px=parent.x*W,py=parent.y*H+parent.h/2,cx2=child.x*W,cy2=child.y*H-child.h/2;var pulse=(Math.sin(frame*.06+child.born)*.5+.5)*.35+.3;ctx.save();ctx.globalAlpha=alpha*pulse;ctx.strokeStyle=child.col;ctx.lineWidth=1.2;ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(cx2,cy2);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(cx2,cy2,3.5,0,Math.PI*2);ctx.fillStyle=child.col;ctx.fill();ctx.restore();}
function spawnBeam(){var tgts=["usr","grp","dc"],t=nodeMap[tgts[Math.floor(Math.random()*3)]],ok=Math.random()>.15;authBeams.push({x1:.5,y1:.97,x2:t.x,y2:t.y-t.h/2/H,t:0,dt:.022,col:ok?"#34d399":"#f87171",ok:ok});}
function drawBeam(b){var t=Math.min(b.t,1),x1=b.x1*W,y1=b.y1*H,x2=b.x2*W,y2=b.y2*H,cx=x1+(x2-x1)*t,cy=y1+(y2-y1)*t;var g=ctx.createLinearGradient(x1,y1,cx,cy);g.addColorStop(0,"transparent");g.addColorStop(1,b.col+"aa");ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(cx,cy);ctx.strokeStyle=g;ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([]);ctx.save();ctx.shadowColor=b.col;ctx.shadowBlur=16;ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fillStyle=b.col;ctx.fill();ctx.restore();if(b.t>.55&&b.t<1.06){var mx=x1+(x2-x1)*.65,my=y1+(y2-y1)*.65;ctx.font="bold 11px Segoe UI,Arial";ctx.fillStyle=b.col;ctx.textAlign="center";ctx.fillText(b.ok?"AUTHENTICATED":"DENIED",mx,my-10);}}
function drawUser(a){if(a<=0)return;var ux=W*.5,uy=H*.955;ctx.save();ctx.globalAlpha=a;for(var r=0;r<3;r++){var pr=((frame*.72+r*24)%72)/72;ctx.beginPath();ctx.arc(ux,uy,22+pr*42,0,Math.PI*2);ctx.strokeStyle="rgba(0,120,212,"+(1-pr)*.25*a+")";ctx.lineWidth=1.4;ctx.stroke();}ctx.shadowColor=MSBLUE;ctx.shadowBlur=24;rr(ux-26,uy-26,52,52,26);ctx.fillStyle="#001830";ctx.fill();ctx.strokeStyle=MSBLUE;ctx.lineWidth=1.8;ctx.stroke();ctx.shadowBlur=0;ctx.font=Math.floor(H*.058)+"px Arial";ctx.textAlign="center";ctx.fillText("\uD83D\uDC64",ux,uy+11);ctx.font="bold "+Math.floor(H*.018)+"px Segoe UI,Arial";ctx.fillStyle=MSBLUE;ctx.shadowColor=MSBLUE;ctx.shadowBlur=8;ctx.fillText("YOU",ux,uy+32);ctx.restore();}
function animate(){
  frame++;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#02060f";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(0,120,212,0.05)";ctx.lineWidth=1;
  for(var gx=0;gx<W;gx+=50){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
  for(var gy=0;gy<H;gy+=50){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}
  for(var i=0;i<particles.length;i++){var p=particles[i];p.x+=p.vx;p.y+=p.vy;if(p.y<-.01)p.y=1.01;if(p.x<0)p.x=1;if(p.x>1)p.x=0;ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);ctx.fillStyle=p.color+Math.floor(p.alpha*255).toString(16).padStart(2,"0");ctx.fill();}
  for(var j=0;j<floaters.length;j++){var f=floaters[j];f.x+=f.vx;f.y+=f.vy;if(f.x<0)f.x=1;if(f.x>1)f.x=0;if(f.y<0)f.y=1;if(f.y>1)f.y=0;ctx.font=f.size+"px Segoe UI,Arial";ctx.fillStyle=MSBLUE+Math.floor(f.alpha*255).toString(16).padStart(2,"0");ctx.textAlign="center";ctx.fillText(f.word,f.x*W,f.y*H);}
  var wa=fadeIn(frame,5,22),ta=fadeIn(frame,12,28);
  if(wa>0||ta>0){
    var logoSz=Math.min(W*.06,46);
    var titleStr="WEEK 3 \u2014 ACTIVE DIRECTORY";
    var subStr="Installation \u00b7 Configuration \u00b7 Administration \u00b7 CIS 252";
    var tfs=Math.floor(H*.054);
    ctx.font="bold "+tfs+"px Segoe UI,Arial";
    var tW=ctx.measureText(titleStr).width;
    var gap=12,groupW=logoSz+gap+tW;
    var sx=W/2-groupW/2,cy2=H*.1;
    if(wa>0) drawWinGrid(sx+logoSz/2,cy2,logoSz,wa);
    if(ta>0){
      var tx=sx+logoSz+gap;
      ctx.save();ctx.globalAlpha=ta;ctx.shadowColor=MSBLUE;ctx.shadowBlur=26;
      ctx.font="bold "+tfs+"px Segoe UI,Arial";ctx.fillStyle="#fff";ctx.textAlign="left";
      ctx.fillText(titleStr,tx,cy2+tfs*.38);
      ctx.font=Math.floor(H*.023)+"px Segoe UI,Arial";ctx.fillStyle="#60b4ff";ctx.shadowBlur=8;
      ctx.fillText(subStr,tx,cy2+tfs*.38+Math.floor(H*.023)*1.7);
      ctx.restore();
    }
  }
  NODES.forEach(function(n){var na=fadeIn(frame,n.born,20);n.children.forEach(function(cid){var ch=nodeMap[cid];drawEdge(n,ch,Math.min(na,fadeIn(frame,ch.born,20)));});});
  NODES.forEach(function(n){drawNode(n,fadeIn(frame,n.born,20));});
  var gpoA=fadeIn(frame,125,22);
  if(gpoA>0){var gpo=nodeMap["gpo"],pulse=(Math.sin(frame*.1)+1)*.5;ctx.save();ctx.globalAlpha=gpoA*(0.55+pulse*.45);ctx.font="bold 11px Segoe UI,Arial";ctx.fillStyle=MSRED;ctx.textAlign="center";ctx.fillText("LSDOU enforced",gpo.x*W,gpo.y*H+gpo.h/2+15);ctx.restore();}
  drawUser(fadeIn(frame,55,22));
  beamTimer++;
  if(frame>155&&beamTimer%52===0) spawnBeam();
  for(var bi=authBeams.length-1;bi>=0;bi--){authBeams[bi].t+=authBeams[bi].dt;if(authBeams[bi].t>1.5){authBeams.splice(bi,1);continue;}drawBeam(authBeams[bi]);}
  var ca=fadeIn(frame,148,28);
  if(ca>0){ctx.save();ctx.globalAlpha=ca;ctx.font=Math.floor(H*.016)+"px Segoe UI,Arial";ctx.fillStyle="rgba(0,120,212,.6)";ctx.textAlign="center";ctx.fillText("Domain \u2192 OU \u2192 Users \u00b7 Every login you have ever made passes through this",W/2,H*.927);ctx.font=Math.floor(H*.013)+"px Segoe UI,Arial";ctx.fillStyle="rgba(0,120,212,.28)";ctx.fillText("CIS 252 \u00b7 Prof. Chang \u00b7 Community College of Philadelphia",W/2,H*.957);ctx.restore();}
  requestAnimationFrame(animate);
}
animate();
<\/script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS 4345 — Multi-Cloud Architecture 🌐 Three Landlords Side by Side</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3350;
    --blue:#4f8ef7; --blue-dim:#1e2d4f;
    --green:#3ecf8e; --green-dim:#0d2e1f;
    --red:#f87171; --red-dim:#2e1010;
    --yellow:#fbbf24; --yellow-dim:#2e2208;
    --aws:#FF9900; --aws-dim:#2e1c00; --aws-border:#6b3f00;
    --azure:#0078D4; --azure-dim:#001e3c; --azure-border:#004080;
    --gcp:#34A853; --gcp-dim:#0a2410; --gcp-border:#1a5c2a;
    --text:#e8eaf6; --text2:#8b92b8; --text3:#4a5080;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    min-width:380px; -webkit-font-smoothing:antialiased;
  }
  .skip-link{
    position:absolute; top:-40px; left:0; background:var(--blue); color:#0f1117;
    padding:8px 16px; z-index:100; font-weight:600; text-decoration:none; border-radius:0 0 6px 0;
  }
  .skip-link:focus{ top:0; }

  button:focus-visible, a:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }

  header{
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:14px 20px; display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px; position:sticky; top:0; z-index:10;
  }
  .logo-row{ display:flex; align-items:center; gap:12px; }
  .dots{ display:flex; gap:4px; }
  .dot{ width:12px; height:12px; border-radius:50%; }
  .dot.aws{ background:var(--aws); }
  .dot.azure{ background:var(--azure); }
  .dot.gcp{ background:var(--gcp); }
  .logo-text{ font-family:var(--mono); font-weight:600; font-size:0.95rem; color:var(--text); }
  .pills{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{
    background:var(--surface2); border:1px solid var(--border); border-radius:20px;
    padding:6px 14px; font-family:var(--mono); font-size:0.82rem; color:var(--text2);
    display:flex; align-items:center; gap:6px;
  }
  .pill strong{ color:var(--text); }

  .progress-track{
    height:3px; background:var(--border); width:100%;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg,var(--aws),var(--azure),var(--gcp));
    transition:width 0.4s ease;
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  main{ max-width:820px; margin:0 auto; padding:24px 16px 60px; }
  h1{ font-size:1.3rem; margin:0; }
  .intro{ text-align:center; margin-bottom:20px; }
  .intro p{ color:var(--text2); font-size:0.95rem; max-width:600px; margin:8px auto 0; }

  .round-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:22px; margin-bottom:20px;
  }
  .round-label{
    font-family:var(--mono); color:var(--blue); font-size:0.8rem; letter-spacing:0.05em;
    text-transform:uppercase; margin-bottom:8px;
  }
  .round-card h2{ font-size:1.25rem; margin:0 0 12px; }
  .round-body{ color:var(--text2); line-height:1.6; margin-bottom:16px; font-size:0.98rem; }

  .concept-badge{
    display:inline-flex; align-items:center; gap:8px; background:var(--surface2);
    border:1px solid var(--border); border-radius:8px; padding:8px 14px; margin-bottom:18px;
  }
  .concept-badge .emoji{ font-size:1.2rem; }
  .concept-badge .clabel{ font-weight:600; font-size:0.9rem; color:var(--text); }
  .concept-badge .csub{ font-size:0.78rem; color:var(--text2); display:block; }

  .question-text{ font-weight:600; margin-bottom:14px; font-size:1rem; }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt-btn{
    background:var(--surface2); border:1px solid var(--border); border-radius:10px;
    color:var(--text); padding:14px 16px; text-align:left; font-family:var(--sans);
    font-size:0.95rem; cursor:pointer; transition:background 0.15s,border-color 0.15s,transform 0.1s;
    display:flex; align-items:flex-start; gap:10px; width:100%;
  }
  .opt-btn:hover:not(:disabled){ background:var(--blue-dim); border-color:var(--blue); }
  .opt-btn:disabled{ cursor:not-allowed; }
  .opt-letter{
    font-family:var(--mono); font-weight:600; color:var(--blue); flex-shrink:0;
  }
  .opt-btn.correct-answer{ background:var(--green-dim); border-color:var(--green); }
  .opt-btn.wrong-answer{ background:var(--red-dim); border-color:var(--red); }

  .fb{
    margin-top:18px; border-radius:10px; padding:18px; border:1px solid var(--border);
  }
  .fb.correct{ background:var(--green-dim); border-color:var(--green); }
  .fb.wrong{ background:var(--red-dim); border-color:var(--red); }
  .fb-title{ font-weight:600; font-size:1.05rem; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .fb-text{ color:var(--text); line-height:1.6; margin-bottom:14px; font-size:0.95rem; }
  .breakdown{ display:flex; flex-direction:column; gap:8px; }
  .brow{ display:flex; gap:10px; align-items:flex-start; font-size:0.9rem; color:var(--text2); }
  .brow .icon{ flex-shrink:0; }

  .score-pop{
    font-family:var(--mono); font-size:0.85rem; color:var(--yellow); margin-top:10px;
  }

  .next-btn{
    margin-top:18px; background:var(--blue); color:#0a0d16; border:none; border-radius:8px;
    padding:12px 24px; font-weight:600; font-size:0.95rem; cursor:pointer; font-family:var(--sans);
    display:block;
  }
  .next-btn:hover{ filter:brightness(1.1); }

  .streak-flash{
    animation:flashPulse 0.6s ease;
  }
  @keyframes flashPulse{
    0%{ transform:scale(1); }
    30%{ transform:scale(1.15); color:var(--yellow); }
    100%{ transform:scale(1); }
  }

  .final-screen{ text-align:center; padding:30px 16px; }
  .final-score{
    font-family:var(--mono); font-size:3.2rem; font-weight:600; color:var(--green);
    margin:10px 0;
  }
  .final-stats{
    display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:24px 0;
  }
  .stat-box{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:16px 20px; min-width:120px;
  }
  .stat-box .val{ font-family:var(--mono); font-size:1.5rem; font-weight:600; color:var(--text); }
  .stat-box .lbl{ font-size:0.8rem; color:var(--text2); margin-top:4px; }
  .replay-btn{
    background:var(--green); color:#08150f; border:none; border-radius:8px;
    padding:14px 28px; font-weight:600; font-size:1rem; cursor:pointer; font-family:var(--sans);
  }
  .replay-btn:hover{ filter:brightness(1.1); }

  .cloud-tag{
    font-family:var(--mono); font-size:0.72rem; padding:2px 8px; border-radius:12px; margin-right:6px;
    display:inline-block;
  }
  .cloud-tag.aws{ background:var(--aws-dim); color:var(--aws); border:1px solid var(--aws-border); }
  .cloud-tag.azure{ background:var(--azure-dim); color:var(--azure); border:1px solid var(--azure-border); }
  .cloud-tag.gcp{ background:var(--gcp-dim); color:var(--gcp); border:1px solid var(--gcp-border); }

  @media (max-width:480px){
    .final-score{ font-size:2.4rem; }
    .round-card{ padding:16px; }
    header{ padding:12px 14px; }
  }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header>
  <div class="logo-row">
    <div class="dots" aria-hidden="true">
      <span class="dot aws"></span><span class="dot azure"></span><span class="dot gcp"></span>
    </div>
    <span class="logo-text">CIS 4345 :: MULTI-CLOUD LAB</span>
  </div>
  <div class="pills">
    <div class="pill">Round <strong id="round-el">1</strong>/7</div>
    <div class="pill" aria-live="polite" aria-atomic="true" id="score-el">Score <strong id="score-val">0</strong></div>
    <div class="pill" aria-live="polite" aria-atomic="true" id="streak-el">Streak <strong id="streak-val">0</strong></div>
  </div>
</header>

<div class="progress-track">
  <div class="progress-fill" id="progress-fill" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Quiz progress"></div>
</div>

<main id="main-content">
  <div class="intro" id="intro-block">
    <h1>Multi-Cloud Architecture Showdown 🌐</h1>
    <p>Three landlords, one portfolio. You're the architect deciding how to spread workloads across AWS, Azure, and GCP. Seven real-world scenarios. Think before you click.</p>
  </div>

  <div id="game-area"></div>
</main>

<script>
(function(){
  const scenarios = [
    {
      id:1,
      label:"Scenario 1 — Multi-Cloud Strategy Rationale",
      title:"The CFO Asks: Why Not Just Pick One Cloud?",
      body:"You're the cloud architect at a mid-size healthcare SaaS company. The CFO wants to know why the engineering team is proposing workloads on both AWS and Azure instead of consolidating everything on one provider to 'simplify the contract.' You need to justify the multi-cloud approach in the next budget meeting.",
      concept:"Multi-Cloud Strategy Rationale",
      conceptEmoji:"🎯",
      conceptSub:"Why organizations choose more than one cloud provider",
      question:"Which is the strongest legitimate business reason to justify a multi-cloud strategy here?",
      options:[
        "A. It looks more impressive on the company website and in sales pitches",
        "B. Avoiding vendor lock-in, meeting client contractual requirements (e.g., Azure for government clients), and building redundancy against provider-specific outages",
        "C. Multi-cloud is always cheaper because you can arbitrage pricing every month",
        "D. Engineers get bored using only one cloud, so variety improves morale"
      ],
      correct:1,
      feedback:{
        correct:"Exactly — real multi-cloud decisions are driven by avoiding lock-in, meeting client/regulatory requirements, and building resilience against a single provider's outage or pricing changes. This is a defensible business case, not a technical preference.",
        wrong:"The strongest case is B: avoiding vendor lock-in, satisfying client/contractual requirements, and building redundancy against outages. Cost savings and morale are real side benefits sometimes, but they are not reliable enough to be the primary driver — multi-cloud often costs MORE due to complexity.",
        breakdown:[
          {icon:"✅", text:"Vendor lock-in avoidance protects negotiating leverage on renewal contracts."},
          {icon:"💡", text:"Some clients (e.g., federal agencies) require specific providers like Azure Government."},
          {icon:"⚠️", text:"Common myth: multi-cloud automatically saves money. In reality, operational overhead often increases total cost."}
        ]
      }
    },
    {
      id:2,
      label:"Scenario 2 — Multi-Cloud Challenges",
      title:"The On-Call Nightmare",
      body:"Your team just went multi-cloud six months ago. Last night, an on-call engineer spent 90 minutes troubleshooting an outage because they weren't sure whether the issue was in AWS IAM policies or Azure RBAC roles — the naming and permission models are completely different. Leadership wants a plan to prevent this from happening again.",
      concept:"Multi-Cloud Challenges",
      conceptEmoji:"⚠️",
      conceptSub:"The real operational cost of running more than one cloud",
      question:"What is the core challenge illustrated by this incident, and what's the best first step to address it?",
      options:[
        "A. The challenge is that cloud providers are unreliable; the fix is to switch to a single cloud immediately",
        "B. The challenge is skills fragmentation and inconsistent identity/access models across clouds; the fix is standardized runbooks, cross-cloud training, and a unified identity strategy (e.g., federated SSO)",
        "C. The challenge is that the engineer wasn't smart enough; the fix is to hire more senior staff",
        "D. The challenge is network latency between clouds; the fix is to place all resources in the same physical data center",
        
      ],
      correct:1,
      feedback:{
        correct:"Right — this is a textbook multi-cloud challenge: each provider has its own IAM model, terminology, and console UX, which fragments team knowledge. The fix is investing in standardized documentation, runbooks, cross-training, and centralized identity federation so engineers aren't relearning security models mid-incident.",
        wrong:"The correct diagnosis is B. This isn't a reliability problem or a talent problem — it's the well-documented multi-cloud challenge of skills fragmentation and inconsistent security/identity models. Switching clouds abandons the strategic reasons you went multi-cloud in the first place; it doesn't fix the underlying knowledge gap.",
        breakdown:[
          {icon:"✅", text:"AWS uses IAM policies/roles; Azure uses RBAC with a different resource hierarchy — teams must learn both."},
          {icon:"💡", text:"Federated identity (e.g., Azure AD / Entra ID as a central IdP) reduces cross-cloud confusion."},
          {icon:"⚠️", text:"Common mistake: blaming individual engineers instead of fixing systemic knowledge gaps with documentation and training."}
        ]
      }
    },
    {
      id:3,
      label:"Scenario 3 — Cloud-Agnostic Tools",
      title:"Infrastructure as Code Across Three Providers",
      body:"Your company runs workloads on AWS, Azure, and GCP. Currently, each team writes infrastructure manually through each provider's console, leading to configuration drift and no version history. Management asks you to propose a tool that can define infrastructure consistently across all three clouds using one syntax.",
      concept:"Cloud-Agnostic Tools",
      conceptEmoji:"🔧",
      conceptSub:"Tools that work the same way regardless of underlying cloud provider",
      question:"Which tool set best solves this cross-cloud infrastructure-as-code problem?",
      options:[
        "A. AWS CloudFormation, since it's the most mature IaC tool and can be adapted to any provider",
        "B. Terraform (HashiCorp Configuration Language) with provider plugins for AWS, Azure, and GCP, paired with Kubernetes for container orchestration across clouds",
        "C. Azure Resource Manager (ARM) templates, since Azure is the most enterprise-friendly option",
        "D. Manually scripted Bash scripts calling each provider's CLI, since scripts are universally portable"
      ],
      correct:1,
      feedback:{
        correct:"Correct — Terraform is the industry-standard cloud-agnostic IaC tool because it uses provider plugins to speak each cloud's API while keeping your configuration syntax (HCL) consistent. Kubernetes similarly abstracts container orchestration so the same manifests can run on EKS, AKS, or GKE.",
        wrong:"CloudFormation (A) and ARM templates (C) are provider-specific — they only work within AWS and Azure respectively and cannot manage GCP resources. Bash scripts (D) technically 'work' everywhere but require rewriting all logic per provider CLI, which defeats the purpose of cloud-agnostic tooling. Terraform + Kubernetes (B) is the real answer.",
        breakdown:[
          {icon:"✅", text:"Terraform's provider blocks let one HCL codebase target AWS, Azure, GCP, and dozens of others."},
          {icon:"💡", text:"Kubernetes (EKS/AKS/GKE) abstracts container orchestration so workloads are portable between clouds."},
          {icon:"⚠️", text:"Common mistake: assuming a provider's native IaC tool (CloudFormation/ARM) is 'good enough' for multi-cloud — it isn't portable by design."}
        ]
      }
    },
    {
      id:4,
      label:"Scenario 4 — Comparing Equivalent Architectures Across Clouds",
      title:"Translating a Reference Architecture",
      body:"Your team built a three-tier web application on AWS using EC2 instances behind an Application Load Balancer, with data stored in RDS and static assets in S3. A new client wants the identical architecture deployed on Azure for data residency reasons. You need to map each AWS component to its Azure equivalent.",
      concept:"Comparing Equivalent Architectures Across Clouds",
      conceptEmoji:"🔄",
      conceptSub:"Mapping the same architecture pattern onto different providers",
      question:"Which mapping correctly translates the AWS stack to Azure?",
      options:[
        "A. EC2 → Azure Virtual Machines, Application Load Balancer → Azure Load Balancer (or Application Gateway), RDS → Azure SQL Database, S3 → Azure Blob Storage",
        "B. EC2 → Azure Functions, Application Load Balancer → Azure DNS, RDS → Azure Cosmos DB, S3 → Azure Files",
        "C. EC2 → Azure Kubernetes Service, Application Load Balancer → Azure Traffic Manager, RDS → Azure Table Storage, S3 → Azure Data Lake",
        "D. There is no real Azure equivalent — AWS-specific architectures cannot be replicated on Azure"
      ],
      correct:0,
      feedback:{
        correct:"Correct — this is the standard 'Rosetta Stone' mapping: compute (EC2 ↔ Azure VMs), load balancing (ALB ↔ Azure Load Balancer/App Gateway), managed relational database (RDS ↔ Azure SQL Database), and object storage (S3 ↔ Azure Blob Storage). Same pattern, different vendor names.",
        wrong:"Option A is correct. Azure Functions (serverless) and Cosmos DB (NoSQL) are architecturally different services — they don't map to EC2 (VMs) and RDS (relational). AKS is Azure's Kubernetes offering, not a VM replacement. Every major cloud has near-equivalent services for common patterns; you just need to know the right name.",
        breakdown:[
          {icon:"

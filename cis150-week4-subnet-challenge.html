<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS 150 — Subnet Calculator Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --blue: #4f8ef7;
    --blue-dim: #1e2d4f;
    --green: #3ecf8e;
    --green-dim: #0d2e1f;
    --red: #f87171;
    --red-dim: #2e1010;
    --yellow: #fbbf24;
    --yellow-dim: #2e2208;
    --text: #e8eaf6;
    --text2: #8b92b8;
    --text3: #4a5080;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding: 24px 16px; }
  .wrap { max-width: 780px; margin: 0 auto; }

  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .logo { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--blue); letter-spacing: .08em; }
  .pills { display: flex; gap: 8px; }
  .pill { font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; }
  .pill-score { background: var(--green-dim); color: var(--green); border: 1px solid #1a5c3a; }
  .pill-streak { background: var(--yellow-dim); color: var(--yellow); border: 1px solid #5c4208; }

  /* Progress */
  .prog-wrap { height: 3px; background: var(--surface2); border-radius: 2px; margin-bottom: 20px; }
  .prog-bar { height: 3px; background: var(--blue); border-radius: 2px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .dots { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: background .3s; }
  .dot.done { background: var(--green); }
  .dot.active { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
  .dot-lbl { font-size: 12px; color: var(--text3); font-family: var(--mono); margin-left: 6px; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card-label { font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--text3); margin-bottom: 8px; }
  .card-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .card-sub { font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 14px; }
  .ip-box { font-family: var(--mono); font-size: 18px; font-weight: 600; color: var(--blue); background: var(--blue-dim); border: 1px solid #2a3d70; border-radius: 8px; padding: 12px 16px; letter-spacing: .04em; }

  /* Fields */
  .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .field-wrap { display: flex; flex-direction: column; gap: 5px; }
  .field-label { font-family: var(--mono); font-size: 11px; color: var(--text3); letter-spacing: .06em; }
  .field-input { font-family: var(--mono); font-size: 13px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); outline: none; transition: border-color .2s, background .2s; }
  .field-input:focus { border-color: var(--blue); background: var(--bg); }
  .field-input.correct { border-color: var(--green); background: var(--green-dim); color: var(--green); }
  .field-input.wrong { border-color: var(--red); background: var(--red-dim); color: var(--red); }

  /* Buttons */
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { font-family: var(--sans); font-size: 13px; font-weight: 500; padding: 9px 18px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); transition: all .15s; }
  .btn:hover { border-color: var(--blue); color: var(--blue); }
  .btn.primary { background: var(--blue-dim); color: var(--blue); border-color: #2a3d70; font-weight: 600; }
  .btn.primary:hover { background: var(--blue); color: #fff; }
  .btn.success { background: var(--green-dim); color: var(--green); border-color: #1a5c3a; }

  /* Feedback */
  .feedback { border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; font-size: 13px; line-height: 1.7; display: none; }
  .feedback.success { background: var(--green-dim); border: 1px solid #1a5c3a; color: #7ef5be; }
  .feedback.error { background: var(--red-dim); border: 1px solid #5c1c1c; color: #fca5a5; }
  .feedback.hint { background: var(--blue-dim); border: 1px solid #2a3d70; color: #93c5fd; }
  .fb-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .mono { font-family: var(--mono); }

  /* Visual map */
  .visual-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .subnet-bar { height: 28px; border-radius: 6px; display: flex; align-items: center; padding: 0 10px; font-family: var(--mono); font-size: 11px; font-weight: 600; margin-bottom: 4px; }

  /* Cheatsheet */
  .cheat { background: var(--surface2); border-radius: 8px; padding: 12px 14px; font-family: var(--mono); font-size: 12px; color: var(--text2); line-height: 1.9; margin-top: 10px; border: 1px solid var(--border); }
  .cheat span { color: var(--blue); }

  /* Finish */
  .finish-score { font-family: var(--mono); font-size: 32px; font-weight: 600; color: var(--green); margin: 12px 0; }

  /* Responsive */
  @media(max-width:520px){ .fields-grid{grid-template-columns:1fr;} .header{flex-direction:column;gap:10px;align-items:flex-start;} }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <div class="logo">CIS 150 // NETWORK+ LAB</div>
      <div style="font-size:12px;color:var(--text3);margin-top:4px;font-family:var(--mono)" id="q-badge">Question 1 of 5</div>
    </div>
    <div class="pills">
      <span class="pill pill-score" id="score-el">Score: 0</span>
      <span class="pill pill-streak" id="streak-el">Streak: 0 🔥</span>
    </div>
  </div>

  <div class="prog-wrap"><div class="prog-bar" id="prog" style="width:0%"></div></div>
  <div class="dots" id="dots"></div>

  <div class="card" id="scenario-card">
    <div class="card-label" id="sc-label">Network challenge</div>
    <div class="card-title" id="sc-title"></div>
    <div class="card-sub" id="sc-sub"></div>
    <div class="ip-box" id="sc-ip"></div>
  </div>

  <div class="card">
    <div class="card-label">Your answers</div>
    <div class="fields-grid" id="fields"></div>
    <div class="btns">
      <button class="btn primary" onclick="checkAnswers()">Check answers</button>
      <button class="btn" onclick="showHint()">Show hint</button>
      <button class="btn" id="next-btn" style="display:none" onclick="nextQ()">Next question →</button>
    </div>
  </div>

  <div class="feedback" id="feedback"></div>
  <div id="visual"></div>

</div>

<script>
const Qs=[
  {scenario:"Small office network assignment",sub:"You have been given 192.168.10.0/24. What is the subnet mask, how many usable hosts, and what are the first and last usable host addresses?",ip:"192.168.10.0/24",
   fields:[{l:"Subnet mask",k:"mask",a:"255.255.255.0"},{l:"Network address",k:"net",a:"192.168.10.0"},{l:"First usable host",k:"first",a:"192.168.10.1"},{l:"Last usable host",k:"last",a:"192.168.10.254"},{l:"Broadcast address",k:"bcast",a:"192.168.10.255"},{l:"Usable hosts",k:"hosts",a:"254"}],
   hint:"A /24 means 24 bits are network. 8 bits remain for hosts. 2⁸ = 256 total − 2 = 254 usable.",
   explain:"255.255.255.0 is the classic Class C mask. .0 is network ID, .255 is broadcast. Everything between .1 and .254 is usable.",
   visual:"slash24"},

  {scenario:"Split a /24 into 4 equal subnets",sub:"You have 192.168.1.0/24 and need exactly 4 equal subnets. What CIDR prefix, new subnet mask, and how many usable hosts per subnet?",ip:"192.168.1.0/24 → 4 subnets",
   fields:[{l:"New CIDR prefix",k:"cidr",a:"/26"},{l:"New subnet mask",k:"mask",a:"255.255.255.192"},{l:"Hosts per subnet",k:"hosts",a:"62"},{l:"1st subnet network",k:"s1",a:"192.168.1.0"},{l:"2nd subnet network",k:"s2",a:"192.168.1.64"},{l:"3rd subnet network",k:"s3",a:"192.168.1.128"}],
   hint:"To make 4 subnets you need 2 bits (2²=4). Borrow 2 bits: /24+2=/26. Each /26 = 64 addresses, 62 usable.",
   explain:"255.255.255.192 (/26) splits the /24 into four equal blocks starting at .0, .64, .128, .192. Each block has 62 usable host addresses.",
   visual:"slash26"},

  {scenario:"Engineering dept needs 500+ hosts",sub:"You are assigned 10.0.0.0/8. The engineering team needs at least 500 usable hosts in one subnet. What is the smallest (most efficient) prefix that works?",ip:"10.0.0.0/8 — need 500+ hosts",
   fields:[{l:"Smallest prefix",k:"cidr",a:"/23"},{l:"Subnet mask",k:"mask",a:"255.255.254.0"},{l:"Usable hosts",k:"hosts",a:"510"},{l:"Network address",k:"net",a:"10.0.0.0"},{l:"Broadcast address",k:"bcast",a:"10.0.1.255"},{l:"Last usable host",k:"last",a:"10.0.1.254"}],
   hint:"/24 gives only 254. You need more — try /23. 2⁹−2 = 510 usable hosts. Is 510 ≥ 500? Yes — /23 is the answer.",
   explain:"/23 doubles the /24 host space by borrowing one less bit. The subnet spans two octets: 10.0.0.x and 10.0.1.x giving 510 usable addresses."},

  {scenario:"Identify the subnet for a host",sub:"A workstation has IP 172.16.45.200 with mask 255.255.240.0. What network does it belong to? Provide CIDR notation and the broadcast address.",ip:"172.16.45.200 / 255.255.240.0",
   fields:[{l:"CIDR notation",k:"cidr",a:"/20"},{l:"Network address",k:"net",a:"172.16.32.0"},{l:"Broadcast address",k:"bcast",a:"172.16.47.255"},{l:"Usable hosts",k:"hosts",a:"4094"},{l:"First usable host",k:"first",a:"172.16.32.1"},{l:"Last usable host",k:"last",a:"172.16.47.254"}],
   hint:"255.255.240.0 = /20. In the 3rd octet 240=11110000. Subnet boundaries every 16. 45 falls between 32 and 47 so network = 172.16.32.0.",
   explain:"AND 172.16.45.200 with 255.255.240.0 → 172.16.32.0. The /20 block spans .32.0 through .47.255 giving 4094 usable addresses."},

  {scenario:"VLSM — right-size a WAN link",sub:"A point-to-point WAN link between two routers needs exactly 2 usable host addresses. What is the most efficient subnet prefix and mask? Provide an example network and broadcast.",ip:"Point-to-point WAN link — 2 hosts only",
   fields:[{l:"CIDR prefix",k:"cidr",a:"/30"},{l:"Subnet mask",k:"mask",a:"255.255.255.252"},{l:"Usable hosts",k:"hosts",a:"2"},{l:"Total addresses",k:"total",a:"4"},{l:"Example network",k:"net",a:"192.168.0.0"},{l:"Example broadcast",k:"bcast",a:"192.168.0.3"}],
   hint:"2ⁿ−2=2 means n=2 host bits. 32−2=/30. Only 4 total addresses — exactly what a point-to-point link needs.",
   explain:"/30 is the standard WAN link subnet. 4 addresses: .0 network, .1 router A, .2 router B, .3 broadcast. Zero waste — perfect VLSM."}
];

let st={q:0,score:0,streak:0,answered:false};

function norm(v){return v.trim().toLowerCase().replace(/\s+/g,"");}

function renderDots(){
  let h="";
  for(let i=0;i<Qs.length;i++){
    let cls="dot"+(i<st.q?" done":i===st.q?" active":"");
    h+=`<div class="${cls}"></div>`;
  }
  h+=`<span class="dot-lbl">Q${st.q+1} / ${Qs.length}</span>`;
  document.getElementById("dots").innerHTML=h;
  document.getElementById("prog").style.width=(st.q/Qs.length*100)+"%";
  document.getElementById("q-badge").textContent=`Question ${st.q+1} of ${Qs.length}`;
}

function renderQ(){
  st.answered=false;
  const q=Qs[st.q];
  document.getElementById("sc-label").textContent="Network challenge — IPv4 subnetting";
  document.getElementById("sc-title").textContent=q.scenario;
  document.getElementById("sc-sub").textContent=q.sub;
  document.getElementById("sc-ip").textContent=q.ip;
  let fg="";
  q.fields.forEach(f=>{
    fg+=`<div class="field-wrap">
      <label class="field-label">${f.l}</label>
      <input class="field-input" id="f_${f.k}" placeholder="your answer" autocomplete="off" spellcheck="false">
    </div>`;
  });
  document.getElementById("fields").innerHTML=fg;
  document.getElementById("feedback").style.display="none";
  document.getElementById("visual").innerHTML="";
  document.getElementById("next-btn").style.display="none";
  renderDots();
}

function checkAnswers(){
  if(st.answered)return;
  const q=Qs[st.q];
  let correct=0;
  q.fields.forEach(f=>{
    const inp=document.getElementById("f_"+f.k);
    if(!inp)return;
    if(norm(inp.value)===norm(f.a)){inp.classList.add("correct");correct++;}
    else{inp.classList.add("wrong");}
  });
  st.answered=true;
  const all=correct===q.fields.length;
  if(all){st.score+=10;st.streak++;}else{st.streak=0;}
  document.getElementById("score-el").textContent="Score: "+st.score;
  document.getElementById("streak-el").textContent="Streak: "+st.streak+" 🔥";
  const fb=document.getElementById("feedback");
  fb.style.display="block";
  if(all){
    fb.className="feedback success";
    fb.innerHTML=`<div class="fb-title">✅ All correct!</div>${q.explain}`;
  } else {
    fb.className="feedback error";
    let rows=q.fields.map(f=>`<div><span class="mono">${f.l}:</span> <span class="mono" style="color:var(--green)">${f.a}</span></div>`).join("");
    fb.innerHTML=`<div class="fb-title">❌ Not quite — correct answers:</div>${rows}<br>${q.explain}`;
    q.fields.forEach(f=>{
      const inp=document.getElementById("f_"+f.k);
      if(inp&&inp.classList.contains("wrong"))inp.value=f.a;
    });
  }
  if(q.visual)renderVisual(q.visual);
  document.getElementById("next-btn").style.display="inline-block";
}

function renderVisual(type){
  const v=document.getElementById("visual");
  if(type==="slash26"){
    const colors=["#1e3a5f","#0d2e1f","#2e2208","#2e1010"];
    const txts=["#4f8ef7","#3ecf8e","#fbbf24","#f87171"];
    const labels=["192.168.1.0/26 — hosts .1–.62","192.168.1.64/26 — hosts .65–.126","192.168.1.128/26 — hosts .129–.190","192.168.1.192/26 — hosts .193–.254"];
    let bars=labels.map((l,i)=>`<div class="subnet-bar" style="background:${colors[i]};color:${txts[i]};border:1px solid ${txts[i]}33">${l} <span style="margin-left:auto;opacity:.6">62 hosts</span></div>`).join("");
    v.innerHTML=`<div class="visual-card"><div class="card-label">Subnet map — 192.168.1.0/24 ÷ 4</div>${bars}</div>`;
  } else if(type==="slash24"){
    v.innerHTML=`<div class="visual-card"><div class="card-label">Address space — 192.168.10.0/24</div>
    <div class="subnet-bar" style="background:#2e1010;color:#f87171;border:1px solid #5c1c1c;width:4%">.0 — Net</div>
    <div class="subnet-bar" style="background:#0d2e1f;color:#3ecf8e;border:1px solid #1a5c3a;">.1 → .254 — 254 usable hosts</div>
    <div class="subnet-bar" style="background:#2e1010;color:#f87171;border:1px solid #5c1c1c;width:4%">.255 — BC</div>
    </div>`;
  }
}

function showHint(){
  const fb=document.getElementById("feedback");
  fb.style.display="block";
  fb.className="feedback hint";
  fb.innerHTML=`<div class="fb-title">💡 Hint</div>${Qs[st.q].hint}
  <div class="cheat">
    <div>Quick reference:</div>
    <div><span>/24</span> = 255.255.255.0 = <span>254</span> hosts</div>
    <div><span>/25</span> = 255.255.255.128 = <span>126</span> hosts</div>
    <div><span>/26</span> = 255.255.255.192 = <span>62</span> hosts</div>
    <div><span>/27</span> = 255.255.255.224 = <span>30</span> hosts</div>
    <div><span>/28</span> = 255.255.255.240 = <span>14</span> hosts</div>
    <div><span>/29</span> = 255.255.255.248 = <span>6</span> hosts</div>
    <div><span>/30</span> = 255.255.255.252 = <span>2</span> hosts</div>
    <div style="margin-top:6px">Formula: <span>Hosts = 2^(32−prefix) − 2</span></div>
  </div>`;
}

function nextQ(){
  if(st.q<Qs.length-1){st.q++;renderQ();}
  else{showFinish();}
}

function showFinish(){
  document.getElementById("prog").style.width="100%";
  document.getElementById("dots").innerHTML=`<span class="dot-lbl" style="color:var(--green);font-size:13px">All 5 complete!</span>`;
  const grade=st.score>=40?"Excellent":"Keep practicing!";
  document.getElementById("scenario-card").innerHTML=`
    <div class="card-label">Challenge complete</div>
    <div class="card-title">Nice work, network engineer!</div>
    <div class="card-sub">These are the exact calculations you will encounter on the CompTIA Network+ exam. Review any questions you missed before moving on to the lab.</div>
    <div class="finish-score">${st.score} / 50</div>
    <div style="font-size:13px;color:var(--text2)">${grade} — Streak: ${st.streak}</div>`;
  document.querySelector(".card:nth-child(5)").innerHTML=`<div class="btns"><button class="btn success" onclick="location.reload()">Restart challenge</button></div>`;
  document.getElementById("feedback").style.display="none";
  document.getElementById("visual").innerHTML="";
}

renderQ();
</script>
</body>
</html>

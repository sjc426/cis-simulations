<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS 4345 — Week 2 Compute Showdown 🖥️ Your First Server</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3350;
    --blue:#4f8ef7; --blue-dim:#1e2d4f;
    --green:#3ecf8e; --green-dim:#0d2e1f;
    --red:#f87171; --red-dim:#2e1010;
    --yellow:#fbbf24; --yellow-dim:#2e2208;
    --aws:#FF9900; --aws-dim:#2e1c00; --aws-border:#6b3f00;
    --azure:#0078D4; --azure-dim:#001e3c; --azure-border:#004080;
    --gcp:#34A853; --gcp-dim:#0a2410; --gcp-border:#1a5c2a;
    --text:#e8eaf6; --text2:#8b92b8; --text3:#4a5080;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    min-width:380px; line-height:1.5;
  }
  .skip-link{
    position:absolute; left:-9999px; top:0; background:var(--blue); color:#fff;
    padding:10px 16px; z-index:1000; border-radius:0 0 6px 0; font-family:var(--sans);
  }
  .skip-link:focus{ left:0; }

  button{font-family:var(--sans);}
  button:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
  a:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }

  header.appbar{
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:14px 20px; display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px; position:sticky; top:0; z-index:50;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .dots{ display:flex; gap:4px; }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.aws{ background:var(--aws); }
  .dot.azure{ background:var(--azure); }
  .dot.gcp{ background:var(--gcp); }
  .brand-title{ font-family:var(--mono); font-weight:600; font-size:0.95rem; }
  .brand-title .sub{ display:block; font-size:0.72rem; color:var(--text2); font-weight:400; }

  .pills{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{
    background:var(--surface2); border:1px solid var(--border); border-radius:20px;
    padding:6px 12px; font-family:var(--mono); font-size:0.78rem; color:var(--text2);
    display:flex; align-items:center; gap:6px;
  }
  .pill strong{ color:var(--text); font-weight:600; }
  .pill.streak-hot{ border-color:var(--yellow); color:var(--yellow); }
  .pill.streak-hot strong{ color:var(--yellow); }

  .progress-wrap{ height:3px; width:100%; background:var(--border); }
  .progress-bar{ height:100%; background:var(--blue); width:0%; transition:width .3s ease; }

  main{ max-width:820px; margin:0 auto; padding:28px 18px 60px; }

  h1{ font-size:1.05rem; margin:0; }
  h2{ font-size:1.25rem; margin:0 0 8px; color:var(--text); }

  .round-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:24px; margin-bottom:20px;
  }
  .round-label{
    font-family:var(--mono); font-size:0.78rem; color:var(--blue); letter-spacing:0.03em;
    margin-bottom:6px; text-transform:uppercase;
  }
  .round-body{ color:var(--text2); font-size:0.98rem; margin:14px 0; }

  .concept-badge{
    display:inline-flex; align-items:center; gap:8px; background:var(--blue-dim);
    border:1px solid var(--blue); color:var(--blue); padding:8px 14px; border-radius:8px;
    font-family:var(--mono); font-size:0.82rem; margin-bottom:16px;
  }
  .concept-badge .sub{ color:var(--text2); font-weight:400; }

  .question-text{ font-weight:600; margin:18px 0 14px; font-size:1rem; }

  .options{ display:grid; gap:10px; }
  .opt-btn{
    text-align:left; background:var(--surface2); border:1px solid var(--border);
    color:var(--text); padding:14px 16px; border-radius:10px; cursor:pointer;
    font-size:0.95rem; font-family:var(--sans); transition:border-color .15s, background .15s;
    width:100%;
  }
  .opt-btn:hover:not(:disabled){ border-color:var(--blue); background:var(--blue-dim); }
  .opt-btn:disabled{ cursor:default; }
  .opt-btn.selected-correct{ border-color:var(--green); background:var(--green-dim); }
  .opt-btn.selected-wrong{ border-color:var(--red); background:var(--red-dim); }
  .opt-btn.reveal-correct{ border-color:var(--green); background:var(--green-dim); }

  .fb{
    margin-top:20px; padding:18px; border-radius:12px; border:1px solid var(--border);
  }
  .fb.success{ background:var(--green-dim); border-color:var(--green); }
  .fb.error{ background:var(--red-dim); border-color:var(--red); }
  .fb-title{ font-weight:600; font-size:1rem; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .fb-title.success{ color:var(--green); }
  .fb-title.error{ color:var(--red); }
  .fb-text{ color:var(--text); font-size:0.92rem; margin-bottom:12px; }
  .breakdown{ display:grid; gap:8px; }
  .breakdown-row{
    display:flex; gap:10px; align-items:flex-start; font-size:0.88rem; color:var(--text2);
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px;
  }
  .breakdown-row .icon{ flex-shrink:0; }

  .next-btn, .replay-btn{
    margin-top:18px; background:var(--blue); color:#fff; border:none; padding:12px 22px;
    border-radius:8px; font-weight:600; font-size:0.95rem; cursor:pointer; font-family:var(--sans);
  }
  .next-btn:hover, .replay-btn:hover{ background:#3d7de0; }

  .final-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:36px 24px; text-align:center;
  }
  .final-score{ font-family:var(--mono); font-size:3rem; font-weight:600; color:var(--blue); margin:10px 0; }
  .final-label{ color:var(--text2); font-size:0.95rem; margin-bottom:20px; }
  .stat-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin:24px 0;
  }
  .stat-box{
    background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:16px;
  }
  .stat-box .num{ font-family:var(--mono); font-size:1.5rem; font-weight:600; color:var(--text); }
  .stat-box .lbl{ font-size:0.78rem; color:var(--text2); margin-top:4px; }

  .streak-flash{
    animation: flashPulse 0.6s ease;
  }
  @keyframes flashPulse{
    0%{ transform:scale(1); }
    30%{ transform:scale(1.12); }
    100%{ transform:scale(1); }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important; transition-duration:0.01ms !important;
    }
  }

  @media (max-width:480px){
    .round-card{ padding:18px; }
    .final-score{ font-size:2.2rem; }
  }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="appbar">
  <div class="brand">

  <div class="pills">
    <div class="pill" id="round-pill">Round <strong id="round-num">1</strong>/5</div>
    <div class="pill" id="score-el" aria-live="polite" aria-atomic="true">Score <strong id="score-num">0</strong></div>
    <div class="pill" id="streak-el" aria-live="polite" aria-atomic="true">Streak <strong id="streak-num">0</strong></div>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Quiz progress"></div>
</div>

<main id="main-content">

</main>

      title:"The Batch Job That Can Wait",
      body:"Your company runs a nightly video-transcoding batch job that takes about 6 hours. It's not time-critical — if the job gets interrupted, it can restart from a checkpoint without hurting the business. Your manager wants the cheapest possible compute option for this workload and is fine with occasional interruptions.",

          {icon:"⚠️", text:"Common mistake: defaulting to general-purpose 'to be safe.' That often wastes money on unused CPU while starving the workload of the RAM it actually needs."}

    {

      label:"Scenario 5 — Cloud vs On-Premise",
      title:"The CFO Asks a Hard Question",
      body:"Your company's CFO wants to move the entire on-premise data center to the cloud immediately to 'save money.' The company currently owns fully depreciated servers running a stable, predictable internal payroll application with almost no traffic spikes, and IT staff already maintain that hardware as part of their existing duties.",

      conceptEmoji:"⚖️",

        "C. Explain that stable, predictable, already-depreciated workloads with low traffic variability often don't show major cost savings in the cloud, and recommend a workload-by-workload cost analysis before migrating",

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS 4345 — Networking 🏰 Network Architect Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3350;
  --blue:#4f8ef7; --blue-dim:#1e2d4f;
  --green:#3ecf8e; --green-dim:#0d2e1f;
  --red:#f87171; --red-dim:#2e1010;
  --yellow:#fbbf24; --yellow-dim:#2e2208;
  --aws:#FF9900; --aws-dim:#2e1c00; --aws-border:#6b3f00;
  --azure:#0078D4; --azure-dim:#001e3c; --azure-border:#004080;
  --gcp:#34A853; --gcp-dim:#0a2410; --gcp-border:#1a5c2a;
  --text:#e8eaf6; --text2:#8b92b8; --text3:#4a5080;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
.skip-link{
  position:absolute; left:-9999px; top:0; background:var(--blue); color:#fff;
  padding:10px 16px; z-index:1000; font-family:var(--sans); font-weight:600; border-radius:0 0 6px 0;
}
.skip-link:focus{left:0;}
button{font-family:var(--sans); cursor:pointer;}
button:focus-visible{outline:3px solid var(--blue); outline-offset:2px;}
a:focus-visible{outline:3px solid var(--blue); outline-offset:2px;}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
}

header.topbar{
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:14px 20px; display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:12px;
}
.brand{display:flex; align-items:center; gap:10px;}
.dots{display:flex; gap:4px;}
.dot{width:10px; height:10px; border-radius:50%;}
.dot.aws{background:var(--aws);} .dot.azure{background:var(--azure);} .dot.gcp{background:var(--gcp);}
.brand-title{font-family:var(--mono); font-weight:600; font-size:15px; letter-spacing:0.5px;}
.pills{display:flex; gap:8px; flex-wrap:wrap;}
.pill{
  background:var(--surface2); border:1px solid var(--border); border-radius:20px;
  padding:6px 14px; font-family:var(--mono); font-size:13px; display:flex; gap:6px; align-items:center;
}
.pill .label{color:var(--text2);}
.pill .val{color:var(--text); font-weight:600;}
.pill.streak-flash{animation:flash 0.6s ease-in-out;}
@keyframes flash{
  0%{background:var(--yellow-dim); border-color:var(--yellow);}
  100%{background:var(--surface2); border-color:var(--border);}
}

.progress-wrap{height:3px; background:var(--surface2); width:100%;}
.progress-bar{height:100%; background:var(--blue); transition:width 0.3s ease;}

main{max-width:820px; margin:0 auto; padding:24px 16px 60px;}

h1{font-size:20px; margin:0; font-family:var(--sans);}
h2{font-size:22px; margin:0 0 8px 0;}

.round-card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:24px; margin-bottom:20px;
}
.round-label{
  font-family:var(--mono); color:var(--text2); font-size:13px; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px;
}
.round-body{color:var(--text2); line-height:1.6; margin:14px 0; font-size:15px;}
.concept-badge{
  display:inline-flex; align-items:center; gap:8px; background:var(--blue-dim); border:1px solid var(--blue);
  color:var(--blue); border-radius:8px; padding:8px 14px; font-family:var(--mono); font-size:13px; margin-bottom:6px;
}
.concept-badge .sub{color:var(--text2); font-weight:400;}

.question{font-weight:600; margin:18px 0 12px 0; font-size:16px;}

.options{display:flex; flex-direction:column; gap:10px;}
.opt-btn{
  background:var(--surface2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:14px 16px; text-align:left; font-size:14.5px; line-height:1.5;
  transition:background 0.15s, border-color 0.15s;
  display:flex; align-items:flex-start; gap:10px;
}
.opt-btn:hover:not(:disabled){background:#282c42; border-color:var(--blue);}
.opt-btn:disabled{cursor:default;}
.opt-btn .letter{
  font-family:var(--mono); font-weight:600; color:var(--text2); flex-shrink:0;
}
.opt-btn.correct{background:var(--green-dim); border-color:var(--green); color:var(--text);}
.opt-btn.wrong{background:var(--red-dim); border-color:var(--red); color:var(--text);}
.opt-btn.neutral-disabled{opacity:0.55;}

.fb{
  margin-top:20px; border-radius:12px; padding:20px; border:1px solid var(--border);
}
.fb.correct{background:var(--green-dim); border-color:var(--green);}
.fb.wrong{background:var(--red-dim); border-color:var(--red);}
.fb-title{font-weight:600; font-size:16px; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
.fb-title.correct{color:var(--green);}
.fb-title.wrong{color:var(--red);}
.fb-text{color:var(--text); line-height:1.6; margin-bottom:14px; font-size:14.5px;}
.breakdown{display:flex; flex-direction:column; gap:8px;}
.bd-row{display:flex; gap:10px; align-items:flex-start; font-size:14px; color:var(--text2); line-height:1.5;}
.bd-row .icon{flex-shrink:0;}

.points-earned{
  font-family:var(--mono); font-weight:600; font-size:14px; margin-top:10px; padding-top:10px;
  border-top:1px solid var(--border);
}
.points-earned.pos{color:var(--green);}
.points-earned.neg{color:var(--red);}

.next-btn{
  margin-top:20px; background:var(--blue); color:#fff; border:none; border-radius:8px;
  padding:14px 24px; font-weight:600; font-size:15px; width:100%;
}
.next-btn:hover{background:#3d7de0;}

.final-screen{text-align:center; padding:40px 20px;}
.final-score{font-family:var(--mono); font-size:56px; font-weight:600; color:var(--blue); margin:10px 0;}
.final-label{color:var(--text2); font-size:14px; margin-bottom:24px;}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin:24px 0;}
.stat-box{
  background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:18px;
}
.stat-box .num{font-family:var(--mono); font-size:26px; font-weight:600; color:var(--text);}
.stat-box .lbl{color:var(--text2); font-size:13px; margin-top:4px;}
.replay-btn{
  background:var(--green); color:#0f1117; border:none; border-radius:8px; padding:14px 28px;
  font-weight:600; font-size:15px; margin-top:10px;
}
.replay-btn:hover{background:#2fb87c;}

@media (max-width:480px){
  .round-card{padding:16px;}
  .final-score{font-size:42px;}
}
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="topbar">
  <div class="brand">
    <div class="dots" aria-hidden="true">
      <span class="dot aws"></span><span class="dot azure"></span><span class="dot gcp"></span>
    </div>
    <span class="brand-title">CIS 4345 · NETWORK ARCHITECT SHOWDOWN</span>
  </div>
  <div class="pills">
    <div class="pill"><span class="label">Score</span><div id="score-el" class="val" aria-live="polite" aria-atomic="true">0</div></div>
    <div class="pill"><span class="label">Round</span><span id="round-el" class="val">1/6</span></div>
    <div class="pill" id="streak-pill"><span class="label">Streak</span><div id="streak-el" class="val" aria-live="polite" aria-atomic="true">0</div></div>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Quiz progress" style="width:0%"></div>
</div>

<main id="main-content">
  <h1 class="sr-title" style="position:absolute;left:-9999px;">CIS 4345 Week 6 — Network Architect Showdown</h1>
  <div id="game-area"></div>
</main>

<script>
const scenarios = [
  {
    id:1,
    label:"Scenario 1 — VPC Fundamentals",
    title:"The New Client's Blank Canvas",
    body:"A retail client just signed with your MSP and wants to migrate their inventory app to the cloud. Before you can launch a single server, you need an isolated network space that logically separates their traffic from every other tenant on the shared cloud infrastructure. This is the foundational networking construct in every major cloud provider.",
    concept:"VPC Fundamentals",
    conceptEmoji:"🏗️",
    conceptSub:"The isolated network container",
    question:"What is the FIRST resource you should create before deploying any compute instances?",
    options:[
      "A. A single publicly-accessible EC2/VM instance to test connectivity",
      "B. A Virtual Private Cloud (VPC) or Virtual Network (VNet) with a defined CIDR block",
      "C. A DNS zone so the client's domain name resolves immediately",
      "D. A load balancer to distribute traffic once instances are running"
    ],
    correct:1,
    feedback:{
      correct:"A VPC (or VNet in Azure) is the logically isolated network space where all your cloud resources live. You must define its IP address range (CIDR block) before you can carve out subnets or launch instances into it.",
      wrong:"The correct answer is B. Every cloud deployment starts with a VPC/VNet — a private, isolated network with its own IP address range (CIDR block). You cannot launch instances, create subnets, or configure routing until this container exists. Load balancers and DNS come later, and launching a public instance before defining your network is both premature and a security risk.",
      breakdown:[
        {icon:"✅", text:"VPC = the network 'building' — everything else (subnets, gateways, instances) lives inside it."},
        {icon:"💡", text:"You choose the CIDR block (e.g., 10.0.0.0/16) which determines the total available IP addresses."},
        {icon:"⚠️", text:"Common mistake: launching resources with default/auto-generated VPCs in production instead of a deliberately designed one."}
      ]
    }
  },
  {
    id:2,
    label:"Scenario 2 — Three Landlords Networking Models",
    title:"Translating for the Azure Team",
    body:"Your company is expanding from AWS-only infrastructure into a multi-cloud strategy. You're pairing with an Azure-certified engineer who keeps saying 'VNet' while your AWS documentation says 'VPC.' Your manager asks you to explain the terminology mapping in a one-slide cheat sheet for the team meeting.",
    concept:"Three Landlords Networking Models",
    conceptEmoji:"🏢",
    conceptSub:"AWS vs Azure vs GCP terminology",
    question:"Which terminology mapping is CORRECT across the three 'landlords'?",
    options:[
      "A. AWS VPC = Azure VNet = GCP VPC — all three are the isolated private network construct, though GCP's VPC is global by default while AWS/Azure are regional",
      "B. AWS VPC = Azure Resource Group = GCP Project — these all describe billing containers",
      "C. AWS Subnet = Azure VNet = GCP Project — subnets and VNets are interchangeable terms",
      "D. There is no equivalent in GCP; Google only offers regional networking with no isolation layer"
    ],
    correct:0,
    feedback:{
      correct:"Exactly right — all three providers implement the same core concept (an isolated virtual network) but with an important architectural difference: GCP VPCs are global resources that can span all regions, while AWS VPCs and Azure VNets are tied to a single region.",
      wrong:"The correct answer is A. AWS VPC, Azure VNet, and GCP VPC are functionally equivalent — the isolated private network container. The key nuance for the 'three landlords' framing is that GCP's VPC is a global resource (subnets within it can span multiple regions), whereas AWS and Azure require you to create a separate VPC/VNet per region. Resource Groups and Projects are organizational/billing constructs, not networking constructs — don't confuse them.",
      breakdown:[
        {icon:"✅", text:"Same concept, different landlord: VPC (AWS) = VNet (Azure) = VPC (GCP)."},
        {icon:"💡", text:"GCP's global VPC is a genuine architectural difference — it simplifies multi-region designs compared to AWS/Azure."},
        {icon:"⚠️", text:"Don't confuse networking containers (VPC/VNet) with organizational containers (Resource Groups, Projects) — they solve different problems."}
      ]
    }
  },
  {
    id:3,
    label:"Scenario 3 — Security Groups vs NACLs vs NSGs",
    title:"The Mystery Blocked Connection",
    body:"A developer complains that their EC2 instance can't reach a database instance in another subnet, despite the security group on the EC2 instance allowing all outbound traffic on port 5432. You check the security group on the database instance too — it allows inbound 5432 from the app subnet's CIDR range. Traffic is still blocked.",
    concept:"Security Groups vs NACLs vs NSGs",
    conceptEmoji:"🛡️",
    conceptSub:"Stateful vs stateless filtering layers",
    question:"What is the MOST LIKELY remaining cause you haven't checked yet?",
    options:[
      "A. The instance needs a second security group — AWS instances can only have one attached",
      "B. The Network ACL (NACL) on the database subnet is stateless and may be blocking the return traffic even though inbound rules look fine",
      "C. Security groups don't support port-specific rules, only protocol-level rules",
      "D. The VPC needs to be deleted and recreated since security group changes require a VPC rebuild"
    ],
    correct:1,
    feedback:{
      correct:"NACLs operate at the subnet level and are stateless — meaning inbound and outbound rules must BOTH be explicitly configured, unlike security groups which automatically allow return traffic. This is the classic 'everything looks right but it's still blocked' troubleshooting trap.",
      wrong:"The correct answer is B. Security groups are stateful (return traffic is auto-allowed) and operate at the instance level, but Network ACLs sit at the subnet boundary and are stateless — you must explicitly allow both the inbound request AND the outbound response. A misconfigured NACL is the classic hidden culprit when security groups look correct on both ends. AWS instances CAN have multiple security groups, and SGs absolutely do support port-level rules.",
      breakdown:[
        {icon:"✅", text:"Security Groups (AWS) / NSGs (Azure): stateful, instance-level, automatically allow return traffic."},
        {icon:"💡", text:"NACLs (AWS) / Azure NSG subnet rules: stateless, subnet-level, require explicit inbound AND outbound rules."},
        {icon:"⚠️", text:"Common mistake: only checking security groups and forgetting that NACLs operate as a second, stateless filtering layer."}
      ]
    }
  },
  {
    id:4,
    label:"Scenario 4 — Internet & NAT Gateways",
    title:"The Database That Shouldn't Talk to the Internet",
    body:"You're designing the network for a three-tier web app. The web servers need to serve public traffic. The application servers need outbound internet access to pull OS security patches but should NEVER be directly reachable from the internet. The database tier should have no internet access at all — only internal traffic.",
    concept:"Internet & NAT Gateways",
    conceptEmoji:"🌐",
    conceptSub:"Inbound vs outbound-only internet access",
    question:"Which gateway configuration correctly satisfies the application server's requirement?",
    options:[
      "A. Place the app servers in a public subnet with an Internet Gateway attached directly to their route table",
      "B. Place the app servers in a private subnet with a route to a NAT Gateway (located in a public subnet), allowing outbound-only internet access",
      "C. Give each app server its own Elastic IP so it can reach the internet directly",
      "D. Place the app servers in the same public subnet as the web servers to simplify routing"
    ],
    correct:1,
    feedback:{
      correct:"A NAT Gateway sitting in a public subnet lets private-subnet instances initiate outbound connections (like pulling patches) while remaining completely unreachable from the internet — no inbound connections can be initiated from outside. This is the standard pattern for app-tier and database-tier isolation.",
      wrong:"The correct answer is B. A NAT Gateway is specifically designed for this exact scenario: it lives in a public subnet and provides outbound-only internet access for instances in a private subnet. Instances behind a NAT Gateway have no public IP and cannot be directly reached from the internet, satisfying the 'patches yes, inbound no' requirement. Options A, C, and D would all expose the app servers directly to the internet — a major security violation.",
      breakdown:[
        {icon:"✅", text:"Internet Gateway (IGW): two-way — used by public subnets for resources that need inbound + outbound (like web servers)."},
        {icon:"💡", text:"NAT Gateway: one-way — private subnet resources get outbound internet access without being reachable inbound."},
        {icon:"⚠️", text:"Common mistake: giving app/database tiers public IPs 'just in case,' defeating the purpose of tiered network segmentation."}
      ]
    }
  },
  {
    id:5,
    label:"Scenario 5 — VPC Peering & Subnets",
    title:"Two Departments, Two VPCs, One Problem",
    body:"Marketing's analytics VPC (10.0.0.0/16) needs to query a reporting database that lives in Finance's VPC (10.1.0.0/16), both in the same AWS region. Both teams refuse to merge into a single VPC due to separate compliance and billing requirements, but they agree traffic should never traverse the public internet.",
    concept:"VPC Peering & Subnets",
    conceptEmoji:"🔗",
    conceptSub:"Private connectivity between isolated networks",
    question:"What is the appropriate solution, and what must be true for it to work?",
    options:[
      "A. Set up VPC Peering between the two VPCs — this works because their CIDR blocks (10.0.0.0/16 and 10.1.0.0/16) don't overlap",
      "B. Set up VPC Peering — CIDR overlap doesn't matter because peering uses NAT translation automatically",
      "C. Assign both VPCs the same CIDR block first, then peer them for simplicity",
      "D. Route all traffic through a public NAT Gateway with a firewall rule allowing only the two known IPs"
    ],
    correct:0,
    feedback:{
      correct:"VPC Peering creates a private, direct network connection between two VPCs so they can route traffic to each other's private IP addresses — but it only works if the CIDR blocks don't overlap. Since 10.0.0.0/16 and 10.1.0.0/16 are distinct ranges, peering will succeed here.",
      wrong:"The correct answer is A. VPC Peering is the correct tool for private connectivity between separate VPCs (even across accounts or departments), but there's a hard requirement: the CIDR blocks must not overlap, because peering routes traffic based on private IP ranges with no NAT translation involved. Identical CIDR blocks (option C) would make peering impossible, not simpler. Routing through a public NAT Gateway (option D) would send private data over the internet, violating the requirement.",
      breakdown:[
        {icon:"✅", text:"VPC Peering = private, direct, non-transitive connection between two VPCs' private IP spaces

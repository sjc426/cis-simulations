<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* Pure black outer shell */
#heroWrap{width:100%;height:100%;position:relative;background:#050505;}

/* Canvas sits behind everything — positioned to match monitorWrap exactly */
#bgC{
  position:absolute;
  top:16px;left:16px;
  z-index:1;
  border-radius:8px;
}

/* Monitor bezel — pops with bright green glow */
#monitorWrap{
  position:absolute;
  top:16px;left:16px;right:16px;bottom:16px;
  border:3px solid #00ff41;
  border-radius:10px;
  box-shadow:
    0 0 0 1px rgba(0,255,65,0.2),
    0 0 22px rgba(0,255,65,0.8),
    0 0 55px rgba(0,255,65,0.35),
    0 0 100px rgba(0,255,65,0.14),
    inset 0 0 30px rgba(0,0,0,0.5);
  z-index:5;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:transparent;
  pointer-events:none;
}

/* Title bar — solid, always visible above canvas */
#monBar{
  background:#050f05;
  border-bottom:2px solid #00ff41;
  padding:11px 18px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
  box-shadow:0 3px 14px rgba(0,255,65,0.22);
}
.mdot{width:13px;height:13px;border-radius:50%;}
.mdot.r{background:#ff5f57;}
.mdot.y{background:#febc2e;}
.mdot.g{background:#28c840;}
#monTitle{
  font-family:'Courier New',monospace;
  font-size:15px;
  color:#ffffff;
  margin-left:12px;
  letter-spacing:0.08em;
  font-weight:700;
  text-shadow:0 0 10px #00ff41,0 0 22px rgba(0,255,65,0.6);
}

/* Terminal content area */
#monBody{
  flex:1;
  padding:20px 26px 70px;
  overflow:hidden;
  position:relative;
}
#termOut{
  font-family:'Courier New',Courier,monospace;
  font-size:clamp(14px,1.85vw,18px);
  line-height:2;
  color:#00ff41;
}
.c-prompt{color:rgba(0,255,65,0.4);}
.c-cmd{color:#00ff41;font-weight:700;}
.c-output{color:rgba(0,220,50,0.82);}
.c-dim{color:rgba(0,180,40,0.48);}
.c-white{color:rgba(255,255,255,0.92);}
.c-bright{color:#ffffff;text-shadow:0 0 8px #00ff41;}
.c-red{color:#ff4d6d;}
.c-cyan{color:#00e5ff;}
.c-mantra{
  color:#ffffff;font-weight:900;
  font-size:clamp(16px,2.1vw,21px);
  text-shadow:0 0 16px #00ff41,0 0 32px rgba(0,255,65,0.5);
}
.c-access{
  color:#00ff41;font-weight:900;
  font-size:clamp(18px,2.4vw,24px);
  text-shadow:0 0 22px #00ff41,0 0 55px rgba(0,255,65,0.7),0 0 90px rgba(0,255,65,0.3);
}
#cur{
  display:inline-block;width:11px;
  height:clamp(14px,1.85vw,18px);
  background:#00ff41;
  animation:blink 1s step-end infinite;
  vertical-align:middle;margin-left:2px;
  box-shadow:0 0 8px #00ff41;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* Scanlines + vignette inside */
#scan{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);
  pointer-events:none;z-index:6;border-radius:8px;
}
#vignette{
  position:absolute;top:16px;left:16px;right:16px;bottom:16px;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.65) 100%);
  pointer-events:none;z-index:4;border-radius:8px;
}

/* Pause button */
#pauseBtn{
  position:absolute;bottom:22px;right:22px;z-index:9999;
  background:rgba(0,25,0,0.95);
  border:2px solid #00ff41;border-radius:4px;
  color:#00ff41;font-size:13px;font-weight:700;
  padding:7px 16px;cursor:pointer;
  font-family:'Courier New',monospace;line-height:1.3;
  box-shadow:0 0 12px rgba(0,255,65,0.45);
  pointer-events:auto;
}
#pauseBtn:focus{outline:3px solid #00ff41;outline-offset:2px;}
#pauseBtn:hover{background:rgba(0,60,0,0.95);box-shadow:0 0 20px rgba(0,255,65,0.8);}
</style>
</head>
<body>
<h2 class="sr-only">CIS 4696 Ethical Hacking and Intrusion Forensics — Temple University. Full screen CRT terminal animation. Matrix rain visible through the monitor glass.</h2>
<div id="heroWrap">
  <!-- Canvas behind the monitor bezel — rain only shows inside bezel area -->
  <canvas id="bgC" aria-hidden="true"></canvas>

  <!-- Monitor bezel overlay — purely decorative border + title bar -->
  <div id="monitorWrap">
    <div id="monBar">
      <div class="mdot r"></div>
      <div class="mdot y"></div>
      <div class="mdot g"></div>
      <span id="monTitle">kali@temple-university: ~/cis4696 &mdash; root</span>
    </div>
    <div id="monBody">
      <div id="termOut" aria-hidden="true"></div>
      <span id="cur" aria-hidden="true"></span>
    </div>
  </div>

  <!-- Effects on top -->
  <div id="scan"></div>
  <div id="vignette"></div>

  <button id="pauseBtn" aria-label="Pause animation" aria-pressed="false">&#9208; Pause</button>
  <div class="sr-only" aria-live="polite" aria-atomic="true" id="ariaLive"></div>
</div>

<script>
var heroWrap=document.getElementById('heroWrap');
var monWrap=document.getElementById('monitorWrap');
var bgC=document.getElementById('bgC'),bgX=bgC.getContext('2d');
var termOut=document.getElementById('termOut');
var ariaLive=document.getElementById('ariaLive');
var pauseBtn=document.getElementById('pauseBtn');
var paused=false,bgFrame=0,matrixCols=[];
var CHARS='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF!@#><|/\\';

function announce(msg){ariaLive.textContent='';setTimeout(function(){ariaLive.textContent=msg;},60);}
pauseBtn.addEventListener('click',function(){
  paused=!paused;
  pauseBtn.setAttribute('aria-pressed',paused?'true':'false');
  pauseBtn.textContent=paused?'\u25B6 Resume':'\u23F8 Pause';
  pauseBtn.setAttribute('aria-label',paused?'Resume animation':'Pause animation');
  announce(paused?'Animation paused':'Animation resumed');
});

function resize(){
  // Size canvas to exactly match the monitorWrap interior
  var r=monWrap.getBoundingClientRect();
  bgC.width=Math.round(r.width);
  bgC.height=Math.round(r.height);
  bgC.style.width=bgC.width+'px';
  bgC.style.height=bgC.height+'px';
  initMatrix();
}
resize();setTimeout(resize,200);window.addEventListener('resize',resize);

function initMatrix(){
  matrixCols=[];
  var colW=18,numCols=Math.ceil(bgC.width/colW);
  for(var c=0;c<numCols;c++){
    matrixCols.push({
      x:c*colW+colW/2,
      y:Math.random()*bgC.height*-1,
      speed:1.4+Math.random()*2.6,
      trailLen:Math.floor(10+Math.random()*20),
      trail:[],
      bright:Math.random()<0.12
    });
  }
}

function drawMatrix(){
  if(!paused){
    bgX.fillStyle='rgba(0,0,0,0.09)';
    bgX.fillRect(0,0,bgC.width,bgC.height);
    bgX.font='bold 14px "Courier New",monospace';
    bgX.textAlign='center';
    matrixCols.forEach(function(col){
      col.y+=col.speed;
      col.trail.unshift(CHARS[Math.floor(Math.random()*CHARS.length)]);
      if(col.trail.length>col.trailLen)col.trail.length=col.trailLen;
      if(col.y-col.trail.length*16>bgC.height){
        col.y=Math.random()*bgC.height*-0.5;
        col.trail=[];col.speed=1.4+Math.random()*2.6;
        col.trailLen=Math.floor(10+Math.random()*20);
      }
      for(var i=0;i<col.trail.length;i++){
        var cy=col.y-i*16;if(cy<0||cy>bgC.height)continue;
        var ratio=1-(i/col.trailLen);
        if(i===0){
          bgX.fillStyle=col.bright?'rgba(255,255,255,0.88)':'rgba(180,255,180,0.90)';
          bgX.shadowColor='#00ff41';bgX.shadowBlur=14;
        } else {
          bgX.fillStyle='rgba(0,'+Math.floor(200*ratio+20)+',0,'+(ratio*0.60)+')';
          bgX.shadowBlur=ratio>0.6?5:0;bgX.shadowColor='#00ff41';
        }
        bgX.fillText(col.trail[i],col.x,cy);
      }
      bgX.shadowBlur=0;
    });
    bgFrame++;
  }
  requestAnimationFrame(drawMatrix);
}
drawMatrix();

function pTimeout(ms,cb){
  var elapsed=0,last=performance.now();
  function check(){var now=performance.now();if(!paused)elapsed+=now-last;last=now;elapsed>=ms?cb():requestAnimationFrame(check);}
  requestAnimationFrame(check);
}
function addEl(cls,text){var s=document.createElement('span');s.className=cls;s.textContent=text;termOut.appendChild(s);return s;}
function addBr(){termOut.appendChild(document.createElement('br'));}
function scrollBottom(){document.getElementById('monBody').scrollTop=9999;}
function typeText(cls,text,speed,cb){
  if(paused){setTimeout(function(){typeText(cls,text,speed,cb);},80);return;}
  var s=document.createElement('span');s.className=cls;termOut.appendChild(s);var i=0;
  function next(){if(paused){setTimeout(next,80);return;}if(i>=text.length){cb&&cb();return;}s.textContent+=text[i++];scrollBottom();setTimeout(next,speed+(Math.random()*speed*0.35));}
  next();
}
function prompt(cb){addBr();addEl('c-dim','[root@kali cis4696]');addEl('c-prompt',' ~$ ');pTimeout(260,cb);}
function typeCmd(cmd,cb){typeText('c-cmd',cmd,36,function(){pTimeout(300,cb);});}
function out(cls,text,delay,cb){addBr();addEl(cls,'  '+text);scrollBottom();pTimeout(delay,cb);}

var script=[
  function(next){
    addEl('c-dim','Kali GNU/Linux -- Temple University Security Lab');addBr();
    addEl('c-dim','CIS 4696 | Ethical Hacking & Intrusion Forensics');addBr();
    addEl('c-dim','Fall 2026 | Prof. Chang | Tuttleman 00402');addBr();
    pTimeout(900,next);
  },
  function(next){
    prompt(function(){typeCmd('whoami',function(){
      out('c-output','root',100,function(){
        out('c-output','Prof. Sonny J. Chang  --  Temple University CIS Dept.',80,function(){
          out('c-output','Course: CIS 4696  --  Ethical Hacking & Intrusion Forensics',80,next);
        });
      });
    });});
  },
  function(next){
    prompt(function(){typeCmd('cat mission.txt',function(){
      addBr();
      out('c-white','You will learn to break into systems the way real attackers do.',90,function(){
        out('c-white','Manually first. Then with AI. No prior hacking experience required.',80,function(){
          out('c-white','Just curiosity. And a willingness to think like the adversary.',80,next);
        });
      });
    });});
  },
  function(next){
    prompt(function(){typeCmd('nmap -sV altoro.testfire.net',function(){
      addBr();
      out('c-dim','Starting Nmap 7.94 ...',220,function(){
        out('c-cyan','TARGET  : altoro.testfire.net',110,function(){
          out('c-cyan','STATUS  : AUTHORIZED  --  IBM Security Training Bank',100,function(){
            out('c-red','VULNS   : 14 detected | SQLi | XSS | Auth Bypass',100,function(){
              out('c-output','MISSION : One target. All semester. Know it cold.',80,next);
            });
          });
        });
      });
    });});
  },
  function(next){
    prompt(function(){typeCmd('cat syllabus.txt | grep ACT',function(){
      addBr();
      out('c-output','ACT I  [Wk 01-08]  The Human Hacker',100,function(){
        out('c-dim','         Recon  Scanning  SQLi  XSS  Credential Theft  BurpSuite',80,function(){
          out('c-output','ACT II [Wk 09-16]  The Machine Hacker',100,function(){
            out('c-dim','         AutoRecon  OWASP ZAP  Nuclei  Claude AI  APT Kill Chain',80,function(){
              out('c-dim','         Week 12: Full autonomous APT simulation.',80,next);
            });
          });
        });
      });
    });});
  },
  function(next){
    prompt(function(){typeCmd('cat course_info.txt',function(){
      addBr();
      out('c-cyan','+-----------------------------------------------------+',50,function(){
      out('c-cyan','|  COURSE  : CIS 4696                                 |',50,function(){
      out('c-cyan','|  TITLE   : Ethical Hacking & Intrusion Forensics    |',50,function(){
      out('c-cyan','|  SCHOOL  : Temple University -- CST                 |',50,function(){
      out('c-cyan','|  PROF    : Sonny J. Chang                           |',50,function(){
      out('c-cyan','|  MEETS   : Tuttleman 00402  Tue 5:30 - 8:00 PM      |',50,function(){
      out('c-cyan','|  TERM    : Fall 2026  Aug 24 - Dec 15               |',50,function(){
      out('c-cyan','|  TARGET  : altoro.testfire.net  (authorized)        |',50,function(){
      out('c-cyan','+-----------------------------------------------------+',50,next);
      });});});});});});});});
    });});
  },
  function(next){
    prompt(function(){typeCmd('echo $MANTRA',function(){
      addBr();
      out('c-mantra','You Break It.',200,function(){
        out('c-mantra','You Fix It.',200,function(){
          out('c-mantra','You Own It.',200,next);
        });
      });
    });});
  },
  function(next){
    prompt(function(){typeCmd('./begin_week1.sh',function(){
      addBr();
      out('c-dim','Loading environment...',420,function(){
        out('c-dim','Mounting Kali tools...',380,function(){
          out('c-dim','Connecting to altoro.testfire.net...',420,function(){
            addBr();
            out('c-access','  >>>  ACCESS GRANTED  <<<',350,function(){
              out('c-bright','Welcome to CIS 4696. The simulation begins now.',220,function(){
                addBr();
                announce('CIS 4696 terminal complete. Access granted. Welcome to Ethical Hacking and Intrusion Forensics.');
                prompt(function(){});
              });
            });
          });
        });
      });
    });});
  }
];

var stepIdx=0;
function runNext(){if(stepIdx>=script.length)return;script[stepIdx++](runNext);}
setTimeout(runNext,700);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
#heroWrap{width:100%;height:100%;position:relative;background:#000;}
#bgC{position:absolute;top:0;left:0;width:100%;height:100%;}

/* Full screen terminal — CRT monitor with bezel */
#monitorWrap{
  position:absolute;
  top:14px;left:14px;right:14px;bottom:14px;
  border:2px solid rgba(0,255,65,0.55);
  border-radius:10px;
  box-shadow:0 0 0 1px rgba(0,255,65,0.15),0 0 30px rgba(0,255,65,0.2),0 0 60px rgba(0,255,65,0.08),inset 0 0 30px rgba(0,0,0,0.6);
  z-index:10;
  display:flex;flex-direction:column;
  overflow:hidden;
}
#monitor{
  flex:1;
  background:rgba(0,0,0,0.72);
  display:flex;flex-direction:column;
  border:none;
}
/* Monitor title bar */
#monBar{
  background:rgba(0,20,0,0.9);
  border-bottom:1px solid rgba(0,255,65,0.25);
  padding:10px 18px;
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}
.mdot{width:11px;height:11px;border-radius:50%;}
.mdot.r{background:#ff5f57;opacity:0.7;}
.mdot.y{background:#febc2e;opacity:0.7;}
.mdot.g{background:#28c840;opacity:0.7;}
#monTitle{font-family:'Courier New',monospace;font-size:13px;color:rgba(0,255,65,0.5);margin-left:10px;letter-spacing:0.1em;}
/* Monitor body — scrollable output */
#monBody{
  flex:1;
  padding:22px 28px 80px;
  overflow:hidden;
  position:relative;
}
#termOut{
  font-family:'Courier New',Courier,monospace;
  font-size:clamp(15px,2vw,19px);
  line-height:2.1;
  color:#00ff41;
}
/* Text colors */
.c-prompt{color:rgba(0,255,65,0.5);}
.c-cmd{color:#00ff41;}
.c-output{color:rgba(0,220,50,0.75);}
.c-dim{color:rgba(0,180,40,0.45);}
.c-white{color:rgba(255,255,255,0.9);}
.c-bright{color:#ffffff;text-shadow:0 0 8px #00ff41;}
.c-red{color:#ff4d6d;}
.c-cyan{color:#22d3ee;}
.c-mantra{color:#ffffff;font-weight:900;font-size:clamp(15px,2vw,19px);text-shadow:0 0 14px #00ff41,0 0 28px rgba(0,255,65,0.4);}
.c-access{color:#00ff41;font-weight:900;font-size:clamp(16px,2.2vw,22px);text-shadow:0 0 20px #00ff41,0 0 40px rgba(0,255,65,0.6);}

/* Blinking cursor */
#cur{display:inline-block;width:10px;height:clamp(13px,1.7vw,16px);background:#00ff41;animation:blink 1s step-end infinite;vertical-align:middle;margin-left:2px;box-shadow:0 0 6px #00ff41;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* Scanline overlay */
#scan{position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.08) 3px,rgba(0,0,0,0.08) 4px);pointer-events:none;z-index:30;}

/* Pause button */
#pauseBtn{position:absolute;bottom:14px;right:14px;z-index:9999;background:rgba(0,40,0,0.9);border:1.5px solid rgba(0,255,65,0.5);border-radius:4px;color:#00ff41;font-size:13px;font-weight:700;padding:6px 14px;cursor:pointer;font-family:'Courier New',monospace;line-height:1.3;}
#pauseBtn:focus{outline:3px solid #00ff41;outline-offset:2px;}
#pauseBtn:hover{background:rgba(0,80,0,0.9);}

/* CRT vignette */
#vignette{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.55) 100%);pointer-events:none;z-index:20;}
</style>
</head>
<body>
<h2 class="sr-only">CIS 4696 Ethical Hacking and Intrusion Forensics — Temple University. Full screen terminal animation. Course info and mantra typed as if Neo watching the Matrix.</h2>
<div id="heroWrap">
  <canvas id="bgC" aria-hidden="true"></canvas>
  <div id="monitorWrap" aria-hidden="true">
  <div id="monitor">
    <div id="monBar">
      <div class="mdot r"></div>
      <div class="mdot y"></div>
      <div class="mdot g"></div>
      <span id="monTitle">kali@temple-university: ~/cis4696 — root</span>
    </div>
    <div id="monBody">
      <div id="termOut"></div>
      <span id="cur"></span>
    </div>
  </div>
  </div>
  <div id="vignette"></div>
  <div id="scan"></div>
  <button id="pauseBtn" aria-label="Pause animation" aria-pressed="false">&#9208; Pause</button>
  <div class="sr-only" aria-live="polite" aria-atomic="true" id="ariaLive"></div>
</div>

<script>
var wrap=document.getElementById('heroWrap');
var bgC=document.getElementById('bgC'),bgX=bgC.getContext('2d');
var termOut=document.getElementById('termOut');
var cur=document.getElementById('cur');
var ariaLive=document.getElementById('ariaLive');
var pauseBtn=document.getElementById('pauseBtn');
var paused=false,bgFrame=0;
var matrixCols=[];
var CHARS='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF!@#$><|/\\';

function announce(msg){ariaLive.textContent='';setTimeout(function(){ariaLive.textContent=msg;},60);}
pauseBtn.addEventListener('click',function(){
  paused=!paused;
  pauseBtn.setAttribute('aria-pressed',paused?'true':'false');
  pauseBtn.textContent=paused?'\u25B6 Resume':'\u23F8 Pause';
  pauseBtn.setAttribute('aria-label',paused?'Resume animation':'Pause animation');
  announce(paused?'Animation paused':'Animation resumed');
});

function resize(){
  bgC.width=wrap.offsetWidth||window.innerWidth;
  bgC.height=wrap.offsetHeight||window.innerHeight;
  initMatrix();
}
resize();setTimeout(resize,200);window.addEventListener('resize',resize);

function initMatrix(){
  matrixCols=[];
  var colW=18,numCols=Math.ceil(bgC.width/colW);
  for(var c=0;c<numCols;c++){
    matrixCols.push({
      x:c*colW+colW/2,
      y:Math.random()*bgC.height*-1,
      speed:1.4+Math.random()*2.6,
      trailLen:Math.floor(10+Math.random()*20),
      trail:[],
      bright:Math.random()<0.12
    });
  }
}

function drawMatrix(){
  if(!paused){
    bgX.fillStyle='rgba(0,0,0,0.08)';
    bgX.fillRect(0,0,bgC.width,bgC.height);
    bgX.font='bold 14px "Courier New",monospace';
    bgX.textAlign='center';
    matrixCols.forEach(function(col){
      col.y+=col.speed;
      col.trail.unshift(CHARS[Math.floor(Math.random()*CHARS.length)]);
      if(col.trail.length>col.trailLen)col.trail.length=col.trailLen;
      if(col.y-col.trail.length*16>bgC.height){
        col.y=Math.random()*bgC.height*-0.5;
        col.trail=[];
        col.speed=1.4+Math.random()*2.6;
        col.trailLen=Math.floor(10+Math.random()*20);
      }
      for(var i=0;i<col.trail.length;i++){
        var cy=col.y-i*16;
        if(cy<0||cy>bgC.height)continue;
        var ratio=1-(i/col.trailLen);
        if(i===0){
          bgX.fillStyle=col.bright?'rgba(255,255,255,0.9)':'rgba(180,255,180,0.92)';
          bgX.shadowColor='#00ff41';bgX.shadowBlur=14;
        } else {
          var g=Math.floor(200*ratio+20);
          bgX.fillStyle='rgba(0,'+g+',0,'+(ratio*0.65)+')';
          bgX.shadowBlur=ratio>0.6?5:0;
          bgX.shadowColor='#00ff41';
        }
        bgX.fillText(col.trail[i],col.x,cy);
      }
      bgX.shadowBlur=0;
    });
    bgFrame++;
  }
  requestAnimationFrame(drawMatrix);
}
drawMatrix();

// ── Typewriter engine ──
function pTimeout(ms,cb){
  var elapsed=0,last=performance.now();
  function check(){var now=performance.now();if(!paused)elapsed+=now-last;last=now;elapsed>=ms?cb():requestAnimationFrame(check);}
  requestAnimationFrame(check);
}

function addEl(cls,text){
  var span=document.createElement('span');
  span.className=cls;
  span.textContent=text;
  termOut.insertBefore(span,null);
  return span;
}

function addBr(){termOut.appendChild(document.createElement('br'));}

function typeText(cls,text,speed,cb){
  if(paused){setTimeout(function(){typeText(cls,text,speed,cb);},80);return;}
  var span=document.createElement('span');
  span.className=cls;
  termOut.insertBefore(span,null);
  var i=0;
  function next(){
    if(paused){setTimeout(next,80);return;}
    if(i>=text.length){cb&&cb();return;}
    span.textContent+=text[i++];
    // Auto scroll
    var mb=document.getElementById('monBody');
    mb.scrollTop=mb.scrollHeight;
    setTimeout(next,speed+(Math.random()*speed*0.4));
  }
  next();
}

function prompt(cb){
  addBr();
  addEl('c-dim','[root@kali cis4696]');
  addEl('c-prompt',' ~$ ');
  pTimeout(280,cb);
}

function typeCmd(cmd,cb){
  typeText('c-cmd',cmd,38,function(){
    pTimeout(320,cb);
  });
}

function out(cls,text,delay,cb){
  addBr();
  addEl(cls,'  '+text);
  pTimeout(delay,cb);
}

// ── Script ──
var script=[
  // Boot
  function(next){
    addEl('c-dim','Kali GNU/Linux — Temple University Security Lab');addBr();
    addEl('c-dim','CIS 4696 | Ethical Hacking & Intrusion Forensics');addBr();
    addEl('c-dim','Fall 2026 | Prof. Chang | Tuttleman 00402');addBr();
    addBr();
    pTimeout(900,next);
  },
  // whoami
  function(next){
    prompt(function(){typeCmd('whoami',function(){
      out('c-output','root',120,function(){
        out('c-output','Prof. Sonny J. Chang — Temple University CIS Dept.',80,function(){
          out('c-output','Course: CIS 4696 — Ethical Hacking & Intrusion Forensics',80,next);
        });
      });
    });});
  },
  // cat mission
  function(next){
    prompt(function(){typeCmd('cat mission.txt',function(){
      addBr();
      out('c-white','You will learn to break into systems the way real attackers do.',90,function(){
        out('c-white','Manually first. Then with AI. No prior hacking experience required.',80,function(){
          out('c-white','Just curiosity. And a willingness to think like the adversary.',80,next);
        });
      });
    });});
  },
  // cat target
  function(next){
    prompt(function(){typeCmd('nmap -sV altoro.testfire.net',function(){
      addBr();
      out('c-dim','Starting Nmap 7.94 ...',200,function(){
        out('c-cyan','TARGET  : altoro.testfire.net',120,function(){
          out('c-cyan','STATUS  : AUTHORIZED — IBM Security Training Bank',100,function(){
            out('c-red','VULNS   : 14 detected | SQLi | XSS | Auth Bypass',100,function(){
              out('c-output','MISSION : One target. All semester. Know it cold.',80,next);
            });
          });
        });
      });
    });});
  },
  // Two acts
  function(next){
    prompt(function(){typeCmd('cat syllabus.txt | grep ACT',function(){
      addBr();
      out('c-output','ACT I  [Wk 01-08] — The Human Hacker',100,function(){
        out('c-dim','  Recon · Scanning · SQLi · XSS · Credential Theft · BurpSuite',80,function(){
          out('c-output','ACT II [Wk 09-16] — The Machine Hacker',100,function(){
            out('c-dim','  AutoRecon · OWASP ZAP · Nuclei · Claude AI · APT Kill Chain',80,function(){
              out('c-dim','  Week 12: Full autonomous APT simulation. Nation-state tactics.',80,next);
            });
          });
        });
      });
    });});
  },
  // Meetings
  function(next){
    prompt(function(){typeCmd('cat schedule.conf',function(){
      addBr();
      out('c-output','LOCATION : Tuttleman Learning Center 00402',90,function(){
        out('c-output','MEETS    : Tuesdays 5:30 PM — 8:00 PM (EDT)',80,function(){
          out('c-output','DATES    : Aug 24, 2026 — Dec 15, 2026',80,next);
        });
      });
    });});
  },
  // course info
  function(next){
    prompt(function(){typeCmd('cat course_info.txt',function(){
      addBr();
      out('c-cyan','┌─────────────────────────────────────────────────────┐',60,function(){
      out('c-cyan','│  COURSE  : CIS 4696                                 │',60,function(){
      out('c-cyan','│  TITLE   : Ethical Hacking & Intrusion Forensics    │',60,function(){
      out('c-cyan','│  SCHOOL  : Temple University — CST                  │',60,function(){
      out('c-cyan','│  PROF    : Sonny J. Chang                           │',60,function(){
      out('c-cyan','│  MEETS   : Tuttleman 00402 · Tue 5:30–8:00 PM       │',60,function(){
      out('c-cyan','│  TERM    : Fall 2026 · Aug 24 – Dec 15              │',60,function(){
      out('c-cyan','│  TARGET  : altoro.testfire.net (authorized)         │',60,function(){
      out('c-cyan','│  FORMAT  : Hybrid · No textbook · $0 cost           │',60,function(){
      out('c-cyan','└─────────────────────────────────────────────────────┘',60,next);
      });});});});});});});});});
    });});
  },
  // echo mantra
  function(next){
    prompt(function(){typeCmd('echo $MANTRA',function(){
      addBr();
      out('c-mantra','You Break It.',180,function(){
        out('c-mantra','You Fix It.',180,function(){
          out('c-mantra','You Own It.',180,next);
        });
      });
    });});
  },
  // begin
  function(next){
    prompt(function(){typeCmd('./begin_week1.sh',function(){
      addBr();
      out('c-dim','Loading environment...',400,function(){
        out('c-dim','Mounting Kali tools...',350,function(){
          out('c-dim','Connecting to altoro.testfire.net...',400,function(){
            addBr();
            out('c-access','██ ACCESS GRANTED ██',300,function(){
              out('c-bright','Welcome to CIS 4696. The simulation begins now.',200,function(){
                addBr();
                pTimeout(800,next);
              });
            });
          });
        });
      });
    });});
  },
  // idle — keep cursor blinking
  function(next){
    prompt(function(){
      announce('CIS 4696 terminal sequence complete. Course: Ethical Hacking and Intrusion Forensics, Temple University Fall 2026.');
    });
  }
];

var stepIdx=0;
function runNext(){
  if(stepIdx>=script.length)return;
  script[stepIdx++](runNext);
}

setTimeout(runNext,600);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIS 4696 — Picking the Lock 🔓 Manual Exploitation Techniques</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3350;
            --blue:#4f8ef7; --blue-dim:#1e2d4f;
            --green:#3ecf8e; --green-dim:#0d2e1f;
            --red:#f87171; --red-dim:#2e1010;
            --yellow:#fbbf24; --yellow-dim:#2e2208;
            --aws:#FF9900; --aws-dim:#2e1c00; --aws-border:#6b3f00;
            --azure:#0078D4; --azure-dim:#001e3c; --azure-border:#004080;
            --gcp:#34A853; --gcp-dim:#0a2410; --gcp-border:#1a5c2a;
            --text:#e8eaf6; --text2:#8b92b8; --text3:#4a5080;
            --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--blue);
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            font-weight: 600;
            z-index: 100;
        }

        .skip-link:focus {
            top: 0;
        }

        button:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 2px;
        }

        a:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 2px;
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.aws { background: var(--aws); }
        .dot.azure { background: var(--azure); }
        .dot.gcp { background: var(--gcp); }

        .title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }

        .stats {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .pill {
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-family: var(--mono);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pill-label {
            color: var(--text2);
        }

        .pill-value {
            color: var(--text);
            font-weight: 600;
        }

        .progress-bar {
            height: 3px;
            background: var(--surface2);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--green));
            transition: width 0.3s ease;
            width: 0%;
        }

        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .round-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .scenario-label {
            color: var(--text2);
            font-family: var(--mono);
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .scenario-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .scenario-body {
            color: var(--text2);
            margin-bottom: 1.5rem;
            line-height: 1.7;
        }

        .concept-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--blue-dim);
            border: 1px solid var(--blue);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .concept-emoji {
            font-size: 1.25rem;
        }

        .concept-text {
            display: flex;
            flex-direction: column;
        }

        .concept-main {
            font-weight: 600;
            color: var(--blue);
            font-size: 0.9rem;
        }

        .concept-sub {
            font-size: 0.75rem;
            color: var(--text2);
        }

        .question {
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            background: var(--surface2);
            border: 2px solid var(--border);
            color: var(--text);
            padding: 1rem;
            border-radius: 8px;
            font-family: var(--sans);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .option-btn:hover {
            background: var(--surface);
            border-color: var(--blue);
        }

        .option-btn[aria-pressed="true"] {
            background: var(--blue-dim);
            border-color: var(--blue);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn.correct {
            background: var(--green-dim);
            border-color: var(--green);
        }

        .option-btn.wrong {
            background: var(--red-dim);
            border-color: var(--red);
        }

        .fb {
            background: var(--surface2);
            border-left: 4px solid var(--blue);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .fb.show {
            display: block;
        }

        .fb.success {
            border-left-color: var(--green);
            background: var(--green-dim);
        }

        .fb.error {
            border-left-color: var(--red);
            background: var(--red-dim);
        }

        .fb-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
        }

        .fb-text {
            color: var(--text2);
            margin-bottom: 1rem;
            line-height: 1.7;
        }

        .breakdown {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .breakdown-row {
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
        }

        .breakdown-icon {
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .breakdown-text {
            color: var(--text2);
            line-height: 1.6;
        }

        .next-btn {
            background: var(--blue);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-family: var(--sans);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: none;
        }

        .next-btn.show {
            display: inline-block;
        }

        .next-btn:hover {
            background: var(--blue);
            filter: brightness(1.2);
        }

        .final-screen {
            text-align: center;
            display: none;
        }

        .final-screen.show {
            display: block;
        }

        .final-score {
            font-size: 4rem;
            font-weight: 600;
            color: var(--green);
            margin-bottom: 1rem;
            font-family: var(--mono);
        }

        .final-label {
            color: var(--text2);
            font-size: 1.25rem;
            margin-bottom: 2rem;
        }

        .stat-boxes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: var(--blue);
            font-family: var(--mono);
        }

        .stat-label {
            color: var(--text2);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .replay-btn {
            background: var(--blue);
            color: white;
            border: none;
            padding: 1rem 3rem;
            border-radius: 8px;
            font-family: var(--sans);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .replay-btn:hover {
            filter: brightness(1.2);
        }

        .streak-flash {
            animation: streakPulse 0.5s ease;
        }

        @keyframes streakPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @media (max-width: 600px) {
            .header {
                padding: 1rem;
            }
            .title {
                font-size: 1rem;
            }
            .stats {
                width: 100%;
            }
            .pill {
                font-size: 0.8rem;
                padding: 0.4rem 0.8rem;
            }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <header class="header">
        <div class="logo-section">
            <div class="dots">
                <div class="dot aws"></div>
                <div class="dot azure"></div>
                <div class="dot gcp"></div>
            </div>
            <h1 class="title">CIS 4696 — Picking the Lock 🔓 Manual Exploitation Techniques</h1>
        </div>
        <div class="stats">
            <div class="pill">
                <span class="pill-label">Score:</span>
                <span class="pill-value" id="score-el" aria-live="polite" aria-atomic="true">0</span>
            </div>
            <div class="pill">
                <span class="pill-label">Round:</span>
                <span class="pill-value" id="round-el" aria-live="polite" aria-atomic="true">1/5</span>
            </div>
            <div class="pill">
                <span class="pill-label">Streak:</span>
                <span class="pill-value" id="streak-el" aria-live="polite" aria-atomic="true">0 🔥</span>
            </div>
        </div>
    </header>

    <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Quiz progress">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <main id="main-content">
        <div id="game-container"></div>
        <div id="final-container" class="final-screen"></div>
    </main>

    <script>
        const scenarios = [
            {
                id: 1,
                label: "Scenario 1 — Buffer Overflow Exploitation",
                title: "Identifying the Overflow",
                body: "You're pentesting a legacy customer portal application running on a client's internal network. Initial scanning revealed a custom login service on port 8445 that crashes when you send a string of 500 'A' characters. The client wants to know if this is exploitable. You need to determine the next step in confirming a buffer overflow vulnerability.",
                concept: "Buffer Overflow Detection",
                conceptEmoji: "🔓",
                conceptSub: "Finding memory corruption",
                question: "What is your next step to confirm and exploit this buffer overflow?",
                options: [
                    "A. Send increasingly larger payloads until you identify the exact offset where EIP is overwritten",
                    "B. Immediately report the crash as a critical finding and move to the next target",
                    "C. Run a password brute force attack to gain legitimate access instead",
                    "D. Restart the service and try a SQL injection payload"
                ],
                correct: 0,
                feedback: {
                    correct: "Correct! Finding the exact offset where you control EIP (instruction pointer) is critical for buffer overflow exploitation. This lets you redirect execution to your payload—the foundation of manual exploitation.",
                    wrong: "The correct answer is A. After confirming a crash, you must find the exact offset where EIP is overwritten. This is the precise byte count needed to control program execution flow and inject your shellcode.",
                    breakdown: [
                        {icon:"✅", text:"Crashes indicate potential memory corruption—you need to find the exact offset for control"},
                        {icon:"💡", text:"Tools like pattern_create and pattern_offset help identify the exact EIP overwrite point"},
                        {icon:"⚠️", text:"Don't confuse fuzzing (causing crashes) with exploitation (controlling execution flow)"}
                    ]
                }
            },
            {
                id: 2,
                label: "Scenario 2 — Return-Oriented Programming (ROP)",
                title: "Bypassing DEP Protection",
                body: "You've gained control of EIP on a Windows service, but when you try to execute shellcode on the stack, the program crashes. You discover DEP (Data Execution Prevention) is enabled. The client expects you to demonstrate full exploitation—not just a crash—so you need to bypass this protection using manual techniques without relying on automated exploit frameworks.",
                concept: "ROP Chain Construction",
                conceptEmoji: "⛓️",
                conceptSub: "Defeating memory protections",
                question: "Which technique allows you to bypass DEP and execute your payload?",
                options: [
                    "A. Use Return-Oriented Programming (ROP) to chain together existing code gadgets ending in 'ret' instructions",
                    "B. Disable DEP by rebooting the server and modifying boot.ini during the restart",
                    "C. Encrypt your shellcode with XOR to hide it from DEP scanning",
                    "D. Change the payload to a reverse shell instead of a bind shell"
                ],
                correct: 0,
                feedback: {
                    correct: "Exactly right! ROP chains use existing executable code snippets ('gadgets') in memory to perform operations without injecting new executable code. This defeats DEP because you're only calling code already marked executable.",
                    wrong: "The correct answer is A. ROP (Return-Oriented Programming) chains small code gadgets already present in memory to build your exploit logic. Since these gadgets are in executable memory regions, DEP doesn't block them.",
                    breakdown: [
                        {icon:"✅", text:"DEP marks stack/heap as non-executable—ROP uses code already in executable segments"},
                        {icon:"💡", text:"ROP gadgets are found using tools like ropper or rp++ by searching for 'ret' instruction sequences"},
                        {icon:"⚠️", text:"ROP doesn't disable DEP—it works within the constraints DEP creates by reusing legitimate code"}
                    ]
                }
            },
            {
                id: 3,
                label: "Scenario 3 — SQL Injection Manual Exploitation",
                title: "Extracting Database Credentials",
                body: "You've discovered a SQL injection vulnerability in a web application's search field. Your basic test '1' OR '1'='1 successfully returned all records. Now you need to extract the admin password hash from the users table for your penetration test report. The application doesn't display error messages, making this a blind injection scenario that requires manual enumeration.",
                concept: "Manual SQLi Exploitation",
                conceptEmoji: "💉",
                conceptSub: "Extracting data via injection",
                question: "What is the correct approach to extract the admin password hash manually?",
                options: [
                    "A. Use UNION-based injection to combine your query with SELECT password FROM users WHERE username='admin'",
                    "B. Use the sqlmap tool with aggressive scanning to automate the extraction",
                    "C. Send hundreds of random SQL queries until one returns the password",
                    "D. Perform a brute-force attack on the login page using common passwords"
                ],
                correct: 0,
                feedback: {
                    correct: "Perfect! UNION-based injection allows you to append your own SELECT statement to the original query, pulling data directly from the database. This is a foundational manual SQLi technique that every pentester must master.",
                    wrong: "The correct answer is A. UNION SELECT lets you append a second query to extract specific columns from any table. First you identify the number of columns, then inject: ' UNION SELECT password,NULL,NULL FROM users WHERE username='admin'--",
                    breakdown: [
                        {icon:"✅", text:"UNION injection requires matching column count—use ORDER BY to find it first"},
                        {icon:"💡", text:"Comment out the rest of the query with -- or # to prevent syntax errors"},
                        {icon:"⚠️", text:"Blind injection requires boolean-based or time-based techniques if no output is visible"}
                    ]
                }
            },
            {
                id: 4,
                label: "Scenario 4 — Privilege Escalation via SUID Binaries",
                title: "Escaping Limited Shell",
                body: "You've gained a low-privilege shell on a Linux server through a web application vulnerability. Running 'find / -perm -4000 2>/dev/null' reveals several SUID binaries, including /usr/bin/find owned by root. Your goal is to escalate to root privileges to demonstrate full system compromise for the penetration test, using manual exploitation techniques rather than automated privilege escalation scripts.",
                concept: "SUID Binary Exploitation",
                conceptEmoji: "⬆️",
                conceptSub: "Privilege escalation paths",
                question: "How do you exploit the SUID find binary to gain root access?",
                options: [
                    "A. Execute: find . -exec /bin/bash -p \\; to spawn a root shell using find's SUID permissions",
                    "B. Copy /bin/bash to /tmp and rename it to 'find' to trick the system",
                    "C. Run find with the --root flag to automatically gain root permissions",
                    "D. Use find to search for the root password in /etc/shadow"
                ],
                correct: 0,
                feedback: {
                    correct: "Excellent! SUID binaries that allow command execution (like find's -exec flag) can be leveraged to spawn shells with the binary owner's privileges. The -p flag preserves the elevated permissions in bash.",
                    wrong: "The correct answer is A. The find command with SUID runs as root. Using -exec, you can run any command—including /bin/bash -p—which spawns a root shell. The -p flag prevents bash from dropping privileges.",
                    breakdown: [
                        {icon:"✅", text:"SUID bit (4000) causes binaries to run with owner's permissions—often root"},
                        {icon:"💡", text:"GTFOBins is an excellent resource cataloging SUID exploitation techniques for common binaries"},
                        {icon:"⚠️", text:"Always use 'bash -p' or 'sh -p' to prevent the shell from dropping elevated privileges"}
                    ]
                }
            },
            {
                id: 5,
                label: "Scenario 5 — Exploiting Unrestricted File Upload",
                title: "Achieving Remote Code Execution",
                body: "You're testing a corporate file-sharing application that allows employees to upload documents. You discover the upload function doesn't properly validate file types—it only checks the file extension on the client side using JavaScript. The uploads directory is web-accessible at /uploads/, and you can browse directly to uploaded files. You need to achieve remote code execution to demonstrate the severity of this vulnerability.",
                concept: "File Upload to RCE",
                conceptEmoji: "📤",
                conceptSub: "Weaponizing upload functions",
                question: "What is the most effective manual exploitation path to achieve RCE?",
                options: [
                    "A. Upload a PHP web shell (e.g., <?php system($_GET['cmd']); ?>) and access it via browser to execute commands",
                    "B. Upload a .txt file containing malicious JavaScript and wait for an admin to view it",
                    "C. Upload a large file to perform a denial-of-service attack",
                    "D. Upload a fake SSL certificate to perform a man-in-the-middle attack"
                ],
                correct: 0,
                feedback: {
                    correct: "Perfect! Uploading a PHP web shell is the classic manual exploitation technique. Since the server executes PHP and the uploads directory is web-accessible, you can directly browse to your shell and execute arbitrary commands via URL parameters.",
                    wrong: "The correct answer is A. With client-side validation only, you can bypass it (disable JavaScript or intercept with Burp) and upload a PHP shell. Accessing /uploads/shell.php?cmd=whoami executes your command server-side.",
                    breakdown: [
                        {icon:"✅", text:"Client-side validation can always be bypassed—server-side validation is mandatory"},
                        {icon:"💡", text:"Test if uploads are executable by uploading a benign PHP file with <?php phpinfo(); ?> first"},
                        {icon:"⚠️", text:"Web shells leave forensic evidence—professional pentesters document each action and clean up afterward"}
                    ]
                }
            }
        ];

        let currentScenario = 0;
        let score = 0;
        let streak = 0;
        let selectedAnswer = null;
        let answered = false;

        const gameContainer = document.getElementById('game-container');
        const finalContainer = document.getElementById('final-container');
        const scoreEl = document.getElementById('score-el');
        const roundEl = document.getElementById('round-el');
        const streakEl = document.getElementById('streak-el');
        const progressFill = document.getElementById('progress-fill');
        const progressBar = document.querySelector('.progress-bar');

        function updateProgress() {
            const progress = ((currentScenario) / scenarios.length) * 100;
            progressFill.style.width = progress + '%';
            progressBar.setAttribute('aria-valuenow', progress);
        }

        function updateStats() {
            scoreEl.textContent = score;
            roundEl.textContent = `${currentScenario + 1}/${scenarios.length}`;
            streakEl.textContent = `${streak} 🔥`;
            if (streak >= 3) {
                streakEl.parentElement.classList.add('streak-flash');
                setTimeout(() => streakEl.parentElement.classList.remove('streak-flash'), 500);
            }
        }

        function renderScenario() {
            answered = false;
            selectedAnswer = null;
            const s = scenarios[currentScenario];
            
            gameContainer.innerHTML = `
                <section class="round-card" aria-labelledby="scenario-title-${s.id}">
                    <div class="scenario-label">${s.label}</div>
                    <h2 class="scenario-title" id="scenario-title-${s.id}">${s.title}</h2>
                    <p class="scenario-body">${s.body}</p>
                    <div class="concept-badge">
                        <span class="concept-emoji" role="img" aria-label="${s.concept}">${s.conceptEmoji}</span>
                        <div class="concept-text">
                            <div class="concept-main">${s.concept}</div>
                            <div class="concept-sub">${s.conceptSub}</div>
                        </div>
                    </div>
                    <div class="question">${s.question}</div>
                    <div class="options" role="group" aria-label="Answer options">
                        ${s.options.map((opt, idx) => `
                            <button class="option-btn" data-idx="${idx}" aria-pressed="false">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                    <div class="fb" role="alert" aria-live="assertive" id="feedback"></div>
                    <button class="next-btn" id="next-btn">Next Scenario →</button>
                </section>
            `;

            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.idx)));
            });

            document.getElementById('next-btn').addEventListener('click', nextScenario);
            updateStats();
            updateProgress();
        }

        function selectAnswer(idx) {
            if (answered) return;

            const s = scenarios[currentScenario];
            selectedAnswer = idx;
            answered = true;

            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, i) => {
                btn.setAttribute('aria-pressed', i === idx ? 'true' : 'false');
                btn.disabled = true;
                if (i === s.correct) {
                    btn.classList.add('correct');
                } else if (i === idx) {
                    btn.classList.add('wrong');
                }
            });

            const isCorrect = idx === s.correct;
            const fb = document.getElementById('feedback');
            fb.className = 'fb show ' + (isCorrect ? 'success' : 'error');

            let points = 0;
            if (isCorrect) {
                streak++;
                points = 10;
                if (streak >= 3) points += 5;
                score += points;
                fb.innerHTML = `
                    <div class="fb-title">
                        <span role="img" aria-label="Correct">✅</span>
                        Correct! ${points > 10 ? `+${points} points (streak bonus!)` : `+${points} points`}
                    </div>
                    <div class="fb-text">${s.feedback.correct}</div>
                    <div class="breakdown">
                        ${s.feedback.breakdown.map(b => `
                            <div class="breakdown-row">
                                <span class="breakdown-icon" aria-hidden="true">${b.icon}</span>
                                <div class="breakdown-text">${b.text}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                streak = 0;
                score = Math.max(0, score - 2);
                fb.innerHTML = `
                    <div class="fb-title">
                        <span role="img" aria-label="Incorrect">❌</span>
                        Not quite. -2 points
                    </div>
                    <div class="fb-text">${s.feedback.wrong}</div>
                    <div class="breakdown">
                        ${s.feedback.breakdown.map(b => `
                            <div class="breakdown-row">

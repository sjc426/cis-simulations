<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CIS 4696 Week 1 Header</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
#hw{width:100%;height:100%;position:relative;background:#050505;}
#bgC{position:absolute;top:8px;left:8px;z-index:1;border-radius:6px;}
#mw{position:absolute;top:8px;left:8px;right:8px;bottom:8px;border:2px solid #00ff41;border-radius:8px;box-shadow:0 0 0 1px rgba(0,255,65,0.15),0 0 18px rgba(0,255,65,0.7),0 0 45px rgba(0,255,65,0.25);z-index:5;display:flex;flex-direction:column;overflow:hidden;background:transparent;pointer-events:none;}
#mb{background:#050f05;border-bottom:1.5px solid #00ff41;padding:7px 14px;display:flex;align-items:center;gap:7px;flex-shrink:0;}
.mdot{width:11px;height:11px;border-radius:50%;}
#mt{font-family:'Courier New',monospace;font-size:12px;color:#fff;margin-left:10px;flex:1;text-align:center;letter-spacing:.06em;font-weight:700;text-shadow:0 0 8px #00ff41;}
#bd{flex:1;padding:10px 18px 36px;overflow:hidden;position:relative;}
#to{font-family:'Courier New',Courier,monospace;font-size:clamp(11px,1.5vw,13px);line-height:1.75;color:#00ff41;}
.cp{color:rgba(0,255,65,0.38);}.cc{color:#00ff41;font-weight:700;}.co{color:rgba(0,220,50,0.78);}.cd{color:rgba(0,180,40,0.50);}.cw{color:rgba(255,255,255,0.88);}.cr{color:#ff4d6d;}.cy{color:#00e5ff;}
#cur{display:inline-block;width:9px;height:clamp(11px,1.5vw,13px);background:#00ff41;animation:blink .9s step-end infinite;vertical-align:middle;margin-left:2px;box-shadow:0 0 6px #00ff41;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
#sc{position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);pointer-events:none;z-index:6;border-radius:6px;}
#vg{position:absolute;top:8px;left:8px;right:8px;bottom:8px;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.6) 100%);pointer-events:none;z-index:4;border-radius:6px;}
#pb{position:absolute;bottom:12px;right:14px;z-index:9999;background:rgba(0,20,0,0.95);border:1.5px solid #00ff41;border-radius:3px;color:#00ff41;font-size:11px;font-weight:700;padding:4px 11px;cursor:pointer;font-family:'Courier New',monospace;box-shadow:0 0 10px rgba(0,255,65,0.4);pointer-events:auto;}
#pb:hover{background:rgba(0,50,0,0.95);}
</style>
</head>
<body>
<h2 class="sr-only">CIS 4696 Week 1 - Kali Linux Setup and Orientation. Animated terminal header showing week 1 commands.</h2>
<div id="hw">
  <canvas id="bgC" aria-hidden="true"></canvas>
  <div id="mw">
    <div id="mb">
      <div class="mdot" style="background:#ff5f57"></div>
      <div class="mdot" style="background:#febc2e"></div>
      <div class="mdot" style="background:#28c840"></div>
      <span id="mt">kali@temple-university: ~/cis4696/week01 &mdash; root</span>
    </div>
    <div id="bd">
      <div id="to" aria-hidden="true"></div>
      <span id="cur" aria-hidden="true"></span>
    </div>
  </div>
  <div id="sc"></div>
  <div id="vg"></div>
  <button id="pb" aria-label="Pause animation">&#9208; Pause</button>
  <div class="sr-only" aria-live="polite" id="al"></div>
</div>
<script>
var hw=document.getElementById('hw'),mw=document.getElementById('mw');
var bgC=document.getElementById('bgC'),bgX=bgC.getContext('2d');
var to=document.getElementById('to'),al=document.getElementById('al');
var pb=document.getElementById('pb');
var paused=false,cols=[];
var CH='0123456789ABCDEF!@#><|/\\';
pb.addEventListener('click',function(){
  paused=!paused;
  pb.textContent=paused?'\u25B6 Resume':'\u23F8 Pause';
  al.textContent='';setTimeout(function(){al.textContent=paused?'Animation paused':'Animation resumed';},60);
});
function resize(){
  var r=mw.getBoundingClientRect();
  bgC.width=Math.round(r.width);bgC.height=Math.round(r.height);
  bgC.style.width=bgC.width+'px';bgC.style.height=bgC.height+'px';
  initM();
}
resize();setTimeout(resize,200);window.addEventListener('resize',resize);
function initM(){
  cols=[];
  var cw=16,n=Math.ceil(bgC.width/cw);
  for(var i=0;i<n;i++)cols.push({x:i*cw+8,y:Math.random()*bgC.height*-1,sp:1.2+Math.random()*2.2,tl:Math.floor(8+Math.random()*16),tr:[],bright:Math.random()<0.1});
}
function drawM(){
  if(!paused){
    bgX.fillStyle='rgba(0,0,0,0.10)';bgX.fillRect(0,0,bgC.width,bgC.height);
    bgX.font='bold 12px "Courier New",monospace';bgX.textAlign='center';
    cols.forEach(function(c){
      c.y+=c.sp;c.tr.unshift(CH[Math.floor(Math.random()*CH.length)]);
      if(c.tr.length>c.tl)c.tr.length=c.tl;
      if(c.y-c.tr.length*14>bgC.height){c.y=Math.random()*bgC.height*-0.5;c.tr=[];c.sp=1.2+Math.random()*2.2;}
      for(var i=0;i<c.tr.length;i++){
        var cy=c.y-i*14;if(cy<0||cy>bgC.height)continue;
        var r=1-(i/c.tl);
        if(i===0){bgX.fillStyle=c.bright?'rgba(255,255,255,0.85)':'rgba(180,255,180,0.88)';bgX.shadowColor='#00ff41';bgX.shadowBlur=12;}
        else{bgX.fillStyle='rgba(0,'+Math.floor(190*r+20)+',0,'+(r*0.55)+')';bgX.shadowBlur=r>0.6?4:0;}
        bgX.fillText(c.tr[i],c.x,cy);
      }
      bgX.shadowBlur=0;
    });
  }
  requestAnimationFrame(drawM);
}
drawM();
function pTO(ms,cb){
  var el=0,last=performance.now();
  function ck(){var n=performance.now();if(!paused)el+=n-last;last=n;el>=ms?cb():requestAnimationFrame(ck);}
  requestAnimationFrame(ck);
}
function addEl(cls,txt){var s=document.createElement('span');s.className=cls;s.textContent=txt;to.appendChild(s);return s;}
function br(){to.appendChild(document.createElement('br'));}
function scroll(){document.getElementById('bd').scrollTop=9999;}
function type(cls,txt,spd,cb){
  if(paused){setTimeout(function(){type(cls,txt,spd,cb);},80);return;}
  var s=document.createElement('span');s.className=cls;to.appendChild(s);var i=0;
  function nxt(){if(paused){setTimeout(nxt,80);return;}if(i>=txt.length){cb&&cb();return;}s.textContent+=txt[i++];scroll();setTimeout(nxt,spd+(Math.random()*spd*0.3));}
  nxt();
}
function prm(cb){br();addEl('cd','[root@kali week01]');addEl('cp',' ~$ ');pTO(180,cb);}
function cmd(t,cb){type('cc',t,40,function(){pTO(260,cb);});}
function out(cls,txt,d,cb){br();addEl(cls,txt);scroll();pTO(d,cb);}
var steps=[
  function(nx){
    addEl('cd','Kali GNU/Linux 2024.4  |  Temple University Security Lab');br();
    addEl('cd','CIS 4696  |  Week 01  |  Kali Setup and Orientation');br();
    pTO(600,nx);
  },
  function(nx){
    prm(function(){cmd('uname -a',function(){
      out('co','Linux kali 6.11.2-amd64 #1 SMP Kali 2024 x86_64 GNU/Linux',80,nx);
    });});
  },
  function(nx){
    prm(function(){cmd('ls /usr/share/nmap/scripts/ | wc -l',function(){
      out('co','604',60,function(){
        out('cd','// 604 scripts. One attack surface per tool. You will learn them manually first.',90,nx);
      });
    });});
  },
  function(nx){
    prm(function(){cmd('cat /etc/os-release | grep PRETTY_NAME',function(){
      out('co','PRETTY_NAME="Kali GNU/Linux Rolling"',80,function(){
        out('cd','// Built by Offensive Security for professional engagements. Not education.',80,nx);
      });
    });});
  },
  function(nx){
    prm(function(){cmd('echo $RULE_ONE',function(){
      br();addEl('cw','Authorization is what separates professionals from criminals.');
      pTO(500,function(){
        out('cd','// Week 2: Rules of Engagement. Until then, read the lab docs.',120,nx);
      });
    });});
  },
  function(nx){prm(function(){});al.textContent='Week 1 terminal complete.';}
];
var si=0;function run(){if(si<steps.length)steps[si++](run);}
setTimeout(run,400);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS 4345 — Serverless & Containers ⚡ The Three Landlords Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3350;
  --blue:#4f8ef7; --blue-dim:#1e2d4f;
  --green:#3ecf8e; --green-dim:#0d2e1f;
  --red:#f87171; --red-dim:#2e1010;
  --yellow:#fbbf24; --yellow-dim:#2e2208;
  --aws:#FF9900; --aws-dim:#2e1c00; --aws-border:#6b3f00;
  --azure:#0078D4; --azure-dim:#001e3c; --azure-border:#004080;
  --gcp:#34A853; --gcp-dim:#0a2410; --gcp-border:#1a5c2a;
  --text:#e8eaf6; --text2:#8b92b8; --text3:#4a5080;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  min-width:380px; -webkit-font-smoothing:antialiased;
}
.skip-link{
  position:absolute; top:-40px; left:0; background:var(--blue); color:#08101f;
  padding:8px 16px; z-index:100; font-weight:600; text-decoration:none; border-radius:0 0 6px 0;
}
.skip-link:focus{ top:0; }

button:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
a:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }

header.topbar{
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:14px 20px; display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:10px; position:sticky; top:0; z-index:10;
}
.brand{ display:flex; align-items:center; gap:10px; }
.dots{ display:flex; gap:4px; }
.dot{ width:10px; height:10px; border-radius:50%; }
.dot.aws{background:var(--aws);} .dot.azure{background:var(--azure);} .dot.gcp{background:var(--gcp);}
.brand h1{ font-size:16px; margin:0; font-family:var(--mono); font-weight:600; letter-spacing:.3px; }
.pills{ display:flex; gap:8px; flex-wrap:wrap; }
.pill{
  background:var(--surface2); border:1px solid var(--border); border-radius:20px;
  padding:6px 12px; font-family:var(--mono); font-size:13px; color:var(--text2);
  display:flex; align-items:center; gap:6px;
}
.pill strong{ color:var(--text); }
.pill.streak-flash{ animation:flash 0.6s ease; }
@keyframes flash{
  0%{ background:var(--yellow-dim); border-color:var(--yellow); }
  100%{ background:var(--surface2); border-color:var(--border); }
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
}

.progress-wrap{ height:3px; background:var(--surface2); width:100%; }
.progress-bar{ height:100%; background:linear-gradient(90deg,var(--aws),var(--azure),var(--gcp)); width:0%; transition:width .3s ease; }

main{ max-width:760px; margin:0 auto; padding:24px 16px 60px; }

.round-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:24px; margin-bottom:20px;
}
.round-label{ font-family:var(--mono); font-size:12px; color:var(--text2); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.round-card h2{ font-size:22px; margin:0 0 12px; color:var(--text); }
.round-body{ font-size:15px; line-height:1.6; color:var(--text2); margin-bottom:16px; }
.concept-badge{
  display:inline-flex; align-items:center; gap:8px; background:var(--blue-dim);
  border:1px solid var(--blue); color:var(--blue); border-radius:10px; padding:8px 14px;
  font-family:var(--mono); font-size:13px; margin-bottom:8px;
}
.concept-badge .sub{ color:var(--text2); font-size:12px; }

.question{ font-weight:600; margin:18px 0 12px; font-size:15px; }

.options{ display:flex; flex-direction:column; gap:10px; }
.opt-btn{
  text-align:left; background:var(--surface2); border:1px solid var(--border);
  color:var(--text); padding:14px 16px; border-radius:10px; font-family:var(--sans);
  font-size:14.5px; cursor:pointer; transition:background .15s,border-color .15s;
  line-height:1.5;
}
.opt-btn:hover:not(:disabled){ background:#282d45; border-color:var(--blue); }
.opt-btn:disabled{ cursor:default; }
.opt-btn.selected-correct{ background:var(--green-dim); border-color:var(--green); color:var(--green); }
.opt-btn.selected-wrong{ background:var(--red-dim); border-color:var(--red); color:var(--red); }
.opt-btn.reveal-correct{ background:var(--green-dim); border-color:var(--green); color:var(--green); }

.fb{
  margin-top:18px; border-radius:12px; padding:18px; border:1px solid var(--border);
  background:var(--surface2);
}
.fb.correct{ border-color:var(--green); background:var(--green-dim); }
.fb.wrong{ border-color:var(--red); background:var(--red-dim); }
.fb-head{ display:flex; align-items:center; gap:10px; font-weight:600; font-size:16px; margin-bottom:10px; }
.fb-head.correct-text{ color:var(--green); }
.fb-head.wrong-text{ color:var(--red); }
.fb-text{ font-size:14.5px; line-height:1.6; color:var(--text); margin-bottom:14px; }
.breakdown{ display:flex; flex-direction:column; gap:8px; }
.breakdown-row{ display:flex; gap:10px; font-size:14px; color:var(--text2); align-items:flex-start; }
.breakdown-row span.icon{ flex-shrink:0; }

.next-btn, .replay-btn{
  margin-top:18px; background:var(--blue); color:#08101f; border:none; border-radius:10px;
  padding:12px 22px; font-family:var(--sans); font-weight:600; font-size:15px; cursor:pointer;
}
.next-btn:hover, .replay-btn:hover{ background:#6ba0fb; }

.final-screen{ text-align:center; padding:40px 16px; }
.final-score{ font-family:var(--mono); font-size:56px; font-weight:600; color:var(--green); margin:10px 0; }
.final-label{ color:var(--text2); font-size:14px; margin-bottom:24px; }
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin:24px 0; }
.stat-box{ background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:16px; }
.stat-box .num{ font-family:var(--mono); font-size:24px; font-weight:600; color:var(--text); }
.stat-box .lbl{ font-size:12px; color:var(--text2); margin-top:4px; }

.landlord-tag{ font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:6px; margin-left:6px; }
.tag-aws{ background:var(--aws-dim); border:1px solid var(--aws-border); color:var(--aws); }
.tag-azure{ background:var(--azure-dim); border:1px solid var(--azure-border); color:var(--azure); }
.tag-gcp{ background:var(--gcp-dim); border:1px solid var(--gcp-border); color:var(--gcp); }

@media (max-width:480px){
  .brand h1{ font-size:13px; }
  .round-card h2{ font-size:19px; }
  .final-score{ font-size:44px; }
}
</style>
</head>

</header>

<div class="progress-wrap">
  <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Quiz progress"></div>
</div>

<main id="main-content">
  <div id="game-area"></div>
</main>

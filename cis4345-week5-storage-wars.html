<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS 4345 — Storage Wars 📦 Pick Your Cloud Storage Wisely</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3350;
    --blue:#4f8ef7; --blue-dim:#1e2d4f;
    --green:#3ecf8e; --green-dim:#0d2e1f;
    --red:#f87171; --red-dim:#2e1010;
    --yellow:#fbbf24; --yellow-dim:#2e2208;
    --aws:#FF9900; --aws-dim:#2e1c00; --aws-border:#6b3f00;
    --azure:#0078D4; --azure-dim:#001e3c; --azure-border:#004080;
    --gcp:#34A853; --gcp-dim:#0a2410; --gcp-border:#1a5c2a;
    --text:#e8eaf6; --text2:#8b92b8; --text3:#4a5080;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    min-width:380px; -webkit-text-size-adjust:100%;
  }
  .skip-link{
    position:absolute; left:-9999px; top:0; background:var(--blue); color:#0f1117;
    padding:10px 16px; z-index:1000; font-weight:600; border-radius:0 0 8px 0;
  }
  .skip-link:focus{ left:0; }

  button:focus-visible, a:focus-visible{
    outline:3px solid var(--blue); outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important;
      transition-duration:0.01ms !important;
    }
  }

  main{ max-width:840px; margin:0 auto; padding:16px 16px 60px; }

  header.topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 0; flex-wrap:wrap; border-bottom:1px solid var(--border);
    margin-bottom:20px;
  }
  .logo-row{ display:flex; align-items:center; gap:10px; }
  .dots{ display:flex; gap:4px; }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.aws{ background:var(--aws); }
  .dot.azure{ background:var(--azure); }
  .dot.gcp{ background:var(--gcp); }
  h1{ font-size:1.15rem; margin:0; font-family:var(--mono); font-weight:600; letter-spacing:0.3px; }
  .pills{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{
    background:var(--surface); border:1px solid var(--border); border-radius:20px;
    padding:6px 12px; font-family:var(--mono); font-size:0.8rem; color:var(--text2);
    display:flex; align-items:center; gap:6px;
  }
  .pill strong{ color:var(--text); font-weight:600; }

  .progress-wrap{
    width:100%; height:3px; background:var(--surface2); border-radius:3px; margin-bottom:26px; overflow:hidden;
  }
  .progress-bar{
    height:100%; background:linear-gradient(90deg,var(--aws),var(--azure),var(--gcp));
    width:0%; transition:width 0.4s ease;
  }

  .round-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:22px; margin-bottom:20px;
  }
  .round-label{
    font-family:var(--mono); font-size:0.78rem; color:var(--text2); text-transform:uppercase;
    letter-spacing:1px; margin-bottom:8px;
  }
  h2.round-title{ font-size:1.3rem; margin:0 0 12px; color:var(--text); font-weight:600; }
  .round-body{ color:var(--text2); line-height:1.6; margin-bottom:14px; font-size:0.98rem; }

  .badge{
    display:inline-flex; align-items:center; gap:8px; background:var(--surface2);
    border:1px solid var(--border); border-radius:10px; padding:8px 14px; margin-bottom:18px;
  }
  .badge .emoji{ font-size:1.2rem; }
  .badge-text{ display:flex; flex-direction:column; }
  .badge-title{ font-family:var(--mono); font-weight:600; font-size:0.85rem; color:var(--text); }
  .badge-sub{ font-size:0.75rem; color:var(--text3); }

  .question{ font-weight:600; margin:16px 0 14px; font-size:1rem; color:var(--text); }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt-btn{
    display:block; width:100%; text-align:left; background:var(--surface2);
    border:1px solid var(--border); color:var(--text); border-radius:10px;
    padding:14px 16px; font-family:var(--sans); font-size:0.95rem; cursor:pointer;
    transition:background 0.15s,border-color 0.15s,transform 0.1s;
    line-height:1.4;
  }
  .opt-btn:hover:not(:disabled){ background:var(--blue-dim); border-color:var(--blue); }
  .opt-btn:active:not(:disabled){ transform:scale(0.99); }
  .opt-btn:disabled{ cursor:default; }
  .opt-btn.correct-answer{ background:var(--green-dim); border-color:var(--green); }
  .opt-btn.wrong-answer{ background:var(--red-dim); border-color:var(--red); }
  .opt-btn .tag{ font-family:var(--mono); font-weight:600; margin-right:6px; }

  .fb{
    margin-top:18px; padding:18px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface2);
  }
  .fb.correct{ border-color:var(--green); background:var(--green-dim); }
  .fb.wrong{ border-color:var(--red); background:var(--red-dim); }
  .fb-head{ display:flex; align-items:center; gap:10px; font-weight:600; font-size:1.05rem; margin-bottom:10px; }
  .fb-head.correct-text{ color:var(--green); }
  .fb-head.wrong-text{ color:var(--red); }
  .fb-body{ color:var(--text); line-height:1.55; margin-bottom:14px; font-size:0.94rem; }
  .breakdown{ display:flex; flex-direction:column; gap:8px; }
  .brow{ display:flex; gap:10px; align-items:flex-start; font-size:0.9rem; color:var(--text2); }
  .brow .icon{ flex-shrink:0; }

  .streak-flash{
    display:inline-block; margin-left:8px; color:var(--yellow); font-family:var(--mono);
    font-weight:600; animation:flashPulse 0.6s ease-in-out;
  }
  @keyframes flashPulse{
    0%{ transform:scale(0.8); opacity:0; }
    50%{ transform:scale(1.15); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }

  .next-btn{
    margin-top:18px; background:var(--blue); color:#0b0d13; border:none; border-radius:10px;
    padding:13px 22px; font-family:var(--mono); font-weight:600; font-size:0.95rem;
    cursor:pointer; width:100%;
  }
  .next-btn:hover{ background:#6ba1ff; }

  .final-screen{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:34px 24px; text-align:center;
  }
  .final-score{
    font-family:var(--mono); font-size:3rem; font-weight:600; color:var(--yellow); margin:10px 0;
  }
  .final-label{ color:var(--text2); font-size:0.9rem; text-transform:uppercase; letter-spacing:1px; }
  .stat-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:24px 0;
  }
  .stat-box{
    background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:16px;
  }
  .stat-box .num{ font-family:var(--mono); font-size:1.5rem; font-weight:600; color:var(--text); }
  .stat-box .lbl{ font-size:0.78rem; color:var(--text2); margin-top:4px; }
  .replay-btn{
    background:var(--green); color:#0b0d13; border:none; border-radius:10px; padding:14px 26px;
    font-family:var(--mono); font-weight:600; font-size:1rem; cursor:pointer; margin-top:10px;
  }
  .replay-btn:hover{ background:#5cddaa; }

  .provider-tag{
    display:inline-block; font-family:var(--mono); font-size:0.72rem; font-weight:600;
    padding:3px 8px; border-radius:6px; margin-left:8px;
  }
  .provider-tag.aws{ background:var(--aws-dim); color:var(--aws); border:1px solid var(--aws-border); }
  .provider-tag.azure{ background:var(--azure-dim); color:var(--azure); border:1px solid var(--azure-border); }
  .provider-tag.gcp{ background:var(--gcp-dim); color:var(--gcp); border:1px solid var(--gcp-border); }

  @media (max-width:480px){
    h1{ font-size:1rem; }
    .final-score{ font-size:2.2rem; }
    .round-card{ padding:16px; }
  }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<main id="main-content">
  <header class="topbar">
    <div class="logo-row">
      <div class="dots" aria-hidden="true">
        <span class="dot aws"></span><span class="dot azure"></span><span class="dot gcp"></span>
      </div>
      <h1>CIS 4345 — Storage Wars <span role="img" aria-label="package box">📦</span></h1>
    </div>
    <div class="pills">
      <div class="pill">Round <strong id="round-el">1/6</strong></div>
      <div class="pill" aria-live="polite" aria-atomic="true" id="score-pill">Score <strong id="score-el">0</strong></div>
      <div class="pill" aria-live="polite" aria-atomic="true" id="streak-pill">Streak <strong id="streak-el">0</strong></div>
    </div>
  </header>

  <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Quiz progress"></div>
  </div>

  <div id="game-area"></div>
</main>

<script>
(function(){
  "use strict";

  const scenarios = [
    {
      id:1,
      label:"Scenario 1 — Object vs Block vs File Storage",
      title:"The New Hire's Storage Mix-Up",
      body:"You're onboarding a junior sysadmin who needs to host a company's static website images, run a high-performance SQL database, and share documents across a team's mapped network drive. She wants to use ONE storage type for all three to 'keep it simple.' Your job: explain why that won't work.",
      concept:"Object vs Block vs File Storage",
      conceptEmoji:"🗄️",
      conceptSub:"Choosing the right storage architecture for the workload",
      question:"Which pairing correctly matches workload to storage type?",
      options:[
        "A. Database → Object storage, Images → Block storage, Shared drive → File storage",
        "B. Database → Block storage, Images → Object storage, Shared drive → File storage",
        "C. Database → File storage, Images → Block storage, Shared drive → Object storage",
        "D. All three should use Object storage since it's cheapest"
      ],
      correct:1,
      feedback:{
        correct:"Databases need low-latency, high-IOPS Block storage (like AWS EBS or Azure Managed Disks) because they perform constant small read/writes. Static images are perfect for Object storage (S3/Blob) since they're accessed as whole files via HTTP, and shared drives need File storage (EFS/Azure Files) for hierarchical folder structures and simultaneous multi-user access.",
        wrong:"The correct match is: Database → Block storage, Images → Object storage, Shared drive → File storage. Block storage gives databases the raw disk performance they need. Object storage is ideal for static, immutable files accessed by URL. File storage supports the folder/directory structure and concurrent access that network drives require.",
        breakdown:[
          {icon:"✅", text:"Block storage = low-latency raw volumes for databases and OS disks."},
          {icon:"💡", text:"Object storage = flat key-value store, perfect for images, backups, static web content."},
          {icon:"⚠️", text:"Common mistake: using Object storage for a database — it lacks the random read/write performance databases require."}
        ]
      }
    },
    {
      id:2,
      label:"Scenario 2 — AWS S3 Buckets & Key Concepts",
      title:"The Public Bucket Incident",
      body:"A client's AWS S3 bucket named 'acme-customer-invoices' was found publicly accessible by a security researcher, exposing thousands of PDF invoices. Leadership asks you to explain how bucket permissions work and what should have prevented this before it hits the news.",
      concept:"AWS S3 Buckets & Key Concepts",
      conceptEmoji:"🪣",
      conceptSub:"Bucket policies, ACLs, and the Block Public Access setting",
      question:"What AWS feature, if properly configured, would have prevented this exposure by default?",
      options:[
        "A. Enabling S3 Transfer Acceleration",
        "B. Enabling S3 Versioning",
        "C. S3 Block Public Access setting at the account or bucket level",
        "D. Switching the bucket's storage class to Glacier"
      ],
      correct:2,
      feedback:{
        correct:"S3 Block Public Access is a safeguard that overrides any bucket policy or ACL attempting to grant public access — it should be enabled by default on all buckets unless there's a specific, reviewed business need (like hosting a public static website).",
        wrong:"The correct answer is S3 Block Public Access. This account/bucket-level setting acts as a guardrail that blocks public bucket policies and ACLs even if someone accidentally misconfigures them. Versioning protects against accidental deletion/overwrite, not public exposure. Transfer Acceleration speeds up uploads. Glacier is a storage class for archival, unrelated to access control.",
        breakdown:[
          {icon:"✅", text:"Block Public Access is a security guardrail — enable it by default, disable only with justification."},
          {icon:"💡", text:"S3 access is controlled by IAM policies, bucket policies, and ACLs — multiple layers can conflict."},
          {icon:"⚠️", text:"Common mistake: assuming a private bucket stays private forever — a single misapplied policy can expose it."}
        ]
      }
    },
    {
      id:3,
      label:"Scenario 3 — Azure Blob Storage Containers & Tiers",
      title:"The Cost Report Surprise",
      body:"Your company's finance team is shocked by a rising Azure bill. Digging in, you find a Blob container full of old customer support screenshots — accessed maybe twice a year — sitting in the Hot access tier since it was created two years ago. Nobody ever revisited the tier setting.",
      concept:"Azure Blob Storage Containers & Tiers",
      conceptEmoji:"🔷",
      conceptSub:"Hot, Cool, and Archive access tiers",
      question:"What should you recommend to reduce cost for this rarely-accessed data?",
      options:[
        "A. Delete the container entirely to save money",
        "B. Move the blobs to the Archive access tier since they're rarely accessed",
        "C. Move the blobs to Premium tier for faster future access",
        "D. Keep them in Hot tier but enable soft delete"
      ],
      correct:1,
      feedback:{
        correct:"The Archive tier offers the lowest storage cost for data accessed rarely (less than once a year), which fits this use case perfectly. Retrieval takes hours, but that's an acceptable tradeoff for infrequent, non-urgent access — and it dramatically cuts storage costs versus Hot tier.",
        wrong:"The correct move is Archive tier. Hot tier is optimized for frequently accessed data and costs the most per GB stored. Cool tier fits data accessed monthly. Archive tier is cheapest for data accessed less than once a year, exactly matching this scenario — twice-a-year access. Deleting risks losing needed records, and Premium tier is even more expensive, the opposite of what's needed.",
        breakdown:[
          {icon:"✅", text:"Hot = frequent access, highest storage cost, lowest access cost."},
          {icon:"💡", text:"Cool = infrequent (30+ days) access; Archive = rare (180+ days), lowest storage cost, slow rehydration."},
          {icon:"⚠️", text:"Common mistake: forgetting Archive retrieval isn't instant — plan ahead if data might be needed urgently."}
        ]
      }
    },
    {
      id:4,
      label:"Scenario 4 — GCP Cloud Storage Classes",
      title:"Backup Strategy for a Startup",
      body:"A startup asks you to design their GCP backup strategy. They need: (1) nightly database dumps accessed occasionally during the first month for restores, then almost never after, and (2) a long-term compliance archive they're required to keep for 7 years but will likely never touch.",
      concept:"GCP Cloud Storage Classes",
      conceptEmoji:"☁️",
      conceptSub:"Standard, Nearline, Coldline, and Archive classes",
      question:"Which GCP storage class combination best fits these two needs?",
      options:[
        "A. Standard for both — simplest to manage",
        "B. Nearline for the nightly dumps, Archive for the 7-year compliance data",
        "C. Coldline for the nightly dumps, Standard for the compliance data",
        "D. Archive for both since they're both backups"
      ],
      correct:1,
      feedback:{
        correct:"Nearline is designed for data accessed less than once a month — a good match for backups that might be restored occasionally in the first 30 days. Archive class is GCP's cheapest tier, built for data accessed less than once a year, perfect for the 7-year compliance requirement that's rarely, if ever, touched.",
        wrong:"The best fit is Nearline for the nightly dumps and Archive for the compliance data. Standard is for frequently accessed hot data and would waste money on both use cases here. Coldline (accessed roughly once a quarter) doesn't fit the 'occasional first month' pattern as well as Nearline, and using Archive for near-term restorable backups risks slow retrieval when you need them soon.",
        breakdown:[
          {icon:"✅", text:"Nearline = access < once/month; Coldline = access < once/quarter; Archive = access < once/year."},
          {icon:"💡", text:"All GCP classes share the same low-latency, high-durability API — only price and minimum storage duration differ."},
          {icon:"⚠️", text:"Common mistake: picking Archive for data you might need again soon — early deletion/retrieval fees apply."}
        ]
      }
    },
    {
      id:5,
      label:"Scenario 5 — Lifecycle Policies, Durability & Replication",
      title:"Automating the Cleanup Nobody Has Time For",
      body:"Your team manually deletes old log files every quarter — a task everyone forgets until storage costs spike. Meanwhile, a stakeholder asks: 'If a data center burns down, do we lose our S3 data?' You need to answer both the automation question and the durability question in the same meeting.",
      concept:"Storage Lifecycle Policies, Durability & Replication",
      conceptEmoji:"♻️",
      conceptSub:"Automated tiering/expiration and 11 nines durability via replication",
      question:"What combination of features addresses both concerns?",
      options:[
        "A. A cron job to manually delete files, plus hoping the data center has good insurance",
        "B. A lifecycle policy to auto-transition/expire old logs, plus S3's built-in multi-AZ replication for durability",
        "C. Increasing the EC2 instance size to handle more log storage locally",
        "D. Switching to Block storage since it's inherently more durable than Object storage"
      ],
      correct:1,
      feedback:{
        correct:"A Lifecycle Policy automates transitioning objects to cheaper tiers (or deleting them) after a defined number of days, removing the manual quarterly cleanup entirely. S3's 99.999999999% (11 nines) durability comes from automatically replicating data across multiple Availability Zones within a region — so a single data center failure doesn't mean data loss.",
        wrong:"The correct combination is a Lifecycle Policy for automation and S3's built-in multi-AZ replication for durability. Manual cron jobs are exactly the error-prone process causing the problem today. Larger EC2 instances don't affect S3 durability. Block storage isn't in

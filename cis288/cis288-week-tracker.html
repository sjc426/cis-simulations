<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS 288 Week Tracker</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Arial,Helvetica,sans-serif; background:transparent; padding:0; overflow:hidden; }

/* Current week card */
.cur-card { border:2px solid #9333ea; border-radius:14px; margin-bottom:12px; overflow:hidden; box-shadow:0 0 0 4px rgba(147,51,234,0.08); }
.cur-header { background:#1e1040; padding:11px 18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.week-badge { font-size:11px; background:#9333ea; color:#fff; padding:3px 10px; border-radius:20px; white-space:nowrap; }
.week-title { font-size:13px; color:#fff; font-weight:600; flex:1; }
.live-dot { width:7px; height:7px; border-radius:50%; background:#4ade80; display:inline-block; }
.live-label { font-size:11px; color:#4ade80; white-space:nowrap; }
.btn-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:12px 14px; background:#faf5ff; }
.btn { display:flex; align-items:center; justify-content:center; gap:6px; padding:10px 8px; border-radius:10px; text-decoration:none; font-size:12px; border:1.5px solid #9333ea; background:#fff; color:#581c87; }
.btn.primary { background:#9333ea; color:#fff; border-color:#9333ea; }

/* Next week locked */
.nxt-card { border:1.5px solid #d8b4fe; border-radius:14px; overflow:hidden; opacity:0.88; }
.nxt-header { background:#2d1f5e; padding:11px 18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.nxt-badge { font-size:11px; background:#6d28d9; color:#fff; padding:3px 10px; border-radius:20px; white-space:nowrap; }
.nxt-title { font-size:13px; color:#e9d5ff; flex:1; }
.nxt-date { font-size:11px; color:#a78bfa; white-space:nowrap; }
.nxt-lock { background:#1a0f3a; height:60px; display:flex; align-items:center; justify-content:center; gap:10px; }
.nxt-lock span { font-size:12px; color:#a78bfa; }
</style>
</head>
<body>
<div id="tracker"></div>
<script>

// ============================================================
//  SEMESTER CONFIG — CHANGE ONLY THESE LINES EACH SEMESTER
// ============================================================
var SEMESTER_START = "2026-05-11";
var TOTAL_WEEKS    = 14;
var COURSE_ID      = "2103716";
var COURSE_CODE    = "CIS 288";
// ============================================================

var TOPICS = [
  "",
  "Cloud Foundations",
  "Identity & Access: Who Gets In",
  "Compute — Virtual Machines Across All Three",
  "Storage — Objects, Blobs & Buckets",
  "Networking — VPC, VNet & GCP VPC",
  "Serverless — Lambda, Functions & Cloud Fns",
  "Databases — RDS, Azure SQL & Cloud SQL",
  "Midterm — Cloud Foundations Review",
  "Azure Deep Dive",
  "GCP Deep Dive",
  "Containers & Kubernetes",
  "Security & Compliance",
  "Cost & Architecture",
  "Final Project — Multi-Cloud Design"
];

var ICONS = ["","☁️","🔐","🖥️","🗄️","🌐","⚡","🗃️","📝","☁️","🔵","📦","🔒","💰","🏆"];

var SLUGS = [
  "",
  "week-1-overview",
  "week-2-overview-identity-and-access-who-gets-in",
  "week-3-overview-and-checklist",
  "week-4-overview",
  "week-5-overview",
  "week-6-overview",
  "week-7-overview",
  "week-8-overview",
  "week-9-overview",
  "week-10-overview",
  "week-11-overview",
  "week-12-overview",
  "week-13-overview",
  "week-14-overview"
];

var READ_SLUGS = [
  "",
  "week-1-reading-and-resources",
  "week-2-reading-and-resources",
  "week-3-reading-and-resources-~30-min",
  "week-4-reading-and-resources",
  "week-5-reading-and-resources",
  "week-6-reading-and-resources",
  "week-7-reading-and-resources",
  "week-8-reading-and-resources",
  "week-9-reading-and-resources",
  "week-10-reading-and-resources",
  "week-11-reading-and-resources",
  "week-12-reading-and-resources",
  "week-13-reading-and-resources",
  "week-14-reading-and-resources"
];

var DAYS   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function weekStart(w) {
  var p = SEMESTER_START.split("-");
  var s = new Date(+p[0], +p[1]-1, +p[2]);
  return new Date(s.getTime() + (w-1)*7*24*60*60*1000);
}

function weekEnd(w) {
  return new Date(weekStart(w).getTime() + 6*24*60*60*1000);
}

function fmt(d) {
  return DAYS[d.getDay()] + " " + MONTHS[d.getMonth()] + " " + d.getDate();
}

function fmtShort(d) {
  return MONTHS[d.getMonth()] + " " + d.getDate();
}

function getCurrentWeek() {
  var p = SEMESTER_START.split("-");
  var s = new Date(+p[0], +p[1]-1, +p[2]);
  var diff = Math.floor((new Date() - s) / (7*24*60*60*1000));
  return Math.max(1, Math.min(TOTAL_WEEKS, diff + 1));
}

function baseURL() {
  return "https://ccp.instructure.com/courses/" + COURSE_ID;
}

function render() {
  var cur  = getCurrentWeek();
  var next = Math.min(cur + 1, TOTAL_WEEKS);
  var due  = fmtShort(weekEnd(cur));
  var unlockFull = fmt(weekStart(next));
  var unlockShort = fmtShort(weekStart(next));
  var base = baseURL();
  var html = "";

  // Section label
  html += '<p style="font-size:11px;color:#9333ea;margin:0 0 8px;text-transform:uppercase;letter-spacing:0.06em;font-family:Arial,sans-serif;">📅 Where We Are Right Now</p>';

  // Current week card
  html += '<div class="cur-card" role="region" aria-label="Current week ' + cur + '">';
  html += '<div class="cur-header">';
  html += '<span class="week-badge">Week ' + cur + '</span>';
  html += '<span class="week-title">' + ICONS[cur] + ' ' + TOPICS[cur] + '</span>';
  html += '<span class="live-dot" aria-hidden="true"></span>';
  html += '<span class="live-label">Live now &middot; Due ' + due + '</span>';
  html += '</div>';
  html += '<div class="btn-row">';
  html += '<a class="btn" target="_top" href="' + base + '/pages/' + READ_SLUGS[cur] + '" data-api-endpoint="https://ccp.instructure.com/api/v1/courses/' + COURSE_ID + '/pages/' + READ_SLUGS[cur] + '" data-api-returntype="Page">📺 Watch &amp; Read</a>';
  html += '<a class="btn" target="_top" href="' + base + '/pages/' + SLUGS[cur] + '" data-api-endpoint="https://ccp.instructure.com/api/v1/courses/' + COURSE_ID + '/pages/' + SLUGS[cur] + '" data-api-returntype="Page">📋 Week Overview</a>';
  var LAB_URLS = {
    1:  'https://ccp.instructure.com/courses/2103716/assignments/19951347?module_item_id=45549771',
    2:  'https://ccp.instructure.com/courses/2103716/assignments/19951397?module_item_id=45549877',
    3:  'https://ccp.instructure.com/courses/2103716/assignments/19976331?module_item_id=45623147',
    4:  'https://ccp.instructure.com/courses/2103716/assignments/20023319?module_item_id=45737649'
  };
  var labURL = LAB_URLS[cur] || (base + '/assignments');
  html += '<a class="btn primary" target="_top" href="' + labURL + '">🔬 Lab ' + cur + '</a>'
  html += '</div></div>';

  // Next week locked
  if (next > cur) {
    html += '<div class="nxt-card" role="region" aria-label="Upcoming week ' + next + ' locked">';
    html += '<div class="nxt-header">';
    html += '<span class="nxt-badge">Week ' + next + '</span>';
    html += '<span class="nxt-title">' + ICONS[next] + ' ' + TOPICS[next] + '</span>';
    html += '<span class="nxt-date">Opens ' + unlockShort + '</span>';
    html += '</div>';
    html += '<div class="nxt-lock">';
    html += '<span aria-hidden="true" style="font-size:20px;">🔒</span>';
    html += '<span>Unlocks ' + unlockFull + ' &mdash; finish Week ' + cur + ' first</span>';
    html += '</div></div>';
  }

  document.getElementById("tracker").innerHTML = html;

  // Auto-resize iframe height to fit content
  var h = document.getElementById("tracker").scrollHeight + 20;
  if (window.parent !== window) {
    window.parent.postMessage({ iframeHeight: h }, "*");
  }
}

render();
</script>
</body>
</html>

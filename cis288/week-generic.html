<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS 288 Week Animation</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#060412; overflow:hidden; font-family:"Segoe UI",Arial,sans-serif; }
canvas { display:block; }
#ada-pause { position:absolute; bottom:12px; right:12px; z-index:999; background:rgba(0,0,0,0.55); border:1.5px solid rgba(255,255,255,0.3); color:#fff; font-size:13px; padding:6px 14px; border-radius:20px; cursor:pointer; font-family:"Segoe UI",Arial,sans-serif; backdrop-filter:blur(4px); transition:background 0.2s; }
#ada-pause:hover { background:rgba(255,255,255,0.18); }
#ada-pause:focus { outline:2px solid #fff; outline-offset:3px; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Animated educational illustration for this week. Use Pause button to stop animation."></canvas>
<script>
var TOPICS=["","Cloud Foundations & Overview","IAM — Identity & Access Management","Compute: EC2, Azure VM & GCE","Storage: S3, Blob & Cloud Storage","Networking: VPC, VNet & GCP VPC","Serverless: Lambda, Functions & Cloud Run","Databases: RDS, Azure SQL & Cloud SQL","Midterm — Cloud Foundations Review","Azure Deep Dive","GCP Deep Dive","Containers: Docker, AKS & GKE","Cloud Security & Compliance","Cost Analysis & Architecture Decisions","Final Project — Multi-Cloud Design"];
var SUBTITLES=["","Cloud models \u00b7 IaaS \u00b7 PaaS \u00b7 SaaS \u00b7 Shared responsibility","Roles \u00b7 Policies \u00b7 Least privilege \u00b7 MFA \u00b7 Entra ID","Instances \u00b7 VM sizes \u00b7 SSH \u00b7 Auto-scaling \u00b7 Load balancing","Object storage \u00b7 Buckets \u00b7 Lifecycle \u00b7 Versioning \u00b7 CDN","Subnets \u00b7 Routing \u00b7 Firewalls \u00b7 NSGs \u00b7 VPN \u00b7 Peering","Event-driven \u00b7 Triggers \u00b7 Cold start \u00b7 Pay-per-execution","Managed DBs \u00b7 Backups \u00b7 Read replicas \u00b7 HA \u00b7 Migrations","Cumulative review \u00b7 Lab practical \u00b7 Exam prep","Azure VMs \u00b7 Blob \u00b7 VNet \u00b7 Entra \u00b7 Functions \u00b7 AKS","GCE \u00b7 Cloud Storage \u00b7 VPC \u00b7 Cloud IAM \u00b7 GKE \u00b7 BigQuery","Docker \u00b7 Kubernetes \u00b7 AKS \u00b7 GKE \u00b7 EKS \u00b7 Orchestration","Zero trust \u00b7 CSPM \u00b7 Defender \u00b7 Security Hub \u00b7 SCC","TCO \u00b7 Reserved instances \u00b7 Spot \u00b7 FinOps \u00b7 Tradeoffs","Multi-cloud design \u00b7 Architecture \u00b7 Portfolio \u00b7 Present"];
var ICONS=["","\u2601\ufe0f","\ud83d\udd11","\ud83d\udda5\ufe0f","\ud83d\uddc4\ufe0f","\ud83c\udf10","\u26a1","\ud83d\uddc3\ufe0f","\ud83d\udcdd","\ud83d\udd35","\ud83d\udfe2","\ud83d\udce6","\ud83d\udd12","\ud83d\udcb0","\ud83c\udfc6"];
var KEYWORDS=[[],["Cloud","IaaS","PaaS","SaaS","Public","Private","Hybrid","Region","AZ","Edge","Latency","CapEx","OpEx","Shared Responsibility"],["IAM","Role","Policy","MFA","SSO","RBAC","Least Privilege","Entra ID","AWS IAM","Cloud IAM","Principal","Trust","Permission","Group"],["EC2","Azure VM","GCE","vCPU","AMI","Instance","SSH","Auto Scale","Load Balancer","Spot","Reserved","On-Demand","Region","Availability Zone"],["S3","Blob","Cloud Storage","Bucket","Object","Lifecycle","Versioning","CDN","Glacier","Archive","Static Site","Cross-Region","Replication"],["VPC","VNet","Subnet","CIDR","Route","NAT","IGW","NSG","Firewall","VPN","Peering","Transit","DNS","Private Link"],["Lambda","Azure Functions","Cloud Run","Trigger","Event","Cold Start","Warm","API Gateway","Serverless","Pay-per-exec","Timeout","Concurrency"],["RDS","Azure SQL","Cloud SQL","MySQL","PostgreSQL","Aurora","Replica","Backup","HA","Failover","Migration","ORM","Managed","NoSQL"],["Review","Midterm","Exam","IAM","Compute","Storage","Network","Serverless","Database","AWS","Azure","GCP","Lab","Practical"],["Azure","VNet","Blob","Entra","Functions","AKS","ARM","Bicep","Portal","CLI","Policy","Defender","Monitor","Cost Management"],["GCP","GCE","Cloud Storage","BigQuery","GKE","Pub/Sub","Cloud Run","IAM","VPC","Terraform","gcloud","Dataflow","Looker"],["Docker","Kubernetes","AKS","GKE","EKS","Pod","Node","Cluster","Helm","Registry","Image","Container","Orchestration","Service Mesh"],["Zero Trust","CSPM","WAF","DDoS","Defender","Security Hub","SCC","Compliance","HIPAA","SOC2","Encryption","KMS","Audit","SIEM"],["TCO","FinOps","Reserved","Spot","Savings Plan","Right-sizing","Waste","Budget","Cost Explorer","Advisor","Recommender","Tradeoff","ROI"],["Multi-Cloud","Architecture","Design","Portfolio","Diagram","Capstone","Presentation","Runbook","Final","Deploy","Compare","Justify"]];

var params=new URLSearchParams(window.location.search);
var WEEK=Math.max(1,Math.min(14,parseInt(params.get("week"))||1));
var TOPIC=TOPICS[WEEK]||"CIS 288";
var SUBTITLE=SUBTITLES[WEEK]||"Cloud Computing";
var ICON=ICONS[WEEK]||"\u2601\ufe0f";
var WORDS=KEYWORDS[WEEK]||KEYWORDS[1];

var canvas=document.getElementById("c");
var ctx=canvas.getContext("2d");
var W,H,frame=0;
var PURPLE="#9333ea",PURPLE2="#c084fc",TEAL="#0ea5e9",GREEN="#10b981",SLATE="#475569";

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener("resize",resize);

var particles=[];
for(var i=0;i<55;i++) particles.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.00014,vy:-Math.random()*.00018-.00002,r:Math.random()*1.3+.3,alpha:Math.random()*.18+.04,color:[PURPLE,PURPLE2,TEAL,GREEN,SLATE][Math.floor(Math.random()*5)]});

var floaters=[];
for(var j=0;j<WORDS.length;j++) floaters.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.00020,vy:(Math.random()-.5)*.00014,word:WORDS[j],alpha:Math.random()*.13+.04,size:Math.floor(Math.random()*4)+8});

// Cloud provider nodes — 3 clusters representing AWS, Azure, GCP
var PROVIDERS=[
  {label:"AWS",col:"#FF9900",x:.22,y:.52,nodes:[]},
  {label:"Azure",col:"#0078D4",x:.50,y:.52,nodes:[]},
  {label:"GCP",col:"#4285F4",x:.78,y:.52,nodes:[]}
];
var NODE_COLS=3,NODE_ROWS=2;
for(var p=0;p<PROVIDERS.length;p++){
  for(var nr=0;nr<NODE_ROWS;nr++){
    for(var nc=0;nc<NODE_COLS;nc++){
      PROVIDERS[p].nodes.push({gx:nc,gy:nr,pulse:Math.random()*Math.PI*2,pulseSpeed:.018+Math.random()*.012,born:90+p*18+nc*10+nr*14});
    }
  }
}

var packets=[],packetTimer=0;
function spawnPacket(){
  var fp=Math.floor(Math.random()*PROVIDERS.length);
  var tp=Math.floor(Math.random()*PROVIDERS.length);
  if(fp===tp)return;
  packets.push({fx:PROVIDERS[fp].x,fy:PROVIDERS[fp].y,tx:PROVIDERS[tp].x,ty:PROVIDERS[tp].y,t:0,dt:.014,col:PROVIDERS[tp].col});
}

function fadeIn(f,s,d){return Math.max(0,Math.min(1,(f-s)/d));}

function drawBG(){
  ctx.fillStyle="#060412";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(147,51,234,0.04)";ctx.lineWidth=1;
  for(var gx=0;gx<W;gx+=48){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
  for(var gy=0;gy<H;gy+=48){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}
  var g=ctx.createLinearGradient(0,H*.65,0,H);
  g.addColorStop(0,"rgba(147,51,234,0)");g.addColorStop(1,"rgba(147,51,234,0.06)");
  ctx.fillStyle=g;ctx.fillRect(0,H*.65,W,H*.35);
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];p.x+=p.vx;p.y+=p.vy;
    if(p.y<-.01)p.y=1.01;if(p.x<0)p.x=1;if(p.x>1)p.x=0;
    ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color+Math.floor(p.alpha*255).toString(16).padStart(2,"0");ctx.fill();
  }
}

function drawFloaters(){
  for(var j=0;j<floaters.length;j++){
    var f=floaters[j];f.x+=f.vx;f.y+=f.vy;
    if(f.x<0)f.x=1;if(f.x>1)f.x=0;if(f.y<0)f.y=1;if(f.y>1)f.y=0;
    ctx.font=f.size+"px Segoe UI,Arial";
    ctx.fillStyle=PURPLE2+Math.floor(f.alpha*255).toString(16).padStart(2,"0");
    ctx.textAlign="center";ctx.fillText(f.word,f.x*W,f.y*H);
  }
}

function drawTitle(a){
  if(a<=0)return;ctx.save();ctx.globalAlpha=a;
  var bw=Math.min(W*.18,140),bh=Math.min(H*.055,34),bx=W/2-bw/2,by=H*.09;
  ctx.shadowColor=PURPLE;ctx.shadowBlur=18*a;
  var gr=ctx.createLinearGradient(bx,by,bx+bw,by);
  gr.addColorStop(0,PURPLE);gr.addColorStop(1,PURPLE2);
  function rr2(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);}else{ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}}
  rr2(bx,by,bw,bh,bh/2);ctx.fillStyle=gr;ctx.fill();
  ctx.font="bold "+Math.floor(bh*.55)+"px Segoe UI,Arial";ctx.fillStyle="#fff";ctx.textAlign="center";ctx.shadowBlur=0;
  ctx.fillText("WEEK "+WEEK,W/2,by+bh*.72);
  ctx.font=Math.floor(H*.075)+"px Arial";ctx.shadowColor=PURPLE2;ctx.shadowBlur=22*a;ctx.fillText(ICON,W/2,H*.22);
  var ts=Math.min(Math.floor(H*.068),Math.floor(W/(TOPIC.length*.52)));ts=Math.max(ts,14);
  ctx.font="bold "+ts+"px Segoe UI,Arial";ctx.fillStyle="#fff";ctx.shadowBlur=24*a;ctx.fillText(TOPIC,W/2,H*.33);
  ctx.font=Math.floor(H*.036)+"px Segoe UI,Arial";ctx.fillStyle=PURPLE2;ctx.shadowBlur=10*a;ctx.fillText(SUBTITLE,W/2,H*.393);
  ctx.font=Math.floor(H*.025)+"px Segoe UI,Arial";ctx.fillStyle="rgba(192,132,252,0.45)";ctx.shadowBlur=0;
  ctx.fillText("CIS 288  \u00b7  Prof. Chang  \u00b7  Community College of Philadelphia",W/2,H*.443);
  ctx.restore();
}

function drawProviders(a){
  if(a<=0)return;ctx.save();ctx.globalAlpha=a;
  // draw inter-provider connection lines
  for(var i=0;i<PROVIDERS.length;i++){
    for(var j=i+1;j<PROVIDERS.length;j++){
      var px1=PROVIDERS[i].x*W,py1=PROVIDERS[i].y*H;
      var px2=PROVIDERS[j].x*W,py2=PROVIDERS[j].y*H;
      var lg=ctx.createLinearGradient(px1,py1,px2,py2);
      lg.addColorStop(0,PROVIDERS[i].col+"33");lg.addColorStop(1,PROVIDERS[j].col+"33");
      ctx.beginPath();ctx.moveTo(px1,py1);ctx.lineTo(px2,py2);
      ctx.strokeStyle=lg;ctx.lineWidth=1.2;ctx.setLineDash([6,10]);ctx.stroke();ctx.setLineDash([]);
    }
  }
  // draw each provider cluster
  for(var p=0;p<PROVIDERS.length;p++){
    var pv=PROVIDERS[p];
    var cx=pv.x*W,cy=pv.y*H;
    var spacingX=W*.08,spacingY=H*.1;
    // provider label
    ctx.shadowColor=pv.col;ctx.shadowBlur=20*a;
    ctx.font="bold "+Math.floor(H*.038)+"px Segoe UI,Arial";
    ctx.fillStyle=pv.col;ctx.textAlign="center";
    ctx.fillText(pv.label,cx,cy-H*.18);ctx.shadowBlur=0;
    // nodes in cluster
    for(var k=0;k<pv.nodes.length;k++){
      var n=pv.nodes[k];
      var na=fadeIn(frame,n.born,16);if(na<=0)continue;
      n.pulse+=n.pulseSpeed;
      var pf=.5+.5*Math.sin(n.pulse);
      var nx=cx+(n.gx-1)*spacingX,ny=cy+(n.gy-.5)*spacingY-H*.04;
      var rad=5+pf*2;
      ctx.shadowColor=pv.col;ctx.shadowBlur=12*pf*na;
      ctx.beginPath();ctx.arc(nx,ny,rad,0,Math.PI*2);
      ctx.fillStyle=pv.col+Math.floor(na*200).toString(16).padStart(2,"0");ctx.fill();
      ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(nx,ny,rad*.35,0,Math.PI*2);
      ctx.fillStyle="#fff";ctx.fill();
      // connect nodes within cluster
      for(var m=k+1;m<pv.nodes.length;m++){
        var n2=pv.nodes[m];
        var na2=fadeIn(frame,n2.born,16);if(na2<=0)continue;
        if(Math.abs(n.gx-n2.gx)+Math.abs(n.gy-n2.gy)!==1)continue;
        var nx2=cx+(n2.gx-1)*spacingX,ny2=cy+(n2.gy-.5)*spacingY-H*.04;
        ctx.beginPath();ctx.moveTo(nx,ny);ctx.lineTo(nx2,ny2);
        ctx.strokeStyle=pv.col+"44";ctx.lineWidth=1;ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function drawPackets(a){
  if(a<=0)return;
  for(var i=packets.length-1;i>=0;i--){
    var pk=packets[i];pk.t+=pk.dt;
    if(pk.t>1.2){packets.splice(i,1);continue;}
    var t=Math.min(pk.t,1);
    var px=pk.fx*W+(pk.tx-pk.fx)*W*t;
    var py=pk.fy*H+(pk.ty-pk.fy)*H*t;
    var arc=Math.sin(t*Math.PI)*H*.12;
    py-=arc;
    ctx.save();ctx.globalAlpha=a*(1-pk.t*.5);
    ctx.shadowColor=pk.col;ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);
    ctx.fillStyle=pk.col;ctx.fill();
    var tl=.1;
    var tx=px-(pk.tx-pk.fx)*W*tl,ty=py;
    var gr=ctx.createLinearGradient(tx,ty,px,py);
    gr.addColorStop(0,"transparent");gr.addColorStop(1,pk.col+"99");
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(px,py);
    ctx.strokeStyle=gr;ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
  }
}

function drawFooter(a){
  if(a<=0)return;ctx.save();ctx.globalAlpha=a;
  ctx.font=Math.floor(H*.03)+"px Segoe UI,Arial";
  ctx.fillStyle="rgba(147,51,234,0.55)";ctx.textAlign="center";
  ctx.fillText("AWS \u00b7 Azure \u00b7 GCP \u00b7 Three platforms, one course \u00b7 CIS 288",W/2,H*.96);
  ctx.restore();
}

function animate(){
  frame++;ctx.clearRect(0,0,W,H);
  drawBG();drawParticles();drawFloaters();
  drawTitle(fadeIn(frame,5,35));
  drawProviders(fadeIn(frame,80,30));
  drawPackets(fadeIn(frame,145,20));
  drawFooter(fadeIn(frame,165,30));
  packetTimer++;if(frame>145&&packetTimer%38===0)spawnPacket();
  requestAnimationFrame(animate);
}

var _paused=false,_orig=animate;
animate=function(){if(!_paused)_orig();};
if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)_paused=true;
var _btn=document.createElement("button");_btn.id="ada-pause";
_btn.setAttribute("aria-label","Pause animation");_btn.setAttribute("aria-pressed","false");
_btn.innerHTML="&#9646;&#9646; Pause";document.body.appendChild(_btn);
_btn.addEventListener("click",function(){
  _paused=!_paused;
  if(_paused){_btn.innerHTML="&#9654; Resume";_btn.setAttribute("aria-label","Resume animation");_btn.setAttribute("aria-pressed","true");}
  else{_btn.innerHTML="&#9646;&#9646; Pause";_btn.setAttribute("aria-label","Pause animation");_btn.setAttribute("aria-pressed","false");_orig();}
});
animate();
</script>
</body>
</html>

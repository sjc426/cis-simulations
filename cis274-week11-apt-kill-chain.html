<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS 274 — APT Kill Chain 🎯 Master Advanced Persistent Threats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3350;
  --blue:#4f8ef7; --blue-dim:#1e2d4f;
  --green:#3ecf8e; --green-dim:#0d2e1f;
  --red:#f87171; --red-dim:#2e1010;
  --yellow:#fbbf24; --yellow-dim:#2e2208;
  --aws:#FF9900; --aws-dim:#2e1c00; --aws-border:#6b3f00;
  --azure:#0078D4; --azure-dim:#001e3c; --azure-border:#004080;
  --gcp:#34A853; --gcp-dim:#0a2410; --gcp-border:#1a5c2a;
  --text:#e8eaf6; --text2:#8b92b8; --text3:#4a5080;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  line-height:1.6;
  min-height:100vh;
  padding:0;
}

.skip-link {
  position:absolute;
  top:-40px;
  left:0;
  background:var(--blue);
  color:#fff;
  padding:8px 16px;
  text-decoration:none;
  font-weight:600;
  z-index:100;
}
.skip-link:focus {
  top:0;
}

header {
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px;
}

.logo-title {
  display:flex;
  align-items:center;
  gap:12px;
}

.logo {
  display:flex;
  gap:6px;
}

.dot {
  width:12px;
  height:12px;
  border-radius:50%;
}
.dot-aws { background:var(--aws); }
.dot-azure { background:var(--azure); }
.dot-gcp { background:var(--gcp); }

h1 {
  font-size:1.5rem;
  font-weight:600;
  color:var(--text);
}

.header-stats {
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.pill {
  background:var(--surface2);
  border:1px solid var(--border);
  padding:6px 12px;
  border-radius:20px;
  font-family:var(--mono);
  font-size:0.875rem;
  display:flex;
  align-items:center;
  gap:6px;
}

.pill-label {
  color:var(--text2);
}

.pill-value {
  color:var(--text);
  font-weight:600;
}

.progress-bar-container {
  height:3px;
  background:var(--surface2);
  width:100%;
}

.progress-bar {
  height:100%;
  background:linear-gradient(90deg, var(--blue), var(--green));
  width:0%;
  transition:width 0.3s ease;
}

main {
  max-width:900px;
  margin:0 auto;
  padding:32px 20px;
}

.round-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:32px;
  margin-bottom:24px;
}

.scenario-label {
  color:var(--text2);
  font-size:0.875rem;
  font-family:var(--mono);
  margin-bottom:12px;
  text-transform:uppercase;
  letter-spacing:0.05em;
}

.scenario-title {
  font-size:1.75rem;
  font-weight:600;
  margin-bottom:16px;
  color:var(--text);
}

.scenario-body {
  color:var(--text2);
  margin-bottom:24px;
  font-size:1.05rem;
  line-height:1.7;
}

.concept-badge {
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--surface2);
  border:1px solid var(--border);
  padding:8px 16px;
  border-radius:8px;
  margin-bottom:24px;
  font-size:0.95rem;
}

.concept-emoji {
  font-size:1.25rem;
}

.concept-text {
  display:flex;
  flex-direction:column;
  gap:2px;
}

.concept-main {
  font-weight:600;
  color:var(--text);
}

.concept-sub {
  font-size:0.8rem;
  color:var(--text3);
}

.question {
  font-size:1.125rem;
  font-weight:600;
  margin-bottom:20px;
  color:var(--text);
}

.options {
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:24px;
}

.option-btn {
  background:var(--surface2);
  border:2px solid var(--border);
  color:var(--text);
  padding:16px 20px;
  border-radius:8px;
  font-family:var(--sans);
  font-size:1rem;
  text-align:left;
  cursor:pointer;
  transition:all 0.2s ease;
  width:100%;
}

.option-btn:hover:not(:disabled) {
  background:var(--surface);
  border-color:var(--blue);
  transform:translateX(4px);
}

.option-btn:focus-visible {
  outline:3px solid var(--blue);
  outline-offset:2px;
}

.option-btn:disabled {
  cursor:not-allowed;
  opacity:0.6;
}

.option-btn[aria-pressed="true"] {
  border-color:var(--blue);
  background:var(--blue-dim);
}

.option-btn.correct {
  border-color:var(--green);
  background:var(--green-dim);
}

.option-btn.incorrect {
  border-color:var(--red);
  background:var(--red-dim);
}

.fb {
  background:var(--surface2);
  border-left:4px solid var(--blue);
  padding:20px;
  border-radius:8px;
  margin-top:24px;
  display:none;
}

.fb.show {
  display:block;
}

.fb.success {
  border-left-color:var(--green);
}

.fb.error {
  border-left-color:var(--red);
}

.fb-header {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}

.fb-icon {
  font-size:1.5rem;
}

.fb-title {
  font-size:1.125rem;
  font-weight:600;
}

.fb-text {
  color:var(--text2);
  margin-bottom:16px;
  line-height:1.7;
}

.fb-breakdown {
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid var(--border);
}

.fb-row {
  display:flex;
  align-items:flex-start;
  gap:10px;
  font-size:0.95rem;
}

.fb-row-icon {
  flex-shrink:0;
  font-size:1.1rem;
}

.fb-row-text {
  color:var(--text2);
  line-height:1.5;
}

.next-btn {
  background:var(--blue);
  color:#fff;
  border:none;
  padding:12px 32px;
  border-radius:8px;
  font-family:var(--sans);
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
  transition:all 0.2s ease;
  margin-top:20px;
  display:none;
}

.next-btn.show {
  display:inline-block;
}

.next-btn:hover {
  background:var(--blue);
  filter:brightness(1.2);
  transform:translateY(-2px);
}

.next-btn:focus-visible {
  outline:3px solid var(--blue);
  outline-offset:2px;
}

.final-screen {
  text-align:center;
  display:none;
}

.final-screen.show {
  display:block;
}

.final-score {
  font-size:4rem;
  font-weight:600;
  color:var(--green);
  margin:32px 0;
  font-family:var(--mono);
}

.final-title {
  font-size:2rem;
  margin-bottom:16px;
  color:var(--text);
}

.final-subtitle {
  font-size:1.125rem;
  color:var(--text2);
  margin-bottom:32px;
}

.stat-boxes {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
  gap:16px;
  margin:32px 0;
}

.stat-box {
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:20px;
}

.stat-label {
  color:var(--text3);
  font-size:0.875rem;
  margin-bottom:8px;
  text-transform:uppercase;
  letter-spacing:0.05em;
}

.stat-value {
  font-size:2rem;
  font-weight:600;
  font-family:var(--mono);
  color:var(--text);
}

.replay-btn {
  background:var(--blue);
  color:#fff;
  border:none;
  padding:16px 48px;
  border-radius:8px;
  font-family:var(--sans);
  font-size:1.125rem;
  font-weight:600;
  cursor:pointer;
  transition:all 0.2s ease;
  margin-top:24px;
}

.replay-btn:hover {
  filter:brightness(1.2);
  transform:translateY(-2px);
}

.replay-btn:focus-visible {
  outline:3px solid var(--blue);
  outline-offset:2px;
}

.streak-flash {
  animation:streakPulse 0.6s ease;
}

@keyframes streakPulse {
  0%, 100% { transform:scale(1); }
  50% { transform:scale(1.15); color:var(--yellow); }
}

button:focus-visible {
  outline:3px solid var(--blue);
  outline-offset:2px;
}

a:focus-visible {
  outline:3px solid var(--blue);
  outline-offset:2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration:0.01ms !important;
    transition-duration:0.01ms !important;
  }
}

@media (max-width: 640px) {
  h1 { font-size:1.25rem; }
  .scenario-title { font-size:1.5rem; }
  .final-score { font-size:3rem; }
  header { padding:12px 16px; }
  main { padding:20px 16px; }
  .round-card { padding:20px; }
}
</style>
</head>
<body>

<header>
  <div class="logo-title">
    <div class="logo">
      <div class="dot dot-aws"></div>
      <div class="dot dot-azure"></div>
      <div class="dot dot-gcp"></div>
    </div>
    <h1>APT Kill Chain 🎯 Master Advanced Persistent Threats</h1>
  </div>
  <div class="header-stats">
    <div class="pill">
      <span class="pill-label">Score:</span>
      <span class="pill-value" id="score-display" aria-live="polite" aria-atomic="true">0</span>
    </div>
    <div class="pill">
      <span class="pill-label">Round:</span>
      <span class="pill-value" id="round-display" aria-live="polite" aria-atomic="true">1/7</span>
    </div>
    <div class="pill">
      <span class="pill-label">Streak:</span>
      <span class="pill-value" id="streak-display" aria-live="polite" aria-atomic="true">0</span>
    </div>
  </div>
</header>

<div class="progress-bar-container">
  <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Quiz progress"></div>
</div>

<main id="main-content">
  <div id="scenario-container"></div>
  <div id="final-screen" class="final-screen"></div>
</main>

<script>
const scenarios = [
  {
    id: 1,
    label: "Scenario 1 — Kill Chain Phase Recognition",
    title: "Identifying the Reconnaissance Phase",
    body: "Your security team detects unusual WHOIS queries, DNS enumeration, and LinkedIn profile scraping targeting your company over the past week. The attacker hasn't attempted any network scans or exploitation yet. Your manager asks you to identify which phase of the Cyber Kill Chain this activity represents.",
    concept: "Kill Chain Phase Identification",
    conceptEmoji: "🔍",
    conceptSub: "Lockheed Martin Framework",
    question: "Which Cyber Kill Chain phase is the attacker currently in?",
    options: [
      "A. Weaponization — they're building exploit payloads",
      "B. Reconnaissance — they're gathering information about targets",
      "C. Delivery — they're sending malicious attachments",
      "D. Installation — they're establishing persistence"
    ],
    correct: 1,
    feedback: {
      correct: "Correct! Reconnaissance is the first phase where attackers gather intelligence through passive techniques like WHOIS, DNS enumeration, OSINT, and social media research. No active scanning or exploitation occurs yet.",
      wrong: "The correct answer is B. This is classic reconnaissance activity — gathering publicly available information before moving to active scanning. Weaponization (building exploits), Delivery (sending payloads), and Installation (persistence) all come later in the kill chain.",
      breakdown: [
        {icon:"✅", text:"Reconnaissance = passive intel gathering (WHOIS, DNS, OSINT, LinkedIn)"},
        {icon:"💡", text:"Kill Chain phases: Recon → Weaponization → Delivery → Exploitation → Installation → C2 → Actions"},
        {icon:"⚠️", text:"Don't confuse reconnaissance with scanning — active Nmap scans are early Exploitation phase"}
      ]
    }
  },
  {
    id: 2,
    label: "Scenario 2 — APT vs Opportunistic Attacks",
    title: "Distinguishing Threat Actor Motivations",
    body: "You're analyzing two incidents. Incident A: automated WannaCry ransomware hit 50 random companies in one day. Incident B: targeted spear-phishing over 3 months, custom malware, patient lateral movement, data exfiltration from HR systems. Your incident response plan requires different procedures for APT vs opportunistic threats.",
    concept: "APT Pattern Recognition",
    conceptEmoji: "🎯",
    conceptSub: "Threat Actor Profiling",
    question: "Which incident is an Advanced Persistent Threat (APT)?",
    options: [
      "A. Incident A — automated mass ransomware deployment shows sophistication",
      "B. Incident B — targeted, stealthy, multi-phase attack with specific objectives",
      "C. Both are APTs — any successful breach qualifies as advanced",
      "D. Neither — APTs only target government agencies, not private companies"
    ],
    correct: 1,
    feedback: {
      correct: "Correct! Incident B exhibits APT characteristics: targeted selection, custom tools, patience (3 months), stealth, lateral movement, and specific data objectives. APTs are about precision and persistence, not speed or automation.",
      wrong: "The correct answer is B. APTs are defined by targeted selection, custom tools, stealth, patience, and specific objectives. WannaCry (Incident A) was opportunistic mass automation — fast, noisy, random targets. APTs hunt specific data over long periods and avoid detection.",
      breakdown: [
        {icon:"✅", text:"APT characteristics: targeted victims, custom malware, stealth, persistence (weeks/months), specific goals"},
        {icon:"💡", text:"Opportunistic attacks: automated, mass targets, fast exploitation, noisy, generic tools (WannaCry, Emotet)"},
        {icon:"⚠️", text:"APTs attack private companies too — nation-states target intellectual property and trade secrets"}
      ]
    }
  },
  {
    id: 3,
    label: "Scenario 3 — Attack Surface Mapping",
    title: "Identifying AWS Exposure Points",
    body: "You're hired to assess a startup's AWS attack surface. They run EC2 instances, S3 buckets for data storage, RDS databases, Lambda functions, and API Gateway endpoints. Their developers push code via GitHub Actions. You need to map all possible entry points an APT might target during the Reconnaissance and Weaponization phases.",
    concept: "Attack Surface Assessment",
    conceptEmoji: "🗺️",
    conceptSub: "Cloud Infrastructure Mapping",
    question: "Which component presents the LARGEST attack surface for initial compromise?",
    options: [
      "A. RDS databases — they store sensitive data and are high-value targets",
      "B. S3 buckets — misconfigured public access is extremely common",
      "C. Lambda functions — serverless code is harder to secure than VMs",
      "D. EC2 instances — they're full operating systems with many services"
    ],
    correct: 1,
    feedback: {
      correct: "Correct! S3 misconfiguration is the #1 AWS breach vector. Developers accidentally set buckets to public-read or use overly permissive IAM policies. APTs scan for exposed buckets using tools like Bucket Stream and S3Scanner before ever touching compute resources.",
      wrong: "The correct answer is B. While RDS, Lambda, and EC2 are valuable targets, S3 misconfiguration causes more breaches than any other AWS service. Public buckets are trivial to discover and often contain credentials, backups, or sensitive data. Attack surface mapping must prioritize storage misconfigurations.",
      breakdown: [
        {icon:"✅", text:"S3 misconfiguration is the #1 cloud breach vector — public buckets, overly permissive IAM, leaked credentials"},
        {icon:"💡", text:"Attack surface hierarchy: exposed storage → misconfigured IAM → vulnerable compute → application code"},
        {icon:"⚠️", text:"Don't assume RDS is more critical than S3 — S3 leaks credentials that unlock RDS access"}
      ]
    }
  },
  {
    id: 4,
    label: "Scenario 4 — Multi-Phase Decision Tree",
    title: "Choosing the Next Kill Chain Phase",
    body: "You've successfully completed reconnaissance on Altoro Mutual's web application and discovered it runs a vulnerable Apache Struts version (CVE-2017-5638). You've also identified their AWS infrastructure uses S3 buckets and EC2 instances. You have a working exploit for Struts and S3Scanner ready. Your pentest scope allows full exploitation. You need to decide your next move to maximize impact within the rules of engagement.",
    concept: "Kill Chain Progression Logic",
    conceptEmoji: "🧭",
    conceptSub: "Tactical Decision Making",
    question: "What is the most effective next phase to advance the assessment?",
    options: [
      "A. Immediately exploit Struts to get a web shell — it's a known vulnerability",
      "B. Run S3Scanner first to map data exposure before triggering IDS alerts",
      "C. Report findings now without exploitation — vulnerabilities are confirmed",
      "D. Launch both attacks simultaneously to test incident response capability"
    ],
    correct: 1,
    feedback: {
      correct: "Correct! S3Scanner is passive reconnaissance (no IDS alerts) and might reveal credentials, backups, or sensitive data that inform exploitation strategy. APTs gather maximum intelligence before triggering defensive responses. Exploiting Struts first risks detection and incident response before you understand the full attack surface.",
      wrong: "The correct answer is B. Professional pentesters (and APTs) maximize intelligence gathering before active exploitation. S3Scanner is passive and won't trigger alerts, but might reveal credentials or data that make the Struts exploit more effective. Exploiting first risks premature detection. Reporting without exploitation doesn't demonstrate full impact. Simultaneous attacks are noisy and unrealistic.",
      breakdown: [
        {icon:"✅", text:"Kill Chain logic: exhaust passive reconnaissance before moving to active exploitation"},
        {icon:"💡", text:"S3 enumeration is passive (DNS/API queries) — Struts exploitation is active and triggers alerts"},
        {icon:"⚠️", text:"APTs avoid triggering defenses until they have complete intelligence — stealth > speed"}
      ]
    }
  },
  {
    id: 5,
    label: "Scenario 5 — AI Tool Selection per Phase",
    title: "Matching AI Tools to Kill Chain Phases",
    body: "You're building an AI-enhanced pentest workflow for CIS 274's capstone project. You have Ollama with Mistral (general reasoning), CodeLlama (code analysis), and GPT-4 API access. You need to assign the right AI tool to each kill chain phase: Reconnaissance (OSINT synthesis), Weaponization (exploit customization), Post-Exploitation (log analysis), and Reporting (executive summary generation).",
    concept: "AI Tool Selection Strategy",
    conceptEmoji: "🤖",
    conceptSub: "Phase-Specific Automation",
    question: "Which AI tool assignment is most effective for the Weaponization phase?",
    options: [
      "A. Mistral — it can reason through exploit logic and suggest modifications",
      "B. CodeLlama — it specializes in understanding and modifying exploit code",
      "C. GPT-4 — it has the largest context window for complex payloads",
      "D. No AI — exploitation requires manual work for ethical/legal reasons"
    ],
    correct: 1,
    feedback: {
      correct: "Correct! CodeLlama is specifically trained on code understanding and generation. During Weaponization (customizing exploits, modifying payloads, adjusting shellcode), CodeLlama excels at analyzing existing exploit code and suggesting targeted modifications for your specific target environment.",
      wrong: "The correct answer is B. CodeLlama is purpose-built for code analysis and modification — exactly what Weaponization requires. While Mistral reasons well, it's not code-specialized. GPT-4's context window doesn't matter if the model isn't optimized for code. AI-assisted exploitation is legal in authorized pentests — you're customizing exploits, not automating the entire attack.",
      breakdown: [
        {icon:"✅", text:"CodeLlama = code-specific AI, ideal for exploit modification, shellcode analysis, payload customization"},
        {icon:"💡", text:"Tool matching: OSINT (Mistral) → Exploit code (CodeLlama) → Log analysis (Mistral) → Reporting (GPT-4)"},
        {icon:"⚠️", text:"AI doesn't replace pentester judgment — it accelerates code understanding and modification"}
      ]
    }
  },
  {
    id: 6,
    label: "Scenario 6 — Documentation Requirements",
    title: "Capturing Kill Chain Evidence",
    body: "You've progressed through Reconnaissance → Weaponization → Delivery → Exploitation phases during your Altoro Mutual assessment. You successfully exploited a SQL injection vulnerability and extracted database credentials. Your client wants a professional pentest report documenting each phase. You realize you didn't screenshot the initial WHOIS lookup or save the raw SQLMap output.",
    concept: "Pentest Documentation Standards",
    conceptEmoji: "📋",
    conceptSub: "Evidence Chain of Custody",
    question: "What documentation failure creates the biggest risk for your report?",
    options: [
      "A. Missing WHOIS screenshot — it's publicly available and easy to recreate",
      "B. Missing SQLMap output — you can't prove the exploitation method or validate findings",
      "C. Both equally critical — pentest reports require complete evidence chains",
      "D. Neither critical — verbal explanation of methodology is sufficient"
    ],
    correct: 1,
    feedback: {
      correct: "Correct! Missing SQLMap output is critical because you cannot prove the attack vector, demonstrate the exact injection point, or validate the extracted credentials. Reproduction evidence is the foundation of pentest credibility. WHOIS data can be recreated easily, but exploitation evidence is time-sensitive and must be captured during the test.",
      wrong: "The correct answer is B. Exploitation evidence (SQLMap output, injection payloads, extracted data) is irreplaceable and time-sensitive. You must prove the attack worked, show the exact method, and validate findings. WHOIS is static public data you can regenerate. Professional pentests require exploitation proof — screenshots, terminal output, packet captures. 'I found SQLi' without evidence isn't acceptable.",
      breakdown: [
        {icon:"✅", text:"Critical documentation: exploitation proof (command output, screenshots, payloads), privilege escalation steps, extracted data"},
        {icon:"💡", text:"Regenerable documentation: WHOIS, DNS records, public OSINT, static configuration scans"},
        {icon:"⚠️", text:"'A pentest not documented is a pentest not done' — evidence proves your claims and methodology"}
      ]
    }
  },
  {
    id: 7,
    label: "Scenario 7 — Ethical Boundaries in APT Simulation",
    title: "Recognizing Legal and Ethical Limits",
    body: "You're conducting the CIS 274 capstone pentest against Altoro Mutual's public test site. During reconnaissance, you discover their production environment at a different domain. The production site has the same vulnerabilities but handles real banking transactions. Your professor's scope explicitly covers only testfire.net. A classmate suggests 'testing production to show real-world impact' since it's the same company.",
    concept: "Ethical Hacking Boundaries",
    conceptEmoji: "⚖️",
    conceptSub: "Legal Authorization Limits",
    question: "What is the correct ethical and legal response?",
    options: [
      "A. Test production carefully — it's the same company and demonstrates real impact",
      "B. Test production but don't exploit — reconnaissance alone isn't illegal",
      "C. Do not test production — authorization is scope-specific, not company-wide",
      "D. Ask the company directly — they'll probably grant permission retroactively"
    ],
    correct: 2,
    feedback: {
      correct: "Correct! Authorization is scope-specific. Even reconnaissance outside your authorized scope is unauthorized access under CFAA (Computer Fraud and Abuse Act). Testing production without explicit written authorization is illegal, regardless of intent. Scope creep is how ethical hackers end up in legal trouble. Always stay within your signed authorization.",
      wrong: "The correct answer is C. Authorization is scope-specific, not company-wide. Testing production violates CFAA (18 U.S.C. § 1030) — unauthorized access to a computer system, even for 'research' or 'testing'. Reconnaissance outside scope is still unauthorized access. Retroactive permission doesn't exist legally. The difference between ethical hacking and cybercrime is written authorization.",
      breakdown: [
        {icon:"✅", text:"Legal rule: only test systems explicitly listed in your signed authorization — scope is not negotiable"},
        {icon:"💡", text:"CFAA applies to ANY unauthorized access — intent doesn't matter, authorization does"},
        {icon:"⚠️", text:"Scope creep is the #1 reason ethical hackers face criminal charges — never test outside your scope"}
      ]
    }
  }
];

let currentScenario = 0;
let score = 0;
let streak = 0;
let selectedAnswer = null;

function updateProgress() {
  const progress = ((currentScenario) / scenarios.length) * 100;
  document.getElementById('progress-bar').style.width = progress + '%';
  document.getElementById('progress-bar').setAttribute('aria-valuenow', progress);
  document.getElementById('score-display').textContent = score;
  document.getElementById('round-display').textContent = (currentScenario + 1) + '/' + scenarios.length;

  if (streak >= 3) {
    const streakEl = document.getElementById('streak-display');
    streakEl.classList.add('streak-flash');
    setTimeout(() => streakEl.classList.remove('streak-flash'), 600);
  }
}

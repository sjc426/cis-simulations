<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS 4345 — Final Review 🏁 The Cloud Gauntlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3350;
  --blue:#4f8ef7; --blue-dim:#1e2d4f;
  --green:#3ecf8e; --green-dim:#0d2e1f;
  --red:#f87171; --red-dim:#2e1010;
  --yellow:#fbbf24; --yellow-dim:#2e2208;
  --aws:#FF9900; --aws-dim:#2e1c00; --aws-border:#6b3f00;
  --azure:#0078D4; --azure-dim:#001e3c; --azure-border:#004080;
  --gcp:#34A853; --gcp-dim:#0a2410; --gcp-border:#1a5c2a;
  --text:#e8eaf6; --text2:#8b92b8; --text3:#4a5080;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); min-width:380px;
}
.skip-link{
  position:absolute; left:-999px; top:0; background:var(--blue); color:#fff;
  padding:10px 16px; z-index:200; font-family:var(--sans); font-weight:600;
  border-radius:0 0 8px 0;
}
.skip-link:focus{ left:0; }
button:focus-visible, a:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }

header.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; background:var(--surface); border-bottom:1px solid var(--border);
  flex-wrap:wrap; gap:10px; position:sticky; top:0; z-index:50;
}
.logo-row{ display:flex; align-items:center; gap:10px; }
.dots{ display:flex; gap:4px; }
.dot{ width:10px; height:10px; border-radius:50%; }
.dot.aws{ background:var(--aws); }
.dot.azure{ background:var(--azure); }
.dot.gcp{ background:var(--gcp); }
.title-block h1{
  font-size:1.05rem; margin:0; font-family:var(--mono); font-weight:600;
}
.title-block p{ margin:0; font-size:.75rem; color:var(--text2); }
.pills{ display:flex; gap:8px; flex-wrap:wrap; }
.pill{
  background:var(--surface2); border:1px solid var(--border); border-radius:20px;
  padding:6px 12px; font-family:var(--mono); font-size:.8rem; color:var(--text2);
  display:flex; align-items:center; gap:6px;
}
.pill strong{ color:var(--text); }
#streak-el.flash{ animation:flashPulse .6s ease; }
@keyframes flashPulse{
  0%{ background:var(--yellow-dim); box-shadow:0 0 0 0 rgba(251,191,36,.5);}
  50%{ background:var(--yellow-dim); box-shadow:0 0 0 6px rgba(251,191,36,0);}
  100%{ background:var(--surface2); }
}

.progress-wrap{ height:3px; background:var(--surface2); width:100%; }
.progress-bar{ height:100%; background:var(--blue); width:0%; transition:width .3s ease; }

main{ max-width:760px; margin:0 auto; padding:24px 16px 60px; }

.round-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:22px; margin-bottom:20px;
}
.round-label{
  font-family:var(--mono); font-size:.75rem; color:var(--text2); letter-spacing:.05em;
  text-transform:uppercase; margin-bottom:6px;
}
.round-card h2{ margin:0 0 12px; font-size:1.3rem; line-height:1.3; }
.round-body{ color:var(--text2); font-size:.95rem; line-height:1.55; margin-bottom:14px; }
.concept-badge{
  display:inline-flex; align-items:center; gap:8px; background:var(--blue-dim);
  border:1px solid var(--blue); border-radius:10px; padding:8px 14px; margin-bottom:16px;
}
.concept-badge .cb-emoji{ font-size:1.1rem; }
.concept-badge .cb-text strong{ display:block; font-size:.85rem; color:var(--text); }
.concept-badge .cb-text span{ font-size:.75rem; color:var(--text2); }

.question-text{ font-weight:600; margin:14px 0 12px; font-size:1rem; }

.options{ display:grid; gap:10px; }
.opt-btn{
  display:flex; align-items:flex-start; gap:10px; text-align:left;
  background:var(--surface2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:14px 16px; font-family:var(--sans); font-size:.92rem;
  cursor:pointer; transition:background .15s, border-color .15s;
  width:100%;
}
.opt-btn:hover:not(:disabled){ background:var(--blue-dim); border-color:var(--blue); }
.opt-btn:disabled{ cursor:default; }
.opt-btn.correct-answer{ background:var(--green-dim); border-color:var(--green); }
.opt-btn.wrong-answer{ background:var(--red-dim); border-color:var(--red); }
.opt-letter{
  font-family:var(--mono); font-weight:600; color:var(--blue); flex-shrink:0;
}
.opt-btn.correct-answer .opt-letter{ color:var(--green); }
.opt-btn.wrong-answer .opt-letter{ color:var(--red); }
.opt-icon{ margin-left:auto; font-size:1rem; flex-shrink:0; }

.fb{
  margin-top:18px; padding:18px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface2);
}
.fb.success{ border-color:var(--green); background:var(--green-dim); }
.fb.error{ border-color:var(--red); background:var(--red-dim); }
.fb-headline{
  display:flex; align-items:center; gap:8px; font-weight:600; font-size:1.05rem; margin-bottom:8px;
}
.fb-text{ color:var(--text); font-size:.92rem; line-height:1.5; margin-bottom:12px; }
.fb-breakdown{ display:grid; gap:8px; }
.fb-row{ display:flex; gap:10px; font-size:.88rem; color:var(--text2); align-items:flex-start; }
.fb-row .icon{ flex-shrink:0; }

.next-btn, .replay-btn{
  margin-top:16px; background:var(--blue); color:#fff; border:none; border-radius:10px;
  padding:12px 22px; font-family:var(--sans); font-weight:600; font-size:.95rem;
  cursor:pointer; display:inline-flex; align-items:center; gap:8px;
}
.next-btn:hover, .replay-btn:hover{ background:#3d7de0; }

.final-screen{ text-align:center; padding:30px 16px; }
.final-score{
  font-family:var(--mono); font-size:3.2rem; font-weight:600; color:var(--green); margin:10px 0;
}
.final-sub{ color:var(--text2); margin-bottom:26px; }
.stat-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px; margin-bottom:28px;
}
.stat-box{
  background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px;
}
.stat-box .num{ font-family:var(--mono); font-size:1.6rem; font-weight:600; color:var(--blue); }
.stat-box .lbl{ font-size:.8rem; color:var(--text2); margin-top:4px; }

.grade-msg{
  font-size:1.1rem; font-weight:600; margin-bottom:8px;
}

.hidden{ display:none; }

@media (max-width:520px){
  .title-block h1{ font-size:.9rem; }
  .round-card h2{ font-size:1.1rem; }
  .final-score{ font-size:2.4rem; }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:0.01ms !important;
    transition-duration:0.01ms !important;
  }
}
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="topbar">
  <div class="logo-row">
    <div class="dots" aria-hidden="true">
      <span class="dot aws"></span><span class="dot azure"></span><span class="dot gcp"></span>
    </div>
    <div class="title-block">
      <h1>CIS 4345 — Final Review <span aria-hidden="true">🏁</span></h1>
      <p>The Cloud Gauntlet — Week 16 Wrap-Up</p>
    </div>
  </div>
  <div class="pills">
    <div class="pill">Round <strong id="round-el">1/7</strong></div>
    <div class="pill" id="score-el" aria-live="polite" aria-atomic="true">Score <strong id="score-val">0</strong></div>
    <div class="pill" id="streak-el" aria-live="polite" aria-atomic="true">Streak <strong id="streak-val">0</strong></div>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Quiz progress"></div>
</div>

<main id="main-content">
  <div id="game-area"></div>
  <div id="final-area" class="hidden"></div>
</main>

<script>
const scenarios = [
  {
    id:1,
    label:"Scenario 1 — Three Landlords & Cloud Rosetta Stone",
    title:"Translating the Client's Requirements",
    body:"A client's SOW says: 'We need a fully managed relational database, a serverless function trigger, and object storage — but our architect only knows Azure terminology from a previous job.' You're building the AWS equivalent stack and need to map the Azure terms correctly.",
    concept:"Cloud Rosetta Stone — service name mapping across providers",
    conceptEmoji:"🗝️",
    conceptSub:"Same concept, different landlord, different name",
    question:"Which AWS service trio correctly matches Azure SQL Database, Azure Functions, and Azure Blob Storage?",
    options:[
      "A. Amazon RDS, AWS Lambda, Amazon S3",
      "B. Amazon DynamoDB, AWS Batch, Amazon EBS",
      "C. Amazon Redshift, AWS Fargate, Amazon Glacier",
      "D. Amazon Aurora Serverless, AWS Step Functions, Amazon EFS"
    ],
    correct:0,
    feedback:{
      correct:"Amazon RDS is AWS's managed relational database, AWS Lambda is the serverless compute trigger, and Amazon S3 is the object storage equivalent to Blob Storage. These three map directly across all three landlords with only naming differences.",
      wrong:"The correct mapping is Amazon RDS (managed relational DB), AWS Lambda (serverless functions), and Amazon S3 (object storage) — these are the direct functional equivalents of Azure SQL Database, Azure Functions, and Blob Storage.",
      breakdown:[
        {icon:"✅", text:"RDS = Azure SQL Database = Cloud SQL (GCP) — all managed relational DBs"},
        {icon:"💡", text:"Lambda = Azure Functions = Cloud Functions — the serverless compute trio"},
        {icon:"⚠️", text:"Don't confuse EBS (block storage for VMs) with S3 (object storage) — different purposes"}
      ]
    }
  },
  {
    id:2,
    label:"Scenario 2 — Core Infrastructure Recap",
    title:"The Midnight Storage Bottleneck",
    body:"A client's video-transcoding VM is timing out during high-load batch jobs. Monitoring shows the CPU is only at 40% utilization but disk I/O wait time is spiking. The VM currently uses standard HDD-backed storage.",
    concept:"Compute, Storage & Networking — matching storage type to workload",
    conceptEmoji:"💾",
    conceptSub:"IOPS vs throughput vs capacity tradeoffs",
    question:"What is the most cost-effective fix for this bottleneck?",
    options:[
      "A. Upgrade to a larger VM instance size with more vCPUs",
      "B. Switch the storage volume to SSD-backed storage with higher IOPS",
      "C. Add a load balancer in front of the VM",
      "D. Increase the VM's assigned RAM"
    ],
    correct:1,
    feedback:{
      correct:"Since CPU utilization is low but disk I/O wait is high, the bottleneck is storage performance, not compute. Moving to SSD-backed storage (higher IOPS and lower latency) directly targets the disk I/O wait problem without paying for unneeded compute.",
      wrong:"The correct fix is switching to SSD-backed storage with higher IOPS. The symptoms (low CPU, high I/O wait) point to a storage performance bottleneck — throwing more compute or RAM at it wastes money and won't fix the root cause.",
      breakdown:[
        {icon:"✅", text:"Low CPU + high I/O wait = storage bottleneck, not compute bottleneck"},
        {icon:"💡", text:"IOPS matters for many small read/writes; throughput matters for large sequential transfers"},
        {icon:"⚠️", text:"Common mistake: always upsizing the VM first without diagnosing which resource is actually constrained"}
      ]
    }
  },
  {
    id:3,
    label:"Scenario 3 — Modern Architectures",
    title:"Choosing the Right Compute Model",
    body:"A startup wants to deploy a microservices-based e-commerce app. Traffic is highly unpredictable — near zero at night, massive spikes during flash sales. They want to minimize idle cost and avoid managing servers directly.",
    concept:"Containers, Serverless & Databases — matching architecture to traffic pattern",
    conceptEmoji:"📦",
    conceptSub:"Container orchestration vs event-driven serverless",
    question:"Which architecture best fits this unpredictable, spiky traffic pattern while minimizing idle cost?",
    options:[
      "A. A fixed fleet of always-on EC2/VM instances sized for peak load",
      "B. A single large monolithic VM running all services",
      "C. Serverless functions (e.g., Lambda/Azure Functions) triggered by events, scaling to zero when idle",
      "D. A traditional on-premises data center with reserved capacity"
    ],
    correct:2,
    feedback:{
      correct:"Serverless functions scale automatically with demand and scale to zero cost when idle — ideal for spiky, unpredictable traffic like flash sales. You only pay for actual invocations, not idle capacity.",
      wrong:"Serverless is the right choice here. Fixed always-on fleets sized for peak load waste money during the 'near zero at night' periods, and a monolith or on-prem setup can't elastically handle sudden flash-sale spikes.",
      breakdown:[
        {icon:"✅", text:"Serverless = pay-per-invocation, scales to zero, ideal for spiky/unpredictable loads"},
        {icon:"💡", text:"Containers (e.g., Kubernetes) are great for steady, predictable microservices workloads"},
        {icon:"⚠️", text:"Don't assume containers always beat serverless — the right choice depends on traffic pattern, not just modernity"}
      ]
    }
  },
  {
    id:4,
    label:"Scenario 4 — Security, IAM & Compliance",
    title:"The Overprivileged Contractor Account",
    body:"A third-party contractor needs temporary access to read log files in one S3 bucket for a two-week audit. The current request is to grant them the AdministratorAccess policy 'to keep things simple.'",
    concept:"IAM — least privilege principle",
    conceptEmoji:"🔐",
    conceptSub:"Granting only the access actually needed, nothing more",
    question:"What is the best practice response to this request?",
    options:[
      "A. Approve AdministratorAccess since it's only temporary",
      "B. Create a scoped IAM policy granting read-only access to the specific bucket, with an expiration date",
      "C. Give the contractor the root account credentials directly",
      "D. Deny all access since contractors shouldn't have cloud accounts"
    ],
    correct:1,
    feedback:{
      correct:"The principle of least privilege means granting exactly the access needed — read-only on one specific bucket — and nothing more. Adding an expiration (via IAM policy conditions or temporary credentials) further limits risk exposure to the two-week window.",
      wrong:"The correct approach is a scoped, time-limited, read-only policy on that specific bucket. Granting AdministratorAccess 'for simplicity' is a textbook least-privilege violation and a common audit finding.",
      breakdown:[
        {icon:"✅", text:"Least privilege = minimum permissions needed to do the job, nothing extra"},
        {icon:"💡", text:"Use temporary credentials (like AWS STS) or time-bound policies for contractor/vendor access"},
        {icon:"⚠️", text:"'Just give them admin, it's easier' is one of the most common real-world security incidents"}
      ]
    }
  },
  {
    id:5,
    label:"Scenario 5 — Cost Management & Multi-Cloud",
    title:"The Surprise Egress Bill",
    body:"A company stores its primary analytics data in Google Cloud Storage but runs its compute and dashboards in AWS for cost reasons. Their monthly bill has an unexpectedly large 'data transfer out' charge they didn't budget for.",
    concept:"Cost Management & Multi-Cloud Strategy — egress costs and architecture planning",
    conceptEmoji:"💰",
    conceptSub:"Data gravity and cross-cloud transfer fees",
    question:"What is the most likely cause of this surprise charge, and what's the long-term fix?",
    options:[
      "A. It's a billing error — dispute the charge with the provider",
      "B. Cross-cloud data egress fees from repeatedly pulling data from GCP into AWS; consider co-locating compute and storage in the same provider or region",
      "C. The compute instances are oversized; downsize the EC2 fleet",
      "D. Enable auto-scaling to reduce the bill"
    ],
    correct:1,
    feedback:{
      correct:"Data egress (transfer out) fees are a major hidden cost in multi-cloud architectures, especially when compute in one provider repeatedly pulls large datasets from storage in another. The long-term fix is architectural: co-locate compute and storage in the same cloud/region, or use a data pipeline that minimizes cross-cloud transfer volume.",
      wrong:"This is a classic multi-cloud egress cost trap — data transfer OUT of a cloud provider (especially cross-provider) is often billed heavily, while data transfer IN is usually free. The fix is architectural, not just a billing dispute or resizing compute.",
      breakdown:[
        {icon:"✅", text:"Egress (data leaving a provider) is typically the expensive direction; ingress is usually free"},
        {icon:"💡", text:"Data gravity: it's often cheaper to move compute to the data than to move data to the compute"},
        {icon:"⚠️", text:"Multi-cloud strategies must budget for egress fees explicitly — they're easy to overlook in planning"}
      ]
    }
  },
  {
    id:6,
    label:"Scenario 6 — AI/ML in the Cloud",
    title:"Picking the Right ML Service Tier",
    body:"A marketing team wants to add sentiment analysis to customer reviews. They have no data science team and need something working within a week. A separate R&D team wants to train a fully custom fraud-detection model on proprietary data over several months.",
    concept:"AI/ML in the Cloud — pre-built APIs vs custom ML platforms",
    conceptEmoji:"🤖",
    conceptSub:"Managed AI services vs full ML training platforms",
    question:"Which pairing of cloud AI offerings correctly matches each team's need?",
    options:[
      "A. Marketing team: build a custom model from scratch. R&D team: use a pre-built sentiment API.",
      "B. Marketing team: use a pre-built NLP/sentiment analysis API (e.g., Comprehend, Cognitive Services, Natural Language API). R&D team: use a full ML platform (e.g., SageMaker, Azure ML, Vertex AI) to train a custom model.",
      "C. Both teams should use the same pre-built sentiment API to save cost.",
      "D. Both teams should train custom models on-premises to avoid cloud AI costs entirely."
    ],
    correct:1,
    feedback:{
      correct:"Pre-built AI APIs (Comprehend, Cognitive Services, Natural Language API) are ideal for common tasks like sentiment analysis with no ML expertise needed and fast turnaround. Full ML platforms (SageMaker, Azure ML, Vertex AI) are built for teams that need to train, tune, and deploy custom models on proprietary data — exactly what the fraud-detection use case requires.",
      wrong:"The marketing team (no data science team, tight deadline, generic task) should use a pre-built sent

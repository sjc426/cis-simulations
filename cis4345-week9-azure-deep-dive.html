<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS 4345 — Azure Deep Dive ☁️ Master the Landlord's Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3350;
    --blue:#4f8ef7; --blue-dim:#1e2d4f;
    --green:#3ecf8e; --green-dim:#0d2e1f;
    --red:#f87171; --red-dim:#2e1010;
    --yellow:#fbbf24; --yellow-dim:#2e2208;
    --aws:#FF9900; --aws-dim:#2e1c00; --aws-border:#6b3f00;
    --azure:#0078D4; --azure-dim:#001e3c; --azure-border:#004080;
    --gcp:#34A853; --gcp-dim:#0a2410; --gcp-border:#1a5c2a;
    --text:#e8eaf6; --text2:#8b92b8; --text3:#4a5080;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); min-width:380px;
  }
  .skip-link{
    position:absolute; left:-999px; top:0; background:var(--blue); color:#fff;
    padding:10px 16px; z-index:1000; border-radius:0 0 8px 0; font-family:var(--sans);
  }
  .skip-link:focus{ left:0; }

  header{
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    position:sticky; top:0; z-index:50;
  }
  .logo{ display:flex; align-items:center; gap:8px; font-family:var(--mono); font-weight:600; }
  .dots{ display:flex; gap:4px; }
  .dot{ width:10px; height:10px; border-radius:50%; }
  .dot.aws{ background:var(--aws); }
  .dot.azure{ background:var(--azure); }
  .dot.gcp{ background:var(--gcp); }
  .title-block{ display:flex; flex-direction:column; }
  .title-block h1{ font-size:1.05rem; margin:0; font-weight:600; }
  .title-block .subtitle{ font-size:0.75rem; color:var(--text2); font-family:var(--mono); }
  .pills{ display:flex; gap:8px; margin-left:auto; flex-wrap:wrap; }
  .pill{
    background:var(--surface2); border:1px solid var(--border); border-radius:999px;
    padding:6px 14px; font-family:var(--mono); font-size:0.8rem; display:flex; gap:6px; align-items:center;
  }
  .pill .label{ color:var(--text2); }
  .pill .val{ color:var(--text); font-weight:600; }
  .pill.streak-hot{ border-color:var(--yellow); }

  .progress-wrap{ background:var(--surface); }
  .progress-bar-bg{ height:3px; background:var(--border); width:100%; }
  .progress-bar-fill{ height:3px; background:var(--blue); transition:width 0.3s ease; }

  main{ max-width:760px; margin:0 auto; padding:24px 16px 60px; }

  .round-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:24px; margin-bottom:20px;
  }
  .round-label{ font-family:var(--mono); color:var(--text2); font-size:0.8rem; margin-bottom:6px; }
  .round-card h2{ font-size:1.3rem; margin:0 0 14px; line-height:1.35; }
  .round-body{ color:var(--text); line-height:1.6; margin-bottom:16px; font-size:0.98rem; }
  .concept-badge{
    display:inline-flex; align-items:center; gap:8px; background:var(--azure-dim);
    border:1px solid var(--azure-border); color:var(--text); border-radius:8px;
    padding:8px 12px; font-family:var(--mono); font-size:0.82rem; margin-bottom:18px;
  }
  .concept-badge .sub{ color:var(--text2); }

  .question{ font-weight:600; margin:14px 0; font-size:1rem; }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt-btn{
    display:flex; gap:10px; align-items:flex-start; text-align:left;
    background:var(--surface2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:14px 16px; font-family:var(--sans); font-size:0.95rem;
    cursor:pointer; transition:background 0.15s, border-color 0.15s, transform 0.1s;
    width:100%;
  }
  .opt-btn:hover:not(:disabled){ background:var(--blue-dim); border-color:var(--blue); }
  .opt-btn:active:not(:disabled){ transform:scale(0.995); }
  .opt-btn:disabled{ cursor:default; }
  .opt-letter{
    font-family:var(--mono); font-weight:600; color:var(--blue); min-width:22px;
  }
  .opt-btn.correct-answer{ background:var(--green-dim); border-color:var(--green); }
  .opt-btn.wrong-answer{ background:var(--red-dim); border-color:var(--red); }
  .opt-btn.correct-answer .opt-letter{ color:var(--green); }
  .opt-btn.wrong-answer .opt-letter{ color:var(--red); }

  button:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
  a:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }

  .fb{
    margin-top:20px; border-radius:12px; padding:18px 20px;
    border:1px solid var(--border); background:var(--surface2);
  }
  .fb.correct{ border-color:var(--green); background:var(--green-dim); }
  .fb.wrong{ border-color:var(--red); background:var(--red-dim); }
  .fb-head{ display:flex; align-items:center; gap:10px; font-weight:600; font-size:1.05rem; margin-bottom:8px; }
  .fb-text{ line-height:1.55; margin-bottom:14px; }
  .fb-breakdown{ display:flex; flex-direction:column; gap:8px; }
  .fb-row{ display:flex; gap:10px; align-items:flex-start; font-size:0.92rem; line-height:1.5; }
  .fb-row .icon{ flex-shrink:0; }

  .btn-row{ display:flex; justify-content:flex-end; margin-top:20px; }
  .next-btn, .replay-btn{
    background:var(--blue); color:#fff; border:none; border-radius:8px;
    padding:12px 24px; font-family:var(--sans); font-weight:600; font-size:0.95rem;
    cursor:pointer;
  }
  .next-btn:hover, .replay-btn:hover{ background:#3d7de0; }

  .final-screen{ text-align:center; padding:20px 0; }
  .final-screen h2{ font-size:1.6rem; margin-bottom:4px; }
  .final-score{
    font-family:var(--mono); font-size:3.2rem; font-weight:600; color:var(--blue); margin:14px 0;
  }
  .stat-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px; margin:24px 0;
  }
  .stat-box{
    background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:16px;
  }
  .stat-box .num{ font-family:var(--mono); font-size:1.5rem; font-weight:600; color:var(--text); }
  .stat-box .label{ color:var(--text2); font-size:0.8rem; margin-top:4px; }

  .streak-flash{
    animation:flash 0.6s ease;
  }
  @keyframes flash{
    0%{ box-shadow:0 0 0 0 rgba(251,191,36,0.6); }
    50%{ box-shadow:0 0 0 8px rgba(251,191,36,0.15); }
    100%{ box-shadow:0 0 0 0 rgba(251,191,36,0); }
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  @media (max-width:480px){
    .pills{ gap:6px; }
    .pill{ padding:5px 10px; font-size:0.72rem; }
    .round-card{ padding:18px; }
    header{ padding:12px 14px; }
  }
</style>
</head>

  <div class="pills">
    <div class="pill"><span class="label">Score</span> <div id="score-el" class="val" aria-live="polite" aria-atomic="true">0</div></div>
    <div class="pill"><span class="label">Round</span> <span class="val" id="round-el">1/7</span></div>
    <div class="pill" id="streak-pill"><span class="label">Streak</span> <div id="streak-el" class="val" aria-live="polite" aria-atomic="true">0</div></div>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"
      role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Quiz progress"></div>
  </div>
</div>

<main id="main-content">
  <div id="game-area"></div>
</main>

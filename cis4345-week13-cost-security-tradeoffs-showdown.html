<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS 4345 — Cost, Security & Real-World Tradeoffs 💰 The Three Landlords Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3350;
  --blue:#4f8ef7; --blue-dim:#1e2d4f;
  --green:#3ecf8e; --green-dim:#0d2e1f;
  --red:#f87171; --red-dim:#2e1010;
  --yellow:#fbbf24; --yellow-dim:#2e2208;
  --aws:#FF9900; --aws-dim:#2e1c00; --aws-border:#6b3f00;
  --azure:#0078D4; --azure-dim:#001e3c; --azure-border:#004080;
  --gcp:#34A853; --gcp-dim:#0a2410; --gcp-border:#1a5c2a;
  --text:#e8eaf6; --text2:#8b92b8; --text3:#4a5080;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  min-width:380px; line-height:1.5;
}
.skip-link{
  position:absolute; left:-9999px; top:0; background:var(--blue); color:#fff;
  padding:10px 16px; z-index:1000; border-radius:0 0 6px 0; font-weight:600;
}
.skip-link:focus{ left:0; }

button:focus-visible, a:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }

header{
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  position:sticky; top:0; z-index:10;
}
.logo-dots{ display:flex; gap:5px; flex-shrink:0; }
.logo-dots span{
  width:12px; height:12px; border-radius:50%; display:inline-block;
}
.dot-aws{background:var(--aws);}
.dot-azure{background:var(--azure);}
.dot-gcp{background:var(--gcp);}
header h1{
  font-size:1.05rem; margin:0; font-family:var(--mono); font-weight:600;
  color:var(--text); flex:1; min-width:180px;
}
.pills{ display:flex; gap:8px; flex-wrap:wrap; }
.pill{
  background:var(--surface2); border:1px solid var(--border); border-radius:20px;
  padding:6px 14px; font-family:var(--mono); font-size:0.85rem; color:var(--text2);
  white-space:nowrap;
}
.pill strong{ color:var(--text); }
.pill.streak-hot{ border-color:var(--yellow); color:var(--yellow); }

.progress-wrap{
  height:3px; width:100%; background:var(--surface2);
}
.progress-bar{
  height:100%; background:linear-gradient(90deg, var(--aws), var(--azure), var(--gcp));
  width:0%; transition:width 0.4s ease;
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
}

main{
  max-width:760px; margin:0 auto; padding:24px 16px 60px;
}

.round-card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:24px; margin-bottom:20px;
}
.round-label{
  font-family:var(--mono); color:var(--text2); font-size:0.85rem;
  text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px;
}
.round-card h2{
  margin:0 0 14px; font-size:1.4rem; color:var(--text);
}
.round-body{
  color:var(--text2); font-size:1rem; margin-bottom:16px;
}
.concept-badge{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--blue-dim); border:1px solid var(--blue); color:var(--blue);
  border-radius:8px; padding:8px 14px; font-family:var(--mono); font-size:0.85rem;
  margin-bottom:20px;
}
.concept-badge .sub{ color:var(--text2); font-family:var(--sans); }

.question-text{
  font-weight:600; margin-bottom:14px; font-size:1.05rem;
}

.options{ display:flex; flex-direction:column; gap:10px; }
.option-btn{
  background:var(--surface2); border:1px solid var(--border); color:var(--text);
  text-align:left; padding:14px 16px; border-radius:8px; font-family:var(--sans);
  font-size:0.98rem; cursor:pointer; transition:background 0.2s, border-color 0.2s;
  width:100%;
}
.option-btn:hover:not(:disabled){ background:var(--surface); border-color:var(--blue); }
.option-btn:disabled{ cursor:not-allowed; }
.option-btn.selected{ border-color:var(--blue); background:var(--blue-dim); }
.option-btn.correct-answer{ border-color:var(--green); background:var(--green-dim); color:var(--green); }
.option-btn.wrong-answer{ border-color:var(--red); background:var(--red-dim); color:var(--red); }

.fb{
  margin-top:20px; padding:20px; border-radius:10px; border:1px solid var(--border);
  animation:fadeIn 0.3s ease;
}
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
.fb.correct{ background:var(--green-dim); border-color:var(--green); }
.fb.wrong{ background:var(--red-dim); border-color:var(--red); }
.fb-title{ font-weight:600; font-size:1.05rem; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.fb.correct .fb-title{ color:var(--green); }
.fb.wrong .fb-title{ color:var(--red); }
.fb-text{ color:var(--text); margin-bottom:14px; }
.fb-breakdown{ display:flex; flex-direction:column; gap:8px; }
.fb-row{
  display:flex; gap:10px; align-items:flex-start; font-size:0.92rem; color:var(--text2);
  background:var(--surface); border-radius:6px; padding:10px 12px;
}
.fb-row .icon{ flex-shrink:0; }

.streak-flash{
  display:inline-block; margin-left:8px; padding:4px 10px; border-radius:6px;
  background:var(--yellow-dim); color:var(--yellow); font-family:var(--mono);
  font-size:0.8rem; animation:pulse 0.6s ease;
}
@keyframes pulse{ 0%{transform:scale(0.8); opacity:0;} 50%{transform:scale(1.05);} 100%{transform:scale(1); opacity:1;} }

.next-btn{
  margin-top:20px; background:var(--blue); color:#fff; border:none; padding:14px 28px;
  border-radius:8px; font-family:var(--sans); font-weight:600; font-size:1rem;
  cursor:pointer; width:100%;
}
.next-btn:hover{ background:#3d7ce0; }

.final-screen{ text-align:center; padding:30px 16px; }
.final-screen h2{ font-size:1.6rem; margin-bottom:6px; }
.score-big{
  font-family:var(--mono); font-size:3.2rem; font-weight:600; color:var(--blue);
  margin:16px 0;
}
.stat-boxes{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px; margin:24px 0;
}
.stat-box{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:16px;
}
.stat-box .num{ font-family:var(--mono); font-size:1.6rem; font-weight:600; color:var(--text); }
.stat-box .lbl{ color:var(--text2); font-size:0.85rem; margin-top:4px; }
.replay-btn{
  background:var(--green); color:#06231a; border:none; padding:14px 32px;
  border-radius:8px; font-weight:600; font-size:1rem; cursor:pointer; margin-top:10px;
}
.replay-btn:hover{ background:#33b57c; }

footer.hint{
  text-align:center; color:var(--text3); font-size:0.8rem; margin-top:30px; font-family:var(--mono);
}

@media (max-width:480px){
  header{ padding:12px 14px; }
  header h1{ font-size:0.9rem; }
  .pill{ font-size:0.75rem; padding:5px 10px; }
  .round-card{ padding:18px; }
  .score-big{ font-size:2.4rem; }
}
</style>
</head>

<header>
  <div class="logo-dots" aria-hidden="true">

  <div class="pills">
    <div class="pill" id="round-pill">Scenario <strong id="round-num">1</strong>/6</div>
    <div class="pill" aria-live="polite" aria-atomic="true" id="score-el">Score: <strong id="score-num">0</strong></div>
    <div class="pill" aria-live="polite" aria-atomic="true" id="streak-el">Streak: <strong id="streak-num">0</strong></div>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Quiz progress"></div>
</div>

<main id="main-content">
  <div id="game-area"></div>

<script>

  {

      wrong:"The right move is B — use Cost Explorer to see the breakdown by service/tag/region FIRST. Cutting instances blindly (A) risks killing production workloads, and switching providers (D) doesn't fix the root cause of an untracked spend problem.",
      breakdown:[
        {icon:"✅", text:"Cost Explorer / Cost Management / Cost Table are the native dashboards for each of the Three Landlords — always start there."},
        {icon:"💡", text:"Tagging resources by team/project is what makes cost breakdowns actually useful — untagged spend is invisible spend."},
        {icon:"⚠️", text:"Never terminate resources reactively without first confirming what they're doing — you could take down production."}
      ]
    }
  },
  {
    id:2,
    label:"Scenario 2 — Reserved Instances",
    title:"The Database That Never Sleeps",
    body:"Your company runs a production PostgreSQL database on an EC2 instance that has been running 24/7 for two years and will keep running for the foreseeable future. It's on-demand pricing right now, and your manager wants the bill down without any performance risk.",

    conceptEmoji:"📅",
    conceptSub:"Committing to steady-state workloads for discounts",
    question:"What's the smartest pricing move here?",
    options:[
      "A. Move it to Spot Instances since they're the cheapest option available",

      breakdown:[
        {icon:"✅", text:"RIs offer the deepest discounts for workloads that run continuously and predictably, like this database."},
        {icon:"💡", text:"Spot Instances are best for fault-tolerant, interruptible workloads — batch jobs, not production databases."},
        {icon:"⚠️", text:"Downsizing without checking performance metrics (D) can cause outages — always right-size based on actual utilization data."}
      ]
    }
  },
  {
    id:3,
    label:"Scenario 3 — Savings Plans & Committed Use Discounts",
    title:"The Team That Keeps Changing Instance Types",
    body:"Your DevOps team constantly experiments — swapping between compute-optimized and memory-optimized instance families as workloads evolve. Reserved Instances feel too rigid since they lock you into a specific instance family, but leadership still wants a committed-spend discount.",
    concept:"Savings Plans & Committed Use Discounts",
    conceptEmoji:"🤝",
    conceptSub:"Flexible commitment models across the Three Landlords",
    question:"Which pricing model fits this team's needs best?",
    options:[
      "A. A Standard Reserved Instance locked to one instance family for 3 years",

    correct:1,
    feedback:{
      correct:"Savings Plans (AWS) and Committed Use Discounts (GCP) let you commit to a $/hour spend level rather than a specific instance family — you keep flexibility to shift instance types while still earning a discount.",
      wrong:"The right answer is B. Standard RIs (A) lock you to a specific instance family, which conflicts with a team that changes instance types often. Savings Plans / CUDs solve exactly this problem by rewarding committed SPEND rather than a fixed instance type.",

        {icon:"💡", text:"Across the Three Landlords: AWS = Savings Plans, Azure = Reserved Instances with instance size flexibility, GCP = Committed Use Discounts."},

      ]

  },
  {
    id:4,
    label:"Scenario 4 — Cost Optimization Strategies",
    title:"The Forgotten Dev Environment",
    body:"During a cost audit, you discover a development environment with 6 EC2 instances, 3 unattached EBS volumes, and 2 idle load balancers — all running since a project that ended 8 months ago. Nobody remembered to clean it up, and it's been quietly costing $2,200/month.",
    concept:"Cost Optimization Strategies",
    conceptEmoji:"🧹",
    conceptSub:"Rightsizing, cleanup, and eliminating waste",
    question:"What's the best combination of actions here?",
    options:[
      "A. Buy Reserved Instances for these dev servers since they've been running a long time",

        {icon:"💡", text:"Tagging + budget alerts (AWS Budgets, Azure Cost Alerts, GCP Budget Alerts) catch waste before it becomes an 8-month problem."},
        {icon:"⚠️", text:"Never commit (RIs/Savings Plans) to resources you haven't verified are actually needed — that locks in waste."}
      ]
    }
  },
  {
    id:5,
    label:"Scenario 5 — Shared Responsibility Model Across the Three Landlords",
    title:"Who Patches What?",
    body:"A security audit flags an unpatched OS vulnerability on a virtual machine your company runs in Azure. The IT director insists 'Microsoft handles security, that's why we pay them' and wants to close the ticket without action.",

    conceptEmoji:"🏢",
    conceptSub:"Security 'OF' the cloud vs. security 'IN' the cloud",
    question:"What's the accurate response to the IT director?",
    options:[
      "A. Correct — the cloud provider is fully responsible for all security in every scenario",
